    function itemAdPerformanceTable(rows) {
      if (!rows.length) return `<div class="empty">当前筛选范围没有 Item 数据</div>`;
      const sorted = sortRows(rows, 'adsSummary');
      const matched = sortRows(rows.filter(row => row.hasPlp).sort((a, b) => b.plpImpressions - a.plpImpressions), 'plpMatched');
      const matchedTable = `<div class="panel-head"><h3>已匹配 PLP 的 Item 链接</h3><span class="badge blue">${fmt(matched.length)} 个</span></div><div class="table-wrap"><table id="plpMatchedItems"><thead><tr>${sortHeader('Item 链接', 'itemId', 'plpMatched')}${sortHeader('标题', 'title', 'plpMatched')}${sortHeader('Campaign', 'plpCampaigns', 'plpMatched')}${sortHeader('PLP曝光', 'plpImpressions', 'plpMatched', 'plp-col')}${sortHeader('PLP点击', 'plpClicks', 'plpMatched', 'plp-col')}${sortHeader('PLP CTR', 'plpCtr', 'plpMatched', 'plp-col')}${sortHeader('PLP广告费', 'plpFees', 'plpMatched', 'plp-col')}</tr></thead><tbody>${matched.map(row => `<tr><td><a href="${esc(row.link)}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700;text-decoration:underline">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td style="text-align:left">${esc(row.plpCampaigns.join('、'))}</td><td class="plp-col" data-value="plp-impressions">${fmt(row.plpImpressions)}</td><td class="plp-col">${fmt(row.plpClicks)}</td><td class="plp-col">${pct(row.plpCtr)}</td><td class="plp-col">${money(row.plpFees)}</td></tr>`).join('')}</tbody></table></div>`;
      const comparisonTable = `<div class="panel-head"><h3>全部 Item 的 PLG / PLP 对照</h3><small>没有对应 PLP 数据的 Item 显示 —</small></div><div class="table-wrap"><table id="itemAdPerformance" class="ad-summary-table"><thead><tr><th colspan="2">Item</th><th colspan="5" class="plg-col" style="text-align:center">PLG</th><th colspan="5" class="plp-col" style="text-align:center">PLP（已匹配 ${fmt(matched.length)} 个 Item）</th></tr><tr>${sortHeader('Item ID', 'itemId', 'adsSummary')}${sortHeader('标题', 'title', 'adsSummary')}${sortHeader('PLG曝光', 'adImpressions', 'adsSummary', 'plg-col')}${sortHeader('PLG点击', 'adClicks', 'adsSummary', 'plg-col')}${sortHeader('PLG CTR', 'adCtr', 'adsSummary', 'plg-col')}${sortHeader('PLG广告费', 'adFees', 'adsSummary', 'plg-col')}${sortHeader('PLG ROAS', 'roas', 'adsSummary', 'plg-col')}${sortHeader('PLP曝光', 'plpImpressions', 'adsSummary', 'plp-col')}${sortHeader('PLP点击', 'plpClicks', 'adsSummary', 'plp-col')}${sortHeader('PLP CTR', 'plpCtr', 'adsSummary', 'plp-col')}${sortHeader('PLP广告费', 'plpFees', 'adsSummary', 'plp-col')}${sortHeader('PLP ROAS', 'plpRoas', 'adsSummary', 'plp-col')}</tr></thead><tbody>${sorted.map(row => `<tr><td><a href="${esc(row.link)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td class="plg-col">${row.hasPlg ? fmt(row.adImpressions) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.adClicks) : '—'}</td><td class="plg-col">${row.hasPlg ? pct(row.adCtr) : '—'}</td><td class="plg-col">${row.hasPlg ? money(row.adFees) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.roas, 2) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpImpressions) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpClicks) : '—'}</td><td class="plp-col">${row.hasPlp ? pct(row.plpCtr) : '—'}</td><td class="plp-col">${row.hasPlp ? money(row.plpFees) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpRoas, 2) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
      return matchedTable + comparisonTable;
    }

    function trafficSnapshot() {
      const rows = latestTrafficRows();
      if (!rows.length) return '';
      const start = rows[0].start, end = rows[0].end;
      const impressions = sum(rows, 'totalImpressions');
      const views = sum(rows, 'totalPageViews');
      const sold = sum(rows, 'quantitySold');
      const onsiteViews = sum(rows, 'promotedEbayViews') + sum(rows, 'organicEbayViews');
      // 换品链接明细：销量已剔除非本体时期出单，曝光/PV 等其余数值保留
      const swaps = (trafficSelection().swaps || []).slice(0, 8);
      const swapsTotal = (trafficSelection().swaps || []).length;
      const swapHtml = start !== end && swapsTotal ? `<div class="snapshot-note"><strong>⚠ 区间内换过标题/商品的链接（销量已剔除非本体时期出单；曝光/PV 等其余数值保留）：</strong>${swaps.map(s => {
        const hist = s.manual
          ? `人工核对剔除（${esc(s.manual.reason)}）`
          : s.foreign.length
            ? s.foreign.map(h => `曾为「${esc(h.t.length > 34 ? h.t.slice(0, 34) + '…' : h.t)}」（${h.f.slice(5)}~${h.l.slice(5)}，${h.p ? esc(h.p) : '非目标产品'}）`).join('；')
            : `日报仅覆盖 ${s.coveredDays}/${s.dayCount} 天`;
        const gap = s.manual
          ? `快照按窗口扣减 ${fmt(s.manualExcluded)} 台`
          : s.dailyImp == null ? `快照曝光 ${fmt(s.snapshotImp)}，区间内无日报记录` : `快照曝光 ${fmt(s.snapshotImp)} vs 日报相加 ${fmt(s.dailyImp)}（差 ${s.gapImp > 0 ? '+' : ''}${fmt(s.gapImp)}）`;
        const srow = rows.find(r => r.itemId === s.itemId);
        const soldLine = !srow ? '' : srow.soldManual
          ? `；销量：快照累计 ${fmt(srow.soldRaw)} → 人工核对剔除 ${fmt(srow.soldExcluded)} 台（非本体出单），本体 ${fmt(srow.quantitySold)} 台`
          : srow.soldUncertain && srow.soldExcluded != null && srow.soldExcluded > 0
          ? `；销量：本体时期日报覆盖不全，暂按已覆盖日报 ${fmt(srow.quantitySold)}（快照原值 ${fmt(srow.soldRaw)}，剔除或有偏差）`
          : srow.soldUncertain
            ? `；销量：本体时期日报覆盖不全，保留快照原值 ${fmt(srow.soldRaw ?? srow.quantitySold)}（可能含前身出单）`
            : srow.soldExcluded != null && srow.soldExcluded > 0
              ? `；销量：快照累计 ${fmt(srow.soldRaw)} → 本体时期 ${fmt(srow.quantitySold)}（已剔除前身出单 ${fmt(srow.soldExcluded)} 台）`
              : '；销量：快照值即本体时期出单，未剔除';
        return `<div>· <span class="mono">${esc(s.itemId)}</span> ${hist} — ${gap}${soldLine}</div>`;
      }).join('')}${swapsTotal > 8 ? `<div>…等共 ${swapsTotal} 个</div>` : ''}快照按导出时标题把整个区间归属给该链接：销量已改用日报重算的本体时期出单，曝光/PV 等其余数值仍含前身商品数据、按口径保留。</div>` : '';
      return `<section class="panel snapshot"><div class="panel-head"><h3>Traffic 区间快照</h3><span class="badge ${start === end ? 'green' : 'amber'}">${start === end ? '单日' : '区间累计'}</span></div><div class="panel-body">
        ${start !== end ? `<p class="snapshot-note">这份 Traffic 是 ${rangeText(start, end)} 的累计数据，只用于区间汇总，不会混入上方的日度趋势。</p>` : ''}
        <div class="snapshot-metrics">
          <div class="snapshot-metric"><span>链接总曝光</span><strong>${fmt(impressions)}</strong></div>
          <div class="snapshot-metric"><span>总 Page views</span><strong>${fmt(views)}</strong></div>
          <div class="snapshot-metric"><span>Quantity sold</span><strong>${fmt(sold)}</strong></div>
          <div class="snapshot-metric"><span>站内 CTR</span><strong>${pct(onsiteViews / impressions || 0)}</strong></div>
          <div class="snapshot-metric"><span>总转化率</span><strong>${pct(sold / views || 0)}</strong></div>
        </div>${swapHtml}</div></section>`;
    }

    // ── 每日记录 · 报表更新情况（2026-11-25 改版）──────────────────────────────
    // 这一屏回答的是判断题：「各类报表哪天已经下载、哪天 eBay 明确回空、哪天还没下」。
    // 每日指标不在这里看（去「经营看板 / Item 明细」）。
    // 判据全部来自构建端写进 bundle 的 coverage 台账（只记事实，不做推测）：
    //   ● 有数据        = 这份报表解析出了数据行
    //   ○ 已核实无数据  = 归档里有 eBay 回空的空报表（占位文件）
    //   ✕ 缺            = 上面两种文件都没有
    // 为什么不用「曝光 > 0」判缺（2026-11-25 实证）：eBay 在当天没有搜索发生时会给
    // 「全量关键词行、曝光全 0」的空壳报表，按曝光判会把它们当缺口 —— 那轮 21 条补数命令
    // 全部回空后逐条核对，确认当天曝光确实都是 0。所以这里只认「有没有文件」。
    const COVERAGE_TYPES = [
      { key: 'trafficDaily', label: 'Traffic 日度', note: '每天一份（单日报表）' },
      { key: 'plg', label: 'PLG', note: '广告活动报表（General）' },
      { key: 'listing', label: 'PLP 链接', ad: true, note: '按活动、单日下载' },
      { key: 'keyword', label: 'PLP 关键词', ad: true, note: '按活动、单日下载' },
      { key: 'search', label: 'PLP 搜索词', ad: true, note: '按活动、单日下载' }
    ];
    const COV_GLYPH = { have: '●', partial: '◐', blank: '○', miss: '✕', pending: '·' };

    const covNorm = value => clean(value).replace(/\s+/g, ' ').toLowerCase();
    // 「已知不可得」（bundle.knownGaps）：确认**永远拿不到**的报表 —— 例如某活动的 eBay 弹窗里
    // 根本没有 keyword 报表选项。不标的话它每天挂在缺失清单里当噪音，还容易被当成漏下载反复去补。
    // 匹配规则：kind 相同 + 活动名归一化后相同（行里的名字可能带连续空格，所以要归一化）；* 可通配。
    function knownGapNote(kind, campaign) {
      const list = (typeof fullState !== 'undefined' && fullState && fullState.knownGaps)
        || dataState.knownGaps
        || [];
      const name = covNorm(campaign);
      for (const item of list) {
        if (!item || covNorm(item.kind) !== covNorm(kind)) continue;
        const raw = covNorm(item.campaign || '');
        if (!raw) continue;
        const pattern = raw.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*');
        if (new RegExp('^' + pattern + '$').test(name)) return item.note || '已知不可得';
      }
      return '';
    }
    const covAddDays = (iso, days) => { const date = new Date(`${iso}T00:00:00Z`); date.setUTCDate(date.getUTCDate() + days); return date.toISOString().slice(0, 10); };

    function coverageState() {
      const cov = dataState.coverage || null;
      return {
        present: Boolean(cov),
        days: (cov && cov.days) || {},
        empty: (cov && cov.empty) || {},
        ranges: (cov && cov.trafficRanges) || [],
        active: (cov && cov.activeDays) || []
      };
    }

    // 某个广告类型下出现过的活动。链接报表是**按产品过滤后**的行，关键词/搜索词是全量的；
    // 行里的活动名可能带连续空格（`US. TD. PLP.  ad600 elite...`），所以一律归一化后比。
    // 本店负责的活动（与「广告活动」面板同一来源）：PLG 行 + PLP 链接行的活动。
    // 这两处已经是产品范围内的，并且已经剔除了 excludedCampaigns 里的「非我方活动」。
    // 必须有这道过滤：整店优先促刊报表会带进来几十个不在我们范围的活动，全列出来纯噪音
    // （实测新店 PLP 链接一份整店报表带 31 个活动）。
    function coverageMineCampaigns() {
      // 取 fullState（本店全部数据）而不是 dataState：dataState 是按**当前产品**过滤过的，
      // 于是「在新店看默认产品 AD600 Elite」时会一个活动都取不到，退回全量又会把整店报表里
      // 那几十个不属于我们的活动带回来（实测：新店 PLP 链接因此显示 31 个活动 / 29 个有缺）。
      // 覆盖台账是店铺级事实，活动范围就该是「本店负责的活动」，不随产品切换变化。
      const source = (typeof fullState !== 'undefined' && fullState && fullState.plgRaw) ? fullState : dataState;
      return new Set(unique([
        ...source.plgRaw.map(row => row.campaign),
        ...((source.ads || {}).plpRows || []).map(row => row.campaign)
      ]).map(covNorm));
    }

    function coverageCampaigns(kind) {
      const { days, empty } = coverageState();
      const mine = coverageMineCampaigns();
      const map = new Map();
      const add = (bag, date, name) => {
        const key = covNorm(name);
        if (!key) return;
        if (!map.has(key)) map.set(key, { name, have: new Set(), blank: new Set() });
        map.get(key)[bag].add(date);
      };
      Object.entries(days[kind] || {}).forEach(([date, names]) => (names || []).forEach(name => add('have', date, name)));
      Object.entries(empty[kind] || {}).forEach(([date, names]) => (names || []).forEach(name => add('blank', date, name)));
      // 活动列表按当前产品范围收敛；但如果一个都没命中（例如在新店看默认产品 AD600 Elite，
      // 而活动全是 900E 的），就退回全量 —— 否则「展开活动」永远是 0 个，用户以为没数据。
      return [...map.entries()].filter(([key]) => mine.has(key)).map(([, entry]) => {
        // 活动级同样要排掉「这天其实有数据」：实测 PH 的 10-22 既有新下的真数据，
        // 又留着 10 月那份 719 字节的空壳文件 —— 不排的话活动行会同时显示「有数据」和「回空 1 天」。
        const blank = new Set([...entry.blank].filter(date => !entry.have.has(date)));
        const cover = [...entry.have, ...blank].sort();
        return { ...entry, blank, cover, first: cover[0] || '', latest: [...entry.have].sort().pop() || '' };
      }).sort((a, b) => a.name.localeCompare(b.name));
    }

    // 缺口 = 从该类（或该活动）最早有文件的那天起，到全店最新数据日为止，既没数据也没回空的日子。
    // 下界用「我方最早有文件的那天」而不是报表里写的活动起始日：报表的 Campaign start date 不可靠。
    function coverageGapDays(have, blank, from, to) {
      const gaps = [];
      if (!from || !to) return gaps;
      for (let date = from; date <= to; date = covAddDays(date, 1)) if (!have.has(date) && !blank.has(date)) gaps.push(date);
      return gaps;
    }

    function coverageModel() {
      const { days, empty, ranges, active } = coverageState();
      const all = new Set();
      [days, empty].forEach(bag => Object.values(bag).forEach(byDay => Object.keys(byDay).forEach(date => all.add(date))));
      active.forEach(date => all.add(date));
      ranges.forEach(range => String(range).split('~').forEach(date => date && all.add(date)));
      if (!all.size) return null;
      const sorted = [...all].sort();
      const earliest = sorted[0];
      const dataLatest = sorted[sorted.length - 1];
      // 「应到日」（太平洋时间口径，2026-11-25 委托方拍板）：
      //   报表是**次日**才出的（今天的报表明天才有）→ 次日 16:00 之前，不把前一天算作缺失。
      //   16:00 之后：昨天应到；16:00 之前：前天应到。
      //   若数据提前到了，照常显示（矩阵右端取「数据最新日」与「应到日」中更晚的那个）。
      const pacFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' });
      const pacToday = pacFmt.format(new Date());                                  // YYYY-MM-DD
      const pacHour = Number(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hour: '2-digit', hour12: false }).format(new Date()));
      const dueEnd = pacHour >= 16 ? covAddDays(pacToday, -1) : covAddDays(pacToday, -2);
      const latest = [dataLatest, dueEnd].sort().pop();                            // 矩阵右端（提前到了也能看）
      const gapEnd = dataLatest && dataLatest < dueEnd ? dataLatest : dueEnd;       // 缺口右端（超过应到日的不算缺）
      // 显示窗口右端不越过「全店最新数据日」：否则会把「今天还没到下载时点」天天报成缺
      const span = Number(ui.coverageSpan) || 0;
      const windowStart = span && covAddDays(latest, -(span - 1)) > earliest ? covAddDays(latest, -(span - 1)) : earliest;
      const dates = sorted.filter(date => date >= windowStart && date <= latest);
      const types = COVERAGE_TYPES.map(type => {
        const have = new Set(Object.keys(days[type.key] || {}));
        // 有数据的日子不该算进「回空」：同一天可能既有真数据文件、又有 0 行的空壳文件
        // （实测 2026-11-25：PH 的 10-22 重下拿到了真数据，而 10 月那份 719 字节的空壳文件还留在归档里，
        //   不排掉的话面板会把「有数据的一天」同时算成「已核实无数据」）。
        const blank = new Set(Object.keys(empty[type.key] || {}).filter(date => !have.has(date)));
        const cover = [...new Set([...have, ...blank])].sort();
        const campaigns = type.ad ? coverageCampaigns(type.key) : [];
        // 活动级缺口：类型级「有数据」只要求有一个活动有文件，所以类型级看不到谁缺了 —— 这里单独算。
        const allCampaignGaps = campaigns
          .map(entry => ({ entry, gaps: coverageGapDays(entry.have, entry.blank, entry.first, gapEnd), note: knownGapNote(type.key, entry.name) }))
          .filter(item => item.gaps.length);
        // 已知不可得（⛔）单独拎出来：不算缺口、不进「还有缺口」、也不让矩阵挂 ◐
        const knownGapEntries = allCampaignGaps.filter(item => item.note);
        const campaignGaps = allCampaignGaps.filter(item => !item.note);
        // 「部分活动缺」的日子：类型级有数据，但至少一个活动那天没有文件。
        // 只看每个活动自己范围内的缺口，避免把「活动还没开始」算进来。
        const partialDays = new Set();
        campaignGaps.forEach(item => item.gaps.forEach(date => { if (have.has(date)) partialDays.add(date); }));
        return {
          ...type, have, blank, cover, campaigns, campaignGaps, knownGapEntries, partialDays,
          knownGapDays: knownGapEntries.reduce((sum, item) => sum + item.gaps.length, 0),
          latestDay: [...have].sort().pop() || '',
          gaps: coverageGapDays(have, blank, cover[0] || '', gapEnd)
        };
      });
      // dataLatest 与 dueEnd 一并暴露：前端「复制缺失清单」等也要用同一口径
      return { dates, earliest, latest, dataLatest, dueEnd, gapEnd, types, ranges, active };
    }

    function coverageCellInfo(type, date, dueEnd = '') {
      const { days, empty } = coverageState();
      const haveDay = days[type.key] || {};
      const blankDay = empty[type.key] || {};
      const have = haveDay[date] || [];
      const blank = blankDay[date] || [];
      // 关键：按「这一天的键存不存在」判断，不能按数组长度 —— Traffic 类型没有活动维度，
      // 台账里存的是空数组 []，按长度判会把整列都显示成「缺」（渲染实测踩过）。
      const has = (bag, key) => Object.prototype.hasOwnProperty.call(bag, key);
      // partial：这天有数据，但至少一个活动缺（类型级只看「有没有」会全绿，掩盖活动级缺口）
      const partial = (type.partialDays && type.partialDays.has(date)) || false;
      // 未到应到日（2026-11-25 新增）：太平洋时间次日 16:00 之后才把「昨天」算作应到（用户口径）。
      // 没到应到日的日期没有数据是正常的 —— 原来矩阵把「今天」整行标成红 ✕「缺」，
      // 与上方「各类报表状态：没有缺口」自相矛盾。现在显示中性「·」。
      const pending = Boolean(dueEnd) && date > dueEnd;
      return { status: has(haveDay, date) ? (partial ? 'partial' : 'have') : has(blankDay, date) ? 'blank' : pending ? 'pending' : 'miss', have, blank, partial, pending };
    }

    function coverageSummary(model) {
      const { ranges, active } = coverageState();
      const gapBadge = type => {
        const bits = [];
        if (type.gaps.length) bits.push(`类型级 ${fmt(type.gaps.length)} 天`);
        if (type.campaignGaps && type.campaignGaps.length) bits.push(`${fmt(type.campaignGaps.length)} 个活动有缺`);
        const known = type.knownGapEntries && type.knownGapEntries.length
          ? `<span class="badge amber">⛔ ${fmt(type.knownGapEntries.length)} 个永久不可得</span>`
          : '';
        if (!bits.length) return `<span class="badge green">没有缺口</span>${known}`;
        return `<span class="badge red">${bits.join(' ｜ ')}</span>${known}`;
      };
      const adRows = model.types.map(type => `<tr>
        <td>${esc(type.label)}</td>
        <td>${type.latestDay || '—'}</td>
        <td>${fmt(type.have.size)} 天</td>
        <td>${type.blank.size ? fmt(type.blank.size) + ' 天' : '—'}</td>
        <td>${gapBadge(type)}</td>
        <td style="text-align:left;color:var(--muted)">${esc(type.ad ? `${type.note}（${fmt(type.campaigns.length)} 个活动）` : type.note)}</td>
      </tr>`).join('');
      const snapRows = `<tr>
        <td>Traffic 累计</td><td>${ranges.length ? String(ranges[ranges.length - 1]).split('~')[1] : '—'}</td>
        <td>${fmt(ranges.length)} 份</td><td>—</td><td><span class="badge blue">区间快照</span></td>
        <td style="text-align:left;color:var(--muted)">累计报表是导出那一刻的快照，不按日判缺</td>
      </tr><tr>
        <td>在售商品名单</td><td>${active.length ? active[active.length - 1] : '—'}</td>
        <td>${fmt(active.length)} 份</td><td>—</td><td><span class="badge blue">名单快照</span></td>
        <td style="text-align:left;color:var(--muted)">在售名单是快照，且只能看最新一份；不按日判缺</td>
      </tr>`;
      return `<section class="panel"><div class="panel-head"><h3>各类报表状态</h3><small>最新数据日 = 该类最近一份**有真实数据**的日子；「缺」不算 eBay 回空</small></div>
        <div class="table-wrap"><table><thead><tr><th>报表类型</th><th>最新数据日</th><th>有数据</th><th>eBay 回空</th><th>缺</th><th>说明</th></tr></thead><tbody>${adRows}${snapRows}</tbody></table></div></section>`;
    }

    function coverageMatrix(model) {
      const head = model.types.map(type => `<th>${esc(type.label)}</th>`).join('');
      const rows = model.dates.slice().reverse().map(date => {
        const cells = model.types.map(type => {
          const info = coverageCellInfo(type, date, model.gapEnd);
          const missing = info.partial ? (type.campaignGaps || []).filter(item => item.gaps.includes(date)).map(item => item.entry.name) : [];
          const title = [
            info.have.length ? `有数据：${info.have.join('、')}` : '',
            info.blank.length ? `eBay 回空（已核实无数据）：${info.blank.join('、')}` : '',
            missing.length ? `但这些活动这天没有文件：${missing.join('、')}` : '',
            info.pending ? '还没到出报表时间（太平洋时间次日 16:00 后才应到），不算缺口' : '',
            info.status === 'miss' ? '没有这份报表' : ''
          ].filter(Boolean).join('；');
          return `<td class="cov-cell cov-${info.status}"${title ? ` title="${esc(title)}"` : ''}>${COV_GLYPH[info.status]}</td>`;
        }).join('');
        return `<tr><td>${date}</td>${cells}</tr>`;
      }).join('');
      return `<section class="panel"><div class="panel-head"><h3>覆盖矩阵</h3><small>● 有数据　◐ 部分活动缺　○ 已核实无数据（eBay 回空）　✕ 缺　　· 还没到应到日（太平洋时间次日 16:00）　　鼠标悬停看是哪个活动</small></div>
        <div class="panel-body" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${[7, 30, 90, 0].map(n => `<button class="btn${Number(ui.coverageSpan) === n ? ' primary' : ''}" data-coverage-span="${n}" style="min-width:auto;padding:0 10px">${n ? `最近 ${n} 天` : '全部'}</button>`).join('')}<span style="color:var(--muted);font-size:12px">共 ${fmt(model.dates.length)} 天（${model.dates[0] || '—'} ~ ${model.dates[model.dates.length - 1] || '—'}）</span></div>
        <div class="table-wrap cov-scroll"><table class="cov-matrix"><thead><tr><th>日期</th>${head}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
    }

    function coverageGapList(model) {
      const blocks = model.types.map(type => {
        const open = (ui.coverageOpen || []).includes(type.key);
        let body;
        if (!open) {
          // 「类型级没有缺口」不等于「都齐了」：只要有 1 个活动有数据，类型级就算有 —— 必须把活动级也说出来
          const knownNote = type.knownGapEntries && type.knownGapEntries.length
            ? `<span class="badge amber">⛔ ${fmt(type.knownGapEntries.length)} 个永久不可得（${fmt(type.knownGapDays)} 天，不用补）</span>`
            : '';
          const typeLine = type.gaps.length
            ? `<div class="cov-gap-line"><span class="badge red">类型级缺 ${fmt(type.gaps.length)} 天</span>${type.gaps.map(date => `<code>${date}</code>`).join('')}</div>`
            : (type.campaignGaps && type.campaignGaps.length
              ? `<div class="cov-gap-line"><span class="badge green">各类活动合起来覆盖完整</span><span style="color:var(--muted)">但 ${fmt(type.campaignGaps.length)} 个活动自己有缺口，点「展开活动」看</span></div>`
              : `<div class="cov-gap-line"><span class="badge green">没有缺口</span>${knownNote}</div>`);
          body = typeLine;
          if (type.blank.size) body += `<div class="cov-gap-line" style="color:var(--muted)">已核实无数据（eBay 回空，不用重下）：${[...type.blank].sort().map(date => `<code>${date}</code>`).join('')}</div>`;
        } else {
          body = type.campaigns.map(entry => {
            // 缺口右端用 gapEnd（应到日）：latest 含「提前到了的新一天」，拿它算缺口会把
            // 其他活动「今天还没生成」的报表算成缺（2026-11-25 修，与类型级口径一致）。
            const entryGaps = coverageGapDays(entry.have, entry.blank, entry.first, model.gapEnd || model.latest);
            const note = knownGapNote(type.key, entry.name);
            return `<div class="cov-gap-line"><strong>${esc(entry.name)}</strong>
              <span style="color:var(--muted)">有数据 ${fmt(entry.have.size)} 天${entry.first ? `（${entry.first} ~ ${entry.latest || entry.first}）` : ''}</span>
              ${entry.blank.size ? `<span class="badge amber">回空 ${fmt(entry.blank.size)} 天</span>` : ''}
              ${note
                ? `<span class="badge amber">⛔ 永久不可得 ${entryGaps.length ? fmt(entryGaps.length) + ' 天' : ''}</span><span style="color:var(--muted)">${esc(note)}</span>`
                : (entryGaps.length ? `<span class="badge red">缺 ${fmt(entryGaps.length)} 天</span>${entryGaps.map(date => `<code>${date}</code>`).join('')}` : `<span class="badge green">齐</span>`)}</div>`;
          }).join('') || `<div class="cov-gap-line" style="color:var(--muted)">这个类型下还没有任何活动数据</div>`;
        }
        return `<div class="cov-type"><div class="cov-type-head"><strong>${esc(type.label)}</strong>
          ${type.ad ? `<button class="btn" data-coverage-toggle="${esc(type.key)}" style="min-width:auto;padding:0 10px">${open ? '收起活动' : `展开 ${fmt(type.campaigns.length)} 个活动`}</button>` : ''}
          <span style="color:var(--muted)">${type.latestDay ? `最新数据日 ${type.latestDay}` : '还没有数据'}${type.campaignGaps && type.campaignGaps.length ? ` ｜ ${fmt(type.campaignGaps.length)} 个活动有缺` : ''}</span></div>${body}</div>`;
      }).join('');
      return `<section class="panel"><div class="panel-head"><h3>缺失清单</h3><small>「缺」= 既没有数据文件、也没有 eBay 回空的空报表；可直接复制给 VPS 当补数任务单</small></div>
        <div class="panel-body cov-gaps">${blocks}</div></section>`;
    }

    function coverageGapText(model) {
      const lines = [`报表缺口清单（产品范围：${ui.product}；数据范围 ${model.earliest} ~ ${model.latest}；生成于 ${new Date().toLocaleString('zh-CN')}）`];
      model.types.forEach(type => {
        lines.push('');
        lines.push(`【${type.label}】最新数据日 ${type.latestDay || '—'}`);
        if (type.blank.size) lines.push(`  已核实无数据（eBay 回空，不用重下）：${[...type.blank].sort().join(' ')}`);
        const allGaps = type.campaigns
          .map(entry => ({ entry, gaps: coverageGapDays(entry.have, entry.blank, entry.first, model.gapEnd || model.latest), note: knownGapNote(type.key, entry.name) }))
          .filter(item => item.gaps.length);
        const campaignGaps = allGaps.filter(item => !item.note);
        const knownGaps = allGaps.filter(item => item.note);
        if (!type.gaps.length && !campaignGaps.length && !knownGaps.length) { lines.push('  没有缺口'); return; }
        if (type.gaps.length) lines.push(`  类型级：缺 ${type.gaps.length} 天 ${type.gaps.join(' ')}`);
        campaignGaps.forEach(({ entry, gaps }) => lines.push(`  · ${entry.name}\n      缺 ${gaps.length} 天：${gaps.join(' ')}`));
        knownGaps.forEach(({ entry, gaps, note }) => lines.push(`  · ${entry.name}\n      ⛔ 永久不可得（不用补）${gaps.length ? ` ${gaps.length} 天：${gaps.join(' ')}` : ''}\n      原因：${note}`));
      });
      const { ranges, active } = coverageState();
      lines.push('');
      lines.push(`【快照类，不按日判缺】Traffic 累计 ${ranges.length} 份（最新 ${ranges.length ? String(ranges[ranges.length - 1]).split('~')[1] : '—'}）；在售名单 ${active.length} 份（最新 ${active.length ? active[active.length - 1] : '—'}）`);
      return lines.join('\n');
    }

    function dailyPage() {
      const model = coverageModel();
      const head = `<div class="page-head"><div><h2>每日记录 · 报表更新情况</h2><p>判断各类报表哪天已经下载、哪天 eBay 明确回空、哪天还没下。只看文件在不在，不看指标。某天若活动本来就没跑，下载会回空 —— 把空报表入库后这里会显示成 ○ 已核实无数据。</p></div>
        <div class="actions"><button class="btn" id="copyGapsBtn">${icon('copy')}复制缺失清单</button>${SHARED_READONLY ? '' : `<button class="btn primary" id="topUploadBtn">${icon('upload')}上传报表</button>`}</div></div>`;
      if (!model) {
        const noCoverage = coverageState().present
          ? '当前店铺还没有任何报表覆盖记录。'
          : SHARED_READONLY
            // 在线看板的数据来自构建端（app/dashboard-build.mjs）：缺台账说明数据是旧版构出来的
            ? '这份数据里没有覆盖台账（coverage 字段）。用 app/dashboard-build.mjs 重新构建一次看板数据即可显示。'
            // 本机「浏览器上传」模式只解析 Traffic/PLG/名单，不算覆盖台账 —— 这不是坏了，别让人误以为出错
            : '浏览器上传模式不计算覆盖台账（它只解析 Traffic、PLG 和名单）。要看「哪类报表哪天缺」，请用在线看板，或在本机跑：node app\\coverage-report.mjs';
      return `${head}<div class="panel empty">${noCoverage}</div>`;
      }
      const typeGaps = model.types.reduce((sum, type) => sum + type.gaps.length, 0);
      const campaignGaps = model.types.reduce((sum, type) => sum + ((type.campaignGaps || []).reduce((n, item) => n + item.gaps.length, 0)), 0);
      const knownDays = model.types.reduce((sum, type) => sum + (type.knownGapDays || 0), 0);
      // 「已核实无数据」按 (活动, 日) 统计：活动级才是有用的粒度（同一天可能 A 活动没数据、B 活动有），
      // 另外给出「整体无数据的日子」= 那天所有活动都没数据 —— 两个数是不同的问题，别混着看。
      const typeBlankDays = model.types.reduce((sum, type) => sum + type.blank.size, 0);
      const blankCampaignDays = model.types.reduce((sum, type) => sum + (type.campaigns || []).reduce((n, entry) => n + entry.blank.size, 0), 0)
        + model.types.filter(type => !type.ad).reduce((sum, type) => sum + type.blank.size, 0);
      const totalGaps = typeGaps + campaignGaps;
      return `${head}
        <section class="metrics">
          ${metric('最新数据日', model.latest, `各类报表最早 ${model.earliest}`)}
          ${metric('还有缺口', totalGaps ? `${fmt(totalGaps)} 天` : '0 天', `类型级 ${fmt(typeGaps)} 天 ｜ 活动级 ${fmt(campaignGaps)} 天${knownDays ? `（另有 ${fmt(knownDays)} 天永久不可得，已排除）` : ''}`)}
          ${metric('已核实无数据', `${fmt(blankCampaignDays)} 个活动-日`, `整体无数据的日子 ${fmt(typeBlankDays)} 天 ｜ eBay 回空，不用重下`)}
        </section>
        ${coverageSummary(model)}
        ${coverageMatrix(model)}
        ${coverageGapList(model)}`;
    }

    function importPage() {
      return `<div class="page-head"><div><h2>数据导入</h2><p>支持同时选择多个 CSV，系统会自动识别报表类型并去重。</p></div><div class="actions">${dataState.sources.length ? `<button class="btn danger" id="clearBtn">${icon('trash-2')}清空数据</button>` : ''}</div></div>
        <section class="panel"><div class="panel-body"><div class="upload-zone" id="dropZone"><div><div class="upload-icon">${icon('files', 24)}</div><h3>上传 Traffic 与 PLG CSV</h3><p>可以一次选择多个文件。PLG 按日期、Item ID、广告活动去重；Traffic 按报表区间和 Item ID 去重。</p><button class="btn primary" id="uploadBtn">${icon('folder-open')}选择文件</button><div class="upload-note">CSV 仅在当前浏览器中解析和保存</div></div></div></div></section>
        ${dataState.sources.length ? importDiagnostics() : ''}
        <div class="source-grid">${dataState.sources.length ? dataState.sources.map(sourceCard).join('') : ''}</div>`;
    }

    function importDiagnostics() {
      const plgDates = unique(dataState.plgRaw.map(row => row.date)).sort();
      const trafficDailyDates = unique(dataState.trafficRaw.filter(row => row.start && row.start === row.end).map(row => row.start)).sort();
      const missingTraffic = plgDates.filter(date => !trafficDailyDates.includes(date));
      const rangeCount = unique(dataState.trafficRaw.filter(row => row.start !== row.end).map(row => `${row.start}|${row.end}`)).length;
      return `<section class="panel snapshot"><div class="panel-head"><h3>日期覆盖检查</h3><small>用于判断能否生成完整日度看板</small></div><div class="panel-body"><div class="snapshot-metrics">
        <div class="snapshot-metric"><span>PLG 日度</span><strong>${fmt(plgDates.length)} 天</strong></div>
        <div class="snapshot-metric"><span>单日 Traffic</span><strong>${fmt(trafficDailyDates.length)} 天</strong></div>
        <div class="snapshot-metric"><span>Traffic 区间快照</span><strong>${fmt(rangeCount)} 份</strong></div>
        <div class="snapshot-metric"><span>缺单日 Traffic</span><strong>${fmt(missingTraffic.length)} 天</strong></div>
      </div>${missingTraffic.length ? `<p class="snapshot-note" style="margin-top:12px;margin-bottom:0">缺少单日 Traffic：${esc(missingTraffic.join('、'))}。当前仍可查看 PLG 日度趋势，链接总曝光、总 Page views 等 Traffic 指标暂不能按日展示。</p>` : ''}</div></section>`;
    }

    function sourceCard(source) {
      const isTraffic = source.type === 'Traffic';
      return `<article class="source-item"><div class="source-top"><div class="source-name" title="${esc(source.name)}">${esc(source.name)}</div><span class="badge ${isTraffic ? 'amber' : 'blue'}">${esc(source.type)}</span></div><div class="source-meta"><span>${rangeText(source.start, source.end)}</span><span>${fmt(source.count)} 行 · ${source.type === 'Active' ? '在售名单快照' : isTraffic ? esc(source.periodKind || '区间累计') : '日度明细'}</span></div></article>`;
    }

    function itemDetailRows() {
      return itemPerformance(true).filter(row => !dataState.activeListings || (ui.listingStatus || 'active') === 'all' || row.listingStatus === (ui.listingStatus || 'active'));
    }

    function listingStatusPanel(rows = []) {
      const snapshot = dataState.activeListings;
      const history = new Set([...dataState.trafficRaw, ...dataState.plgRaw, ...(dataState.ads.plpRows || [])].filter(row => inProduct(row)).map(row => row.itemId));
      const active = new Set((snapshot?.items || []).map(row => row.itemId));
      const zeroStock = (snapshot?.items || []).filter(row => row.available === 0).length;
      const absent = [...history].filter(id => !active.has(id)).length;
      const selected = ui.listingStatus || 'active';
      return `<section class="metrics">${metric('当前在售 Item', snapshot ? fmt(active.size) : '待确认', snapshot ? '名单日期：' + snapshot.date : '请提供完整在售商品报表')}${metric('历史记录 Item', fmt(history.size), '全部历史数据去重，不受所选日期影响')}${metric('历史链接不在最新名单', snapshot ? fmt(absent) : '待确认', '不等同于已确认下架')}${metric('零库存在售', snapshot ? fmt(zeroStock) : '待确认', '在售名单里 Available quantity = 0（不等于已下架，需人工确认）')}</section>
        <div class="panel" style="padding:14px 16px;margin-bottom:16px"><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end"><div class="field" style="max-width:300px;margin-bottom:0"><label for="listingStatusFilter">Item 在售状态</label><select class="input" id="listingStatusFilter">${[['active','在售'],['all','全部（含历史）'],['absent','不在最新在售名单'],['unknown','状态待确认']].map(([value,label]) => `<option value="${value}" ${selected === value ? 'selected' : ''}>${label}</option>`).join('')}</select></div>${promoFilterSelect(rows)}</div><p class="field-help">${snapshot ? `名单日期：${esc(snapshot.date)}（文件导出日期）。` : '尚无在售名单，当前显示数据状态待确认的链接。'}状态按最新名单中的 Item ID 判断，与所选时间范围无关；筛选（含促销活动）仅作用于本页下方的 Item 表与本页导出。</p><details class="inline-help"><summary>在售状态与名单口径说明（点击展开）</summary><p class="field-help">来源：${snapshot ? esc(snapshot.name) : '—'}。未在名单中不直接判为下架，可能涉及结束、售罄或导出范围；名单可能包含零库存链接，不代表均可购买；新在售链接即使所选区间没有表现记录也保留，指标显示“—”。经营看板与每日历史保留原口径。</p></details></div>`;
    }

    function detailPage() {

    function itemFullTable(rows, trafficRows, plgStart, plgEnd) {

        <th class="plp-col">Impressions</th><th class="plp-col">Clicks</th><th class="plp-col">CTR</th><th class="plp-col">Sold quantity</th><th class="plp-col">Ad fees</th><th class="plp-col">Sales</th><th class="plp-col">Conversion rate</th><th class="plp-col">ROAS</th><th class="plp-col">Average CPC</th><th class="plp-col">ACOS</th><th class="plp-col">主推关键词</th><th class="plp-col">建议出价</th><th class="plp-col">实际出价</th>
        ${sortHeader('曝光', 'naturalImpressions', 'detail')}${sortHeader('eBay Page views', 'naturalViews', 'detail')}${sortHeader('SOLD', 'naturalSold', 'detail')}${sortHeader('点击率', 'naturalCtr', 'detail')}${sortHeader('Sales conversion rate', 'naturalConversion', 'detail')}
        <th>Impressions</th><th>Clicks</th><th>CTR</th><th>Sold quantity</th><th>Ad fees</th><th>Sales</th><th>Conversion rate</th><th>ROAS</th><th>Average CPC</th><th>ACOS</th><th>主推关键词</th><th>建议出价</th><th>实际出价</th>
      </tr></thead><tbody>${sorted.map(row => `<tr>
        <td><a href="${esc(row.link)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td>${row.listingStartDate ? esc(row.listingStartDate) : '—'}</td><td>${row.listingAgeDays == null ? '—' : fmt(row.listingAgeDays) + ' 天'}</td><td style="min-width:160px">${esc(row.listingStatusText)}</td>${row.rosterPrice ? `<td>${row.rosterVariations > 1 && row.rosterPriceMax > row.rosterPrice ? `${money(row.rosterPrice)}~${money(row.rosterPriceMax)}` : money(row.rosterPrice)}</td>` : '<td>—</td>'}<td${row.rosterAvailable === 0 ? ' style="color:var(--red);font-weight:700"' : ''}>${row.rosterAvailable == null ? '—' : fmt(row.rosterAvailable)}</td><td>${row.rosterSold == null ? '—' : fmt(row.rosterSold)}</td><td>${row.rosterWatchers == null ? '—' : fmt(row.rosterWatchers)}${row.rosterBids ? ` / ${fmt(row.rosterBids)}` : ''}</td>
        ${row.rosterPromoName ? `<td style="min-width:150px;white-space:normal;vertical-align:top" title="${esc(row.rosterPromoRule)}${row.rosterPromoType ? '（' + esc(row.rosterPromoType) + '）' : ''}">${esc(row.rosterPromoName)}${row.rosterPromoCount > 1 ? ` <details class="promo-more"><summary class="badge amber">${row.rosterPromoCount} 个活动 ▾</summary><div class="promo-list">${(row.rosterPromoList || []).map((x, i) => `<div class="promo-item"><div class="pi-name"><span class="pi-idx">${i + 1}.</span> ${esc(x.name || '（活动名待补）')}</div><div class="pi-chips">${x.type ? `<span class="badge">${esc(x.type)}</span>` : ''}${x.status && x.status !== 'Active' ? `<span class="badge">${esc(x.status)}</span>` : ''}</div><div class="pi-price">${x.original != null ? `<span class="pi-was">${money(x.original)}</span> → ` : ''}${x.price != null ? `<span class="pi-now">${money(x.price)}</span>` : '—'}${x.discount != null ? ` <span class="pi-off">−${money(x.discount)}</span>` : ''}${x.rule ? `<span class="pi-rule">${esc(x.rule)}</span>` : ''}</div>${x.start || x.end ? `<div class="pi-dates">${esc(x.start || '?')} → ${esc(x.end || '?')}</div>` : ''}</div>`).join('')}</div></details>` : ''}</td>` : '<td>—</td>'}${row.rosterPromoType ? `<td class=\"t-text\" style=\"white-space:nowrap\">${esc(row.rosterPromoType)}</td>` : '<td>—</td>'}${row.rosterPromoOriginal != null ? `<td>${money(row.rosterPromoOriginal)}</td>` : '<td>—</td>'}${row.rosterPromoPrice != null ? `<td>${money(row.rosterPromoPrice)}</td>` : '<td>—</td>'}${row.rosterPromoDiscount != null ? `<td style="color:var(--red)">−${money(row.rosterPromoDiscount)}</td>` : '<td>—</td>'}${row.rosterPromoEnd ? `<td style="white-space:nowrap">${esc(row.rosterPromoStart || '?')} → ${esc(row.rosterPromoEnd)}${row.rosterPromoStatus && row.rosterPromoStatus !== 'Active' ? ` <span class="badge">${esc(row.rosterPromoStatus)}</span>` : ''}</td>` : '<td>—</td>'}
        <td>${row.hasTraffic ? fmt(row.totalPageViews) : '—'}</td><td>${row.hasTraffic ? fmt(row.totalImpressions) : '—'}</td><td>${row.hasTraffic ? fmt(row.ebayViews) : '—'}</td><td>${row.hasTraffic ? fmt(row.externalViews) : '—'}</td><td>${row.hasTraffic ? fmt(row.quantitySold) : '—'}${row.salesMismatch ? ' <span class="badge amber">待核对</span>' : ''}</td><td>${row.hasTraffic ? pct(row.totalCtr) : '—'}</td><td>${row.hasTraffic ? pct(row.totalConversion) : '—'}</td><td style="white-space:normal;min-width:180px">${esc(row.pvAudit)}</td>
        <td class="plg-col">${row.hasPlg ? money(row.price) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.plgTotalSold) : '—'}</td><td class="plg-col">—</td><td class="plg-col">—</td><td class="plg-col">${row.hasPlg ? fmt(row.adImpressions) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.adClicks) : '—'}</td><td class="plg-col">${row.hasPlg ? pct(row.adCtr) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.adSold) : '—'}</td><td class="plg-col">${row.hasPlg ? money(row.adSales) : '—'}</td><td class="plg-col">${row.hasPlg ? money(row.adFees) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.roas, 2) : '—'}</td>
        <td class="plp-col">${row.hasPlp ? fmt(row.plpImpressions) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpClicks) : '—'}</td><td class="plp-col">${row.hasPlp ? pct(row.plpCtr) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpSold) : '—'}</td><td class="plp-col">${row.hasPlp ? money(row.plpFees) : '—'}</td><td class="plp-col">${row.hasPlp ? money(row.plpSales) : '—'}</td><td class="plp-col">${row.hasPlp ? pct(row.plpConversion) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpRoas, 2) : '—'}</td><td class="plp-col">${row.hasPlp ? money(row.plpAvgCpc) : '—'}</td><td class="plp-col">${row.hasPlp ? pct(row.plpAcos) : '—'}</td><td class="plp-col">—</td><td class="plp-col">—</td><td class="plp-col">—</td>
        <td>${row.hasTraffic ? fmt(row.naturalImpressions) : '—'}</td><td>${row.hasTraffic ? fmt(row.naturalViews) : '—'}</td><td>${row.hasPlg ? fmt(row.naturalSold) : '—'}</td><td>${row.hasTraffic ? pct(row.naturalCtr) : '—'}</td><td>${samePeriod && row.hasTraffic && row.hasPlg ? pct(row.naturalSold / row.naturalViews || 0) : '—'}</td>
        ${'<td>—</td>'.repeat(13)}
      </tr>`).join('')}</tbody></table></div>`;
    }

    function trafficTable(rows) {
      if (!rows.length) return `<div class="empty">还没有 Traffic 数据</div>`;
      const sorted = sortRows(rows, 'traffic');
      return `<div class="table-wrap"><table><thead><tr>${sortHeader('Item ID', 'itemId', 'traffic')}${sortHeader('标题', 'title', 'traffic')}${sortHeader('总曝光', 'totalImpressions', 'traffic')}<th title="报表列：Top 20 search spot impressions（from/ organic）">Top20 搜索位</th><th title="报表列：Rest of search spot impressions">其余搜索位</th><th title="报表列：Non-search impressions（promoted / organic）">非搜索位</th>${sortHeader('总 Page views', 'totalPageViews', 'traffic')}${sortHeader('销量', 'quantitySold', 'traffic')}${sortHeader('站内广告曝光', 'promotedEbayImpressions', 'traffic')}${sortHeader('站内自然曝光', 'organicEbayImpressions', 'traffic')}${sortHeader('站内广告 PV', 'promotedEbayViews', 'traffic')}${sortHeader('站内自然 PV', 'organicEbayViews', 'traffic')}${sortHeader('站外广告 PV', 'promotedExternalViews', 'traffic')}${sortHeader('站外自然 PV', 'organicExternalViews', 'traffic')}</tr></thead><tbody>${sorted.map(row => `<tr><td>${esc(row.itemId)}</td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td>${fmt(row.totalImpressions)}</td><td>${fmt((row.top20Promoted || 0) + (row.top20Organic || 0))}</td><td>${fmt(row.restSearch || 0)}</td><td>${fmt((row.nonSearchPromoted || 0) + (row.nonSearchOrganic || 0))}</td><td>${fmt(row.totalPageViews)}</td><td>${fmt(row.quantitySold)}</td><td>${fmt(row.promotedEbayImpressions)}</td><td>${fmt(row.organicEbayImpressions)}</td><td>${fmt(row.promotedEbayViews)}</td><td>${fmt(row.organicEbayViews)}</td><td>${fmt(row.promotedExternalViews)}</td><td>${fmt(row.organicExternalViews)}</td></tr>`).join('')}</tbody></table></div>`;
    }

    function withinAdsRange(row) {
      return (!ui.start || row.date >= ui.start) && (!ui.end || row.date <= ui.end);
    }

    function adDetailRows() {
      const plg = dataState.plgRaw.filter(row => inProduct(row)).map(row => ({ date: row.date, campaign: row.campaign, adType: 'PLG', itemId: row.itemId, title: row.title, impressions: row.adImpressions, clicks: row.adClicks, sold: row.adSold, sales: row.adSales, adFees: row.adFees, naturalImpressions: row.organicImpressions, naturalClicks: row.organicClicks, naturalSold: row.organicSold }));
      const plp = (dataState.ads.plpRows || []).map(row => ({ ...row, adType: 'PLP', naturalImpressions: null, naturalClicks: null, naturalSold: null }));
      return [...plg, ...plp].filter(row => withinAdsRange(row) && (!ui.campaigns.length || ui.campaigns.includes(row.campaign)));
    }

    // 活动起始日（2026-11-25 新增）：报表里的 Campaign start date 那列**会偏晚**
    // （实测新店 CSGP 标 11-17、真实数据自 11-10），而它的用途是判断"某天没数据是不是发生在活动开始之前"，
    // 所以显示值取 min(报表标注, 我方最早有数据的日期) —— 保守下界，不会把"其实开始得更早"误判成"还没开始"。
    function campaignStartOf(name) {
      const ads = dataState.ads || {};
      const key = clean(name);
      const claim = (ads.campaignStarts || {})[key] || '';
      const earliest = (ads.campaignEarliest || {})[key] || '';
      if (!claim) return { show: earliest, claim: '', earliest };
      if (earliest && earliest < claim) return { show: earliest, claim, earliest };
      return { show: claim, claim, earliest };
    }

    // 「刊登 / 关键词当前状态」（2026-11-25 新增）：活动暂停在报表里没有活动级字段，
    // 但行级状态有 —— PLG 的 Status 是「该刊登在这个活动里的状态」（实测 Active / Ended/Removed / Excluded），
    // 关键词报表带关键词状态（实测 ACTIVE / PAUSED / REMOVED）。
    // 取每个刊登（或每个关键词）**最新一天**的状态，就是「这个活动现在还活着几个刊登」。
    function adStatusSummary(campaign) {
      const latestOf = (rows, keyOf) => {
        const latest = new Map();
        rows.forEach(row => {
          const key = keyOf(row);
          if (!key) return;
          const previous = latest.get(key);
          if (!previous || String(row.date || '') >= String(previous.date || '')) latest.set(key, row);
        });
        return [...latest.values()];
      };
      const tally = rows => rows.reduce((map, row) => {
        const status = clean(row.status) || '未标注';
        map[status] = (map[status] || 0) + 1;
        return map;
      }, {});
      const plg = tally(latestOf(dataState.plgRaw.filter(row => row.campaign === campaign), row => row.itemId));
      const keyword = tally(latestOf((dataState.ads.keywordRows || []).filter(row => row.campaign === campaign), row => `${row.keyword}|${row.matchType}`));
      return { plg, keyword };
    }

    // 状态中文化（英文原值保留在 title 里，方便对照报表）
    const AD_STATUS_LABEL = { Active: '投放中', ACTIVE: '投放中', 'Ended/Removed': '已移除', REMOVED: '已移除', Excluded: '被剔除', PAUSED: '已暂停', Paused: '已暂停' };
    function adStatusText(info) {
      if (!info) return '';
      const parts = Object.entries(info.plg || {}).map(([status, count]) => `${AD_STATUS_LABEL[status] || status} ${fmt(count)}`);
      const paused = Object.entries(info.keyword || {}).filter(([status]) => /PAUSED/i.test(status)).reduce((sum, [, count]) => sum + count, 0);
      if (paused) parts.push(`关键词已暂停 ${fmt(paused)}`);
      return parts.join(' ｜ ');
    }
    function adStatusRaw(info) {
      if (!info) return '';
      const bits = [];
      Object.entries(info.plg || {}).forEach(([status, count]) => bits.push(`刊登 ${status}: ${count}`));
      Object.entries(info.keyword || {}).forEach(([status, count]) => bits.push(`关键词 ${status}: ${count}`));
      return bits.join('；');
    }

    function adCampaignRows() {
      const map = new Map();
      adDetailRows().forEach(row => {
        if (!map.has(row.campaign)) map.set(row.campaign, { campaign: row.campaign, adTypes: new Set(), dates: new Set(), items: new Set(), impressions: 0, clicks: 0, sold: 0, sales: 0, adFees: 0 });
        const item = map.get(row.campaign);
        item.adTypes.add(row.adType); item.dates.add(row.date); item.items.add(row.itemId);
        ['impressions','clicks','sold','sales','adFees'].forEach(field => item[field] += row[field] || 0);
      });
      return [...map.values()].map(row => ({ ...row, adType: [...row.adTypes].join('/'), days: row.dates.size, itemCount: row.items.size, ctr: row.clicks / row.impressions || 0, conversion: row.sold / row.clicks || 0, avgCpc: row.adFees / row.clicks || 0, roas: row.sales / row.adFees || 0, acos: row.sales > 0 ? row.adFees / row.sales : null, startInfo: campaignStartOf(row.campaign) }))
        // 效率分级（2026-11-26）：ROAS ≥4 高效 / 2~4 观察 / <2 待优化 —— 只是为了排序与一眼扫，阈值可按自己标准改。
        .map(row => ({ ...row, grade: !(row.adFees > 0) ? '—' : (row.roas >= 4 ? '高效' : row.roas >= 2 ? '观察' : '待优化') }))
        // 扁平排序键：sortRows 只认 a[key]，嵌套字段排不了
        .map(row => ({ ...row, adStart: row.startInfo.show || '', statusInfo: adStatusSummary(row.campaign) }))
        // 汇总表要按「刊登状态」排序 → 得有个扁平排序键（sortRows 只认 a[key]）
        .map(row => ({ ...row, statusText: adStatusText(row.statusInfo) }));
    }

    function campaignChips() {
      const names = unique([...dataState.plgRaw.map(row => row.campaign), ...(dataState.ads.plpRows || []).map(row => row.campaign)]).sort();
      // 2026-11-25：活动多时 chips 会占两三行（超长活动名尤其吵）→ 默认只显示前 8 个，其余折叠成「展开全部」。
      const LIMIT = 8;
      const expanded = Boolean(ui.campaignExpand);
      const shown = expanded ? names : names.slice(0, LIMIT);
      const chip = name => `<button class="campaign-chip ${ui.campaigns.includes(name) ? 'active' : ''}" data-campaign="${esc(name)}">${esc(name.replace('US.TD.PLG.topdon_scanner.', ''))}</button>`;
      const toggle = names.length > LIMIT ? `<button class="campaign-chip more" id="campaignToggle">${expanded ? '收起活动列表' : `展开全部 ${fmt(names.length)} 个活动`}</button>` : '';
      return `<div class="campaign-chips"><button class="campaign-chip ${ui.campaigns.length ? '' : 'active'}" data-campaign="">全部 Campaign</button>${shown.map(chip).join('')}${toggle}</div>`;
    }

    // 起始日显示（2026-11-25 新增）：主值取保守下界，鼠标悬停给出报表原值与我方最早数据日，
    // 便于判断「某天没有数据」是不是发生在活动开始之前。
    function startCell(row) {
      const info = row.startInfo || {};
      if (!info.show) return '<td class="ad-start">—</td>';
      const bits = [];
      if (info.claim) bits.push(`报表标注起始日 ${info.claim}`);
      if (info.earliest && info.earliest !== info.show) bits.push(`我方最早有数据 ${info.earliest}`);
      const title = bits.length ? ` title="${esc(bits.join('；'))}"` : '';
      const mark = info.earliest && info.claim && info.earliest < info.claim ? ' *' : '';
      return `<td class="ad-start t-text"${title}>${esc(info.show)}${mark}</td>`;
    }

    function campaignOverview() {
      const campaigns = adCampaignRows();
      const impressions = sum(campaigns, 'impressions'), clicks = sum(campaigns, 'clicks'), sold = sum(campaigns, 'sold'), sales = sum(campaigns, 'sales'), fees = sum(campaigns, 'adFees');
      const cards = [...campaigns].sort((a,b) => b.impressions-a.impressions).map(row => `<article class="panel campaign-card"><div class="campaign-card-head"><strong>${esc(row.campaign)}</strong><span class="badge ${row.adType.includes('PLP') ? 'blue' : 'amber'}">${esc(row.adType)}</span></div><div class="campaign-card-grid"><div><span>起始日</span><strong title="${esc(`报表标注 ${row.startInfo?.claim || '—'}；我方最早有数据 ${row.startInfo?.earliest || '—'}`)}">${esc(row.startInfo?.show || '—')}${row.startInfo?.earliest && row.startInfo?.claim && row.startInfo.earliest < row.startInfo.claim ? ' *' : ''}</strong></div><div><span>曝光</span><strong>${fmt(row.impressions)}</strong></div><div><span>点击 / CTR</span><strong>${fmt(row.clicks)} / ${pct(row.ctr)}</strong></div><div><span>销量 / CVR</span><strong>${fmt(row.sold)} / ${pct(row.conversion)}</strong></div><div><span>广告费</span><strong>${money(row.adFees)}</strong></div><div><span>ROAS</span><strong>${fmt(row.roas,2)}</strong></div><div><span>平均 CPC</span><strong>${money(row.avgCpc)}</strong></div><div><span>销售额</span><strong>${money(row.sales)}</strong></div><div><span>Item 数</span><strong>${fmt(row.itemCount)}</strong></div>${adStatusText(row.statusInfo) ? `<div><span>刊登状态</span><strong title="${esc(adStatusRaw(row.statusInfo))}">${esc(adStatusText(row.statusInfo))}</strong></div>` : ''}<div><span>数据天数</span><strong>${fmt(row.days)}</strong></div></div></article>`).join('');
      const table = sortRows(campaigns, 'campaigns').map(row => `<tr><td>${esc(row.campaign)}</td><td class="t-text">${esc(row.adType)}</td>${startCell(row)}<td>${fmt(row.days)}</td><td>${fmt(row.itemCount)}</td><td class="t-text" title="${esc(adStatusRaw(row.statusInfo))}">${esc(adStatusText(row.statusInfo) || '—')}</td><td>${fmt(row.impressions)}</td><td>${fmt(row.clicks)}</td><td>${pct(row.ctr)}</td><td>${fmt(row.sold)}</td><td>${pct(row.conversion)}</td><td>${money(row.sales)}</td><td>${money(row.adFees)}</td><td>${money(row.avgCpc)}</td><td>${fmt(row.roas,2)}</td><td>${row.acos == null ? '—' : pct(row.acos)}</td><td class="t-text"><span class="badge ${row.grade === '高效' ? 'green' : row.grade === '观察' ? 'amber' : row.grade === '待优化' ? 'red' : ''}">${row.grade}</span></td></tr>`).join('');
      return `<section class="metrics">${metric('广告曝光',fmt(impressions),`${fmt(campaigns.length)} 个 Campaign`)}${metric('广告点击',fmt(clicks),`CTR ${pct(clicks/impressions||0)}`)}${metric('广告销量',fmt(sold),`CVR ${pct(sold/clicks||0)}`)}${metric('广告费',money(fees),`平均 CPC ${money(fees/clicks||0)}`)}${metric('广告销售额',money(sales),`ROAS ${fmt(sales/fees||0,2)}`)}</section><div class="campaign-cards">${cards}</div><section class="dashboard-grid"><div class="panel"><div class="panel-head"><h3>Campaign 每日曝光趋势</h3></div><div id="campaignImpressionsChart" class="chart"></div></div><div class="panel"><div class="panel-head"><h3>Campaign 每日点击趋势</h3></div><div id="campaignClicksChart" class="chart"></div></div></section><section class="panel"><div class="panel-head"><h3>Campaign 每日广告费趋势</h3></div><div id="campaignFeesChart" class="chart"></div></section><section class="panel snapshot"><div class="panel-head"><h3>Campaign 汇总表</h3></div><div class="snapshot-note">「起始日」取报表标注的 Campaign start date 与我方最早有数据日中**更早**的那个（带 <b>*</b> 表示报表标注偏晚，悬停可看两个值）—— 用它判断某天缺数据是否发生在活动开始之前。</div><div class="table-wrap"><table id="campaignTable" class="table-compact"><thead><tr>${sortHeader('Campaign','campaign','campaigns')}${sortHeader('类型','adType','campaigns','t-text')}${sortHeader('起始日','adStart','campaigns','t-text')}${sortHeader('天数','days','campaigns')}${sortHeader('Item数','itemCount','campaigns')}${sortHeader('刊登状态','statusText','campaigns','t-text')}${sortHeader('曝光','impressions','campaigns')}${sortHeader('点击','clicks','campaigns')}${sortHeader('CTR','ctr','campaigns')}${sortHeader('销量','sold','campaigns')}${sortHeader('CVR','conversion','campaigns')}${sortHeader('销售额','sales','campaigns')}${sortHeader('广告费','adFees','campaigns')}${sortHeader('平均CPC','avgCpc','campaigns')}${sortHeader('ROAS','roas','campaigns')}${sortHeader('ACOS','acos','campaigns')}<th class="t-text">效率</th></tr></thead><tbody>${table}</tbody></table></div></section>`;
    }

    function adFilterState(tab = ui.adTab) {
      if (!ui.adFilters[tab]) ui.adFilters[tab] = { view: 'summary', itemId: '', term: '', keyword: '', matchType: '' };
      return ui.adFilters[tab];
    }

    function adRowRatios(row) {
      // 平均成交费（ACV，2026-11-26 新增）＝广告费 ÷ 销量：与 eBay 报表的 Average cost per sale 同口径，
      // 但按当前筛选/汇总范围重算（避免把逐行原值相加）。
      return { ...row, avgCostPerSale: row.sold > 0 ? row.adFees / row.sold : null,
        ctr: row.impressions > 0 ? row.clicks / row.impressions : null,
        conversion: row.clicks > 0 ? row.sold / row.clicks : null,
        avgCpc: row.clicks > 0 ? row.adFees / row.clicks : null,
        roas: row.adFees > 0 ? row.sales / row.adFees : null,
        acos: row.sales > 0 ? row.adFees / row.sales : null };
    }

    function adValue(value, format = fmt) { return value == null ? '—' : format(value); }

    function summarizeAdRows(rows, kind) {
      const map = new Map();
      const textKey = value => clean(value).toLowerCase();
      rows.forEach(row => {
        // 搜索词面板：Search Query 为空的行是 eBay 的合并行「Consolidated data from placements across eBay」
        // （标签在 Keyword 列）。用标签当分组键：既不会塌成一条空名行，也不会和具体搜索词混在一起。
        const key = kind === 'links' ? row.itemId : kind === 'keywords'
          ? JSON.stringify([textKey(row.keyword), row.matchType])
          : (textKey(row.searchQuery) || `合并行：${textKey(row.keyword)}`);
        if (!map.has(key)) map.set(key, { itemId: row.itemId, title: row.title, latest: '',
          impressions: 0, clicks: 0, sold: 0, sales: 0, adFees: 0,
          dates: new Set(), campaigns: new Set(), keywords: new Set(), matches: new Set(), bids: [], natural: new Map() });
        const item = map.get(key);
        ['impressions', 'clicks', 'sold', 'sales', 'adFees'].forEach(field => item[field] += Number(row[field] || 0));
        item.dates.add(row.date); item.campaigns.add(row.campaign);
        if (row.keyword) item.keywords.add(row.keyword);
        if (row.matchType) item.matches.add(row.matchType);
        if (row.bid != null && Number.isFinite(Number(row.bid))) item.bids.push(Number(row.bid));
        // 同日多行时：优先保留**带状态/库存**的那一行 —— 外部快照行没有这两个字段，
        // 而快照可能覆盖到同一天，用 >= 会让快照把真实行的状态抹成空（表现为整列「—」）。
        const fresher = !item.latest || row.date > item.latest
          || (row.date === item.latest && (item.status === undefined && row.status !== undefined))
          || (row.date === item.latest && item.available === undefined && row.available !== undefined);
        if (fresher) { item.latest = row.date; item.title = row.title; item.searchQuery = row.searchQuery; item.status = row.status; item.available = row.available; }
        if (row.naturalImpressions != null) {
          const naturalKey = JSON.stringify([row.date, row.itemId]);
          const values = [row.naturalImpressions, row.naturalClicks, row.naturalSold];
          if (!item.natural.has(naturalKey)) item.natural.set(naturalKey, values);
          else if (JSON.stringify(item.natural.get(naturalKey)) !== JSON.stringify(values)) item.natural.set(naturalKey, null);
        }
      });
      return [...map.values()].map(item => {
        const dates = [...item.dates].sort();
        const natural = [...item.natural.values()];
        const naturalTotal = index => !natural.length || natural.some(value => value === null) ? null : natural.reduce((total, value) => total + Number(value[index] || 0), 0);
        return adRowRatios({ itemId: item.itemId, title: item.title, searchQuery: item.searchQuery,
          status: item.status, available: item.available,
          campaign: [...item.campaigns].sort().join(' / '), keyword: [...item.keywords].sort().join(' / '), matchType: [...item.matches].sort().join(' / '),
          date: dates[0], end: dates.at(-1), days: dates.length, impressions: item.impressions, clicks: item.clicks,
          sold: item.sold, sales: item.sales, adFees: item.adFees,
          bid: item.bids.length ? Math.min(...item.bids) : null, bidMax: item.bids.length ? Math.max(...item.bids) : null,
          naturalImpressions: naturalTotal(0), naturalClicks: naturalTotal(1), naturalSold: naturalTotal(2) });
      });
    }

    function adTableFilters(tab, sourceRows) {
      const filter = adFilterState(tab);
      const links = tab === 'plg' || tab === 'plp';
      const options = unique(sourceRows.map(row => row.itemId)).sort();
      const matches = unique([...sourceRows.map(row => row.matchType), filter.matchType]).sort();
      return `<div class="panel toolbar">
        <div class="field field-auto"><label for="adViewFilter">查看方式</label><select class="input" id="adViewFilter" data-ad-filter="view"><option value="summary" ${filter.view === 'summary' ? 'selected' : ''}>${links ? '按 Item 汇总' : tab === 'keywords' ? '按关键词＋匹配方式汇总' : '按搜索词汇总'}</option><option value="daily" ${filter.view === 'daily' ? 'selected' : ''}>日度明细</option></select></div>
        ${links ? `<div class="field field-search"><label for="adItemFilter">Item ID</label><input class="input" type="search" id="adItemFilter" data-ad-filter="itemId" list="adItemOptions" placeholder="输入或选择 Item ID" value="${esc(filter.itemId)}" /><datalist id="adItemOptions">${options.map(id => `<option value="${esc(id)}"></option>`).join('')}</datalist></div>`
          : `<div class="field field-search"><label for="adTermFilter">${tab === 'keywords' ? '关键词包含' : '搜索词包含'}</label><input class="input" type="search" id="adTermFilter" data-ad-filter="term" placeholder="输入文字筛选" value="${esc(filter.term)}" /></div>
          ${tab === 'searches' ? `<div class="field field-search"><label for="adKeywordFilter">触发关键词包含</label><input class="input" type="search" id="adKeywordFilter" data-ad-filter="keyword" value="${esc(filter.keyword)}" placeholder="输入触发关键词" /></div>` : ''}
          <div class="field field-auto"><label for="adMatchFilter">匹配方式</label><select class="input" id="adMatchFilter" data-ad-filter="matchType"><option value="">全部匹配方式</option>${matches.map(value => `<option value="${esc(value)}" ${filter.matchType === value ? 'selected' : ''}>${esc(value)}</option>`).join('')}</select></div>`}
        <button class="btn" id="adFilterReset">清空本页筛选</button>
      </div>`;
    }

    function adResultMetrics(rows) {
      const total = adRowRatios(Object.fromEntries(['impressions', 'clicks', 'sold', 'sales', 'adFees'].map(field => [field, sum(rows, field)])));
      return `<section class="metrics">${metric('筛选结果曝光', fmt(total.impressions), '当前日期及筛选范围合计')}${metric('筛选结果点击', fmt(total.clicks), `CTR ${adValue(total.ctr, pct)}`)}${metric('筛选结果销量', fmt(total.sold), `CVR ${adValue(total.conversion, pct)}`)}${metric('筛选结果广告费', money(total.adFees), `平均 CPC ${adValue(total.avgCpc, money)}`)}${metric('筛选结果销售额', money(total.sales), `ROAS ${adValue(total.roas, value => fmt(value, 2))}`)}</section>`;
    }

    function adMetricHeaders(table) {
      return [['曝光','impressions'],['点击','clicks'],['CTR','ctr'],['销量','sold'],['CVR','conversion'],['销售额','sales'],['广告费','adFees'],['平均 CPC','avgCpc'],['ROAS','roas'],['ACOS','acos']].map(([label,key]) => sortHeader(label,key,table)).join('');
    }

    function adMetricCells(row) {
      return `<td>${fmt(row.impressions)}</td><td>${fmt(row.clicks)}</td><td>${adValue(row.ctr,pct)}</td><td>${fmt(row.sold)}</td><td>${adValue(row.conversion,pct)}</td><td>${money(row.sales)}</td><td>${money(row.adFees)}</td><td>${adValue(row.avgCpc,money)}</td><td>${adValue(row.roas,value => fmt(value,2))}</td><td>${adValue(row.acos,pct)}</td>`;
    }

    function adLinksTable(type) {
      const tab = type === 'PLG' ? 'plg' : 'plp';
      const table = type === 'PLG' ? 'plgLinks' : 'plpLinks';
      const filter = adFilterState(tab);
      const source = adDetailRows().filter(row => row.adType === type);
      const filtered = source.filter(row => !filter.itemId || String(row.itemId).includes(filter.itemId));
      const summary = filter.view === 'summary';
      const rows = sortRows(summary ? summarizeAdRows(filtered,'links') : filtered.map(adRowRatios),table);
      const body = rows.map(row => `<tr><td>${summary ? rangeText(row.date,row.end) : esc(row.date)}</td>${summary ? `<td>${fmt(row.days)}</td>` : ''}<td><a href="https://www.ebay.com/itm/${esc(row.itemId)}" target="_blank" rel="noopener">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td>${type === 'PLP' ? `<td class="t-text">${esc(row.status || '—')}</td><td>${row.available == null ? '—' : fmt(row.available)}</td>` : ''}${adMetricCells(row)}${type === 'PLG' ? `<td>${adValue(row.naturalImpressions)}</td><td>${adValue(row.naturalClicks)}</td><td>${adValue(row.naturalSold)}</td>` : ''}<td class="t-text">${esc(row.campaign)}</td></tr>`).join('');
      return `${adTableFilters(tab,source)}${adResultMetrics(filtered)}<section class="panel"><div class="panel-head"><h3>${type} 链接表现 · ${summary ? 'Item 汇总' : '日度明细'}</h3><small>${summary ? `${fmt(rows.length)} 个 Item，来自 ${fmt(filtered.length)} 条日度记录` : `${fmt(rows.length)} 条日度记录`}</small></div>
        <div class="snapshot-note">按上方日期、Campaign 和本页 Item ID 筛选。汇总时同一 Item 跨日期、跨 Campaign 合并，比例按合计值重算。${summary && type === 'PLG' ? '自然指标按同日 Item 去重，多个 Campaign 的自然记录不一致时显示 —。' : ''}</div>
        <div class="table-wrap"><table class="table-compact"><thead><tr>${sortHeader(summary ? '数据区间' : '日期','date',table)}${summary ? sortHeader('记录天数','days',table) : ''}${sortHeader('Item ID','itemId',table)}${sortHeader('标题','title',table)}${type === 'PLP' ? sortHeader('刊登状态','status',table,'t-text') + sortHeader('库存','available',table) : ''}${adMetricHeaders(table)}${type === 'PLG' ? sortHeader('自然曝光','naturalImpressions',table)+sortHeader('自然点击','naturalClicks',table)+sortHeader('自然销量','naturalSold',table) : ''}${sortHeader('Campaign','campaign',table,'t-text')}</tr></thead><tbody>${body || `<tr><td colspan="${(summary ? 15 : 14)+(type === 'PLG' ? 3 : 0)}">当前筛选范围没有记录，请调整日期、Campaign 或 Item ID。</td></tr>`}</tbody></table></div></section>`;
    }

    function adTermsRows(type) {
      const isKeyword = type === 'keywords';
      const filter = adFilterState(type);
      const source = (isKeyword ? dataState.ads.keywordRows : dataState.ads.searchRows).filter(row => withinAdsRange(row) && (!ui.campaigns.length || ui.campaigns.includes(row.campaign)));
      const contains = (value,query) => !query || clean(value).toLowerCase().includes(query.toLowerCase());
      const filtered = source.filter(row => contains(isKeyword ? row.keyword : row.searchQuery,filter.term) && contains(row.keyword,filter.keyword) && (!filter.matchType || row.matchType === filter.matchType));
      const summary = filter.view === 'summary';
      const rows = sortRows(summary ? summarizeAdRows(filtered,type) : filtered.map(adRowRatios),type);
      return { isKeyword, source, filtered, summary, rows };
    }

    // 广告诊断（2026-11-26）：运营/投放每天该动手的两件事 —— ① 花了钱没出单的词（候选加否定）
    // ② 出单效率最高的词（候选提价/加预算）。口径＝当前日期/活动/机型筛选下的词汇总行。
    // 阈值（可调）：无单浪费＝点击 ≥ 3 且销量 0；ROAS 分级 2 / 4。
    function adDiagnosisPage() {
      const searches = summarizeAdRows(adTermsRows('searches').filtered, 'searches');
      const keywords = summarizeAdRows(adTermsRows('keywords').filtered, 'keywords');
      const wordOf = (row, kind) => kind === 'searches' ? (row.searchQuery || '（合并行）') : row.keyword;
      const panel = (kind, rows, title, hint) => {
        if (!rows.length) return `<section class="panel"><div class="panel-head"><h3>${title}</h3><small>${hint}</small></div><div class="empty" style="padding:22px">当前筛选下没有符合条件的行</div></section>`;
        const body = rows.map(row => {
          const roas = row.adFees > 0 ? row.sales / row.adFees : null;
          return `<tr><td class="t-text" title="${esc(wordOf(row, title.includes('搜索词') ? 'searches' : 'keywords'))}">${esc((wordOf(row, title.includes('搜索词') ? 'searches' : 'keywords') || '').slice(0, 46))}</td><td class="t-text">${esc(row.matchType || '—')}</td><td class="t-text">${esc(String(row.campaign || '').replace(/US\.TD\.(PLP|PLG)\./, '').slice(0, 26))}</td><td>${fmt(row.clicks || 0)}</td><td>${money(row.adFees || 0)}</td><td>${fmt(row.sold || 0)}</td><td>${money(row.sales || 0)}</td><td>${roas == null ? '—' : fmt(roas, 2)}</td></tr>`;
        }).join('');
        return `<section class="panel"><div class="panel-head"><h3>${title}</h3><small>${hint}</small></div>
          <div class="table-wrap"><table><thead><tr><th class="t-text">词</th><th class="t-text">匹配方式</th><th class="t-text">活动</th><th>点击</th><th>广告费</th><th>销量</th><th>销售额</th><th>ROAS</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
      };
      const wasteOf = rows => rows.filter(row => (row.clicks || 0) >= 3 && !(row.sold > 0)).sort((a, b) => (b.adFees || 0) - (a.adFees || 0)).slice(0, 20);
      const winnerOf = rows => rows.filter(row => row.sold > 0).sort((a, b) => (b.sales / (b.adFees || 1)) - (a.sales / (a.adFees || 1))).slice(0, 20);
      return `<div class="metrics" style="grid-template-columns:repeat(4,minmax(0,1fr))">
          ${metric('候选否定词（搜索词）', fmt(wasteOf(searches).length), '点击 ≥3 且 0 出单')}
          ${metric('出单词（搜索词）', fmt(winnerOf(searches).length), '本期有出单')}
          ${metric('候选否定词（关键词）', fmt(wasteOf(keywords).length), '点击 ≥3 且 0 出单')}
          ${metric('出单词（关键词）', fmt(winnerOf(keywords).length), '本期有出单')}
        </div>
        ${panel('waste', wasteOf(searches), '搜索词 · 花钱无单（候选加否定）', '按广告费降序，最多 20 行；已在搜索词报表里按「搜索词＋匹配方式」合并')}
        ${panel('winner', winnerOf(searches), '搜索词 · 出单词（候选提价）', '按 ROAS 降序，最多 20 行；ROAS ≥ 4 标「高效」')}
        ${panel('waste', wasteOf(keywords), '关键词 · 花钱无单（候选加否定）', '按广告费降序，最多 20 行；同一关键词＋匹配方式合并')}
        ${panel('winner', winnerOf(keywords), '关键词 · 出单词（候选提价）', '按 ROAS 降序，最多 20 行')}`;
    }

    function adTermsTable(type) {
      const { isKeyword, source, filtered, summary, rows } = adTermsRows(type);

    function adTermsColumns(isKeyword, summary) {
      const columns = [{ label: summary ? '数据区间' : '日期', get: row => summary ? rangeText(row.date, row.end) : row.date }];

      if (!isKeyword) columns.push({ label: '搜索词', get: row => row.searchQuery, text: true });

      }
      columns.push({ label: '曝光', get: row => row.impressions, format: '#,##0' });
      columns.push({ label: '点击', get: row => row.clicks, format: '#,##0' });
      columns.push({ label: 'CTR', get: row => row.ctr, format: '0.00%' });
      columns.push({ label: '销量', get: row => row.sold, format: '#,##0' });
      columns.push({ label: 'CVR', get: row => row.conversion, format: '0.00%' });
      columns.push({ label: '销售额', get: row => row.sales, format: '$#,##0.00' });

      columns.push({ label: 'ACOS', get: row => row.acos, format: '0.00%' });
      columns.push({ label: 'Campaign', get: row => row.campaign, text: true });
      return columns;

    function exportAdTerms(type) {
      const { isKeyword, filtered, summary, rows } = adTermsRows(type);
      const title = isKeyword ? '关键词' : '搜索词';
      if (!rows.length) return toast(`当前筛选范围没有可导出的${title}记录。`, true);
      const columns = adTermsColumns(isKeyword, summary);
      const lastColumn = columns.length - 1;
      const meta = `日期：${rangeText(ui.start, ui.end)}；Campaign：${ui.campaigns.length ? ui.campaigns.join(' / ') : '全部'}；${summary ? `${fmt(rows.length)} 条汇总，来自 ${fmt(filtered.length)} 条日度记录` : `${fmt(rows.length)} 条日度记录`}；比例按合计值重算；— 表示无数据。`;
      const sheet = XLSX.utils.aoa_to_sheet([
        [`eBay AD600 Elite · 广告看板 · ${title}表现 · ${summary ? '区间汇总' : '日度明细'}`],
        [meta],
        columns.map(column => column.label),
        ...rows.map(row => columns.map(column => { const value = column.get(row); return value == null || value === '' ? (column.format ? '—' : '') : value; }))
      ]);
      sheet['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: lastColumn } }, { s: { r: 1, c: 0 }, e: { r: 1, c: lastColumn } }];
      sheet['!cols'] = columns.map((column, index) => ({ wch: index === 0 ? 18 : /搜索词|关键词|匹配方式|Campaign/.test(column.label) ? 26 : 13 }));
      sheet['!rows'] = [{ hpt: 30 }, { hpt: 26 }, { hpt: 28 }, ...rows.map(() => ({ hpt: 20 }))];
      sheet['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 2, c: 0 }, e: { r: rows.length + 2, c: lastColumn } }) };
      for (let r = 0; r <= rows.length + 2; r += 1) {
        for (let c = 0; c <= lastColumn; c += 1) {
          const address = XLSX.utils.encode_cell({ r, c });
          const cell = sheet[address] || (sheet[address] = { t: 's', v: '' });
          if (r >= 3 && columns[c].format && cell.v !== '—' && cell.v !== '') { cell.t = 'n'; cell.v = Number(cell.v); cell.z = columns[c].format; }
          cell.s = {
            font: { name: '微软雅黑', sz: r === 0 ? 14 : 11, bold: r <= 2, color: { rgb: r === 0 || r === 2 ? 'FFFFFF' : r === 1 ? '52657A' : '20354D' } },
            fill: { patternType: 'solid', fgColor: { rgb: r === 0 ? '1769AA' : r === 1 ? 'F3F6FA' : r === 2 ? '2F7BBF' : r % 2 === 1 ? 'F8FAFC' : 'FFFFFF' } },
            alignment: { vertical: 'center', horizontal: r === 0 || r === 1 ? 'left' : r === 2 ? 'center' : c === 0 || columns[c].text ? 'left' : 'right', wrapText: true },
            border: { bottom: { style: 'thin', color: { rgb: 'DFE6EE' } }, right: { style: 'thin', color: { rgb: 'DFE6EE' } } }
          };
        }
      }
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, sheet, `${title}表现`);
      XLSX.writeFile(workbook, `eBay-广告看板-${title}-${new Date().toLocaleDateString('sv-SE')}.xlsx`);
    }

    // KPI 概览（2026-11-26）：本板块（PLG＋PLP 链接行，已随日期/活动/机型筛选）按自然周聚合成
    // 「近 N 周」序列，每张卡显示当期值、环比（与上一周比）和一条迷你趋势线。数据与「周度对比」同口径。
    let kpiWeekly = null;
    function adsKpiWeekly() {
      const weekCount = ui.kpiWeeks == null ? 6 : Number(ui.kpiWeeks);   // 0 = 全部
      const weekOf = date => {
        const day = new Date(String(date) + 'T00:00:00Z');
        day.setUTCDate(day.getUTCDate() - ((day.getUTCDay() + 6) % 7));
        return day.toISOString().slice(0, 10);
      };
      const buckets = new Map();
      adDetailRows().forEach(row => {
        if (!row.date) return;
        const week = weekOf(row.date);
        if (!buckets.has(week)) buckets.set(week, { impressions: 0, clicks: 0, sold: 0, sales: 0, adFees: 0 });
        const cell = buckets.get(week);
        cell.impressions += row.impressions || 0; cell.clicks += row.clicks || 0; cell.sold += row.sold || 0;
        cell.sales += row.sales || 0; cell.adFees += row.adFees || 0;
      });
      let weeks = [...buckets.keys()].sort();
      if (weekCount > 0 && weeks.length > weekCount) weeks = weeks.slice(-weekCount);
      return { weeks, buckets };
    }
    function adsKpiOverview() {
      const { weeks, buckets } = adsKpiWeekly();
      kpiWeekly = { weeks, buckets };
      if (!weeks.length) return '';
      const rate = (cell, key) => {
        if (key === 'roas') return cell.adFees > 0 ? cell.sales / cell.adFees : null;
        if (key === 'acos') return cell.sales > 0 ? cell.adFees / cell.sales : null;
        if (key === 'cpc') return cell.clicks > 0 ? cell.adFees / cell.clicks : null;
        if (key === 'cvr') return cell.clicks > 0 ? cell.sold / cell.clicks : null;
        if (key === 'ctr') return cell.impressions > 0 ? cell.clicks / cell.impressions : null;
        return null;
      };
      const CARDS = [
        ['广告销售额', 'sales', value => money(value)],
        ['广告花费', 'adFees', value => money(value)],
        ['ROAS', 'roas', value => fmt(value, 2)],
        ['广告销量', 'sold', value => fmt(value)],
        ['广告点击', 'clicks', value => fmt(value)],
        ['ACOS（广告费÷销售额）', 'acos', value => pct(value)],
        ['CPC（广告费÷点击）', 'cpc', value => money(value)],
        ['CVR（销量÷点击）', 'cvr', value => pct(value)],
        ['广告曝光', 'impressions', value => fmt(value)],
        ['CTR（点击÷曝光）', 'ctr', value => pct(value)],
        ['平均成交费（广告费÷销量）', 'acv', value => money(value)],
        ['广告费占销售额', 'acos2', value => pct(value)]
      ];
      const valueOf = (cell, key) => {
        if (key === 'acv') return cell.sold > 0 ? cell.adFees / cell.sold : null;
        if (key === 'acos2') return cell.sales > 0 ? cell.adFees / cell.sales : null;
        return rate(cell, key) != null ? rate(cell, key) : cell[key];
      };
      const cards = CARDS.map(([label, key, format]) => {
        const current = valueOf(buckets.get(weeks.at(-1)), key);
        const previous = weeks.length > 1 ? valueOf(buckets.get(weeks.at(-2)), key) : null;
        const delta = current != null && previous != null && previous !== 0 ? (current - previous) / Math.abs(previous) : null;
        const badge = delta == null ? '<span class="badge">环比 —</span>'
          : `<span class="badge ${delta >= 0 ? 'green' : 'red'}">${delta >= 0 ? '↑' : '↓'} ${pct(Math.abs(delta))} 环比</span>`;
        return `<article class="panel kpi-card"><div class="panel-body">
          <div class="kpi-head"><strong>${label}</strong>${badge}</div>
          <div class="kpi-value">${current == null ? '—' : format(current)}<small>当期（${esc(weeks.at(-1)?.slice(5).replace('-', '/') || '')}~${esc(weeks.at(-1) ? covAddDays(weeks.at(-1), 6).slice(5).replace('-', '/') : '')}）</small></div>
          <div class="kpi-chart" id="kpiChart-${key}"></div>
        </div></article>`;
      }).join('');
      const options = [[4, '近 4 周'], [6, '近 6 周'], [8, '近 8 周'], [12, '近 12 周'], [0, '全部']];
      return `<section class="panel kpi-panel"><div class="panel-head"><h3>KPI 概览</h3>
          <span class="actions"><small style="margin-right:8px">按自然周（周一~周日）聚合，随本页日期／活动筛选联动</small><span class="field"><select class="input" id="kpiWeeksSelect" style="width:auto">${options.map(([value, label]) => `<option value="${value}" ${(ui.kpiWeeks == null ? 6 : Number(ui.kpiWeeks)) === value ? 'selected' : ''}>${label}</option>`).join('')}</select></span></span></div>
        <div class="kpi-grid">${cards}</div></section>`;
    }
    function renderKpiCharts() {
      if (!kpiWeekly || !kpiWeekly.weeks.length) return;
      const { weeks, buckets } = kpiWeekly;
      const labels = weeks.map(week => `${week.slice(5).replace('-', '/')}`.replace(/^(\d+)\/(\d+)$/, '$1/$2'));
      const series = key => weeks.map(week => {
        const cell = buckets.get(week);
        if (key === 'roas') return cell.adFees > 0 ? Number((cell.sales / cell.adFees).toFixed(2)) : null;
        if (key === 'acos' || key === 'acos2') return cell.sales > 0 ? Number((cell.adFees / cell.sales * 100).toFixed(2)) : null;
        if (key === 'cpc') return cell.clicks > 0 ? Number((cell.adFees / cell.clicks).toFixed(2)) : null;
        if (key === 'cvr') return cell.clicks > 0 ? Number((cell.sold / cell.clicks * 100).toFixed(2)) : null;
        if (key === 'ctr') return cell.impressions > 0 ? Number((cell.clicks / cell.impressions * 100).toFixed(2)) : null;
        if (key === 'acv') return cell.sold > 0 ? Number((cell.adFees / cell.sold).toFixed(2)) : null;
        return cell[key] || 0;
      });
      document.querySelectorAll('[id^="kpiChart-"]').forEach(element => {
        const key = element.id.replace('kpiChart-', '');
        const unit = (key === 'sales' || key === 'adFees' || key === 'cpc' || key === 'acv') ? '$' : (key === 'acos' || key === 'cvr' || key === 'ctr' || key === 'acos2') ? '%' : '';
        const point = value => (value == null ? '—' : unit === '$' ? `$${value}` : unit === '%' ? `${value}%` : value);
        const chart = echarts.init(element);
        chart.setOption({
          animationDuration: 300,
          grid: { left: 8, right: 8, top: 8, bottom: 18, containLabel: false },
          tooltip: { trigger: 'axis', valueFormatter: point, confine: true },
          xAxis: { type: 'category', data: labels, axisLabel: { fontSize: 9, color: '#697586' }, axisTick: { show: false }, axisLine: { show: false } },
          yAxis: { type: 'value', show: false, scale: true },
          series: [{ type: 'line', data: series(key), smooth: true, symbolSize: 4, showSymbol: true,
            lineStyle: { width: 2 }, areaStyle: { opacity: 0.18 } }]
        });
        charts.push(chart);
      });
    }

    function renderAdCharts() {
      const elements = ['campaignImpressionsChart','campaignClicksChart','campaignFeesChart'].map(id => document.getElementById(id));
      if (elements.some(element => !element)) return;
      const rows = adDetailRows();
      const campaigns = unique(rows.map(row => row.campaign)).sort();
      const dates = unique(rows.map(row => row.date)).sort();
      const value = (campaign, date, field) => rows.filter(row => row.campaign === campaign && row.date === date).reduce((total,row)=>total+(row[field]||0),0);
      const options = [
        ['曝光','impressions'], ['点击','clicks'], ['广告费','adFees']
      ];
      elements.forEach((element,index) => {
        const [label,field] = options[index];
        const chart = echarts.init(element);
        chart.setOption({ animationDuration:350, tooltip:{trigger:'axis'}, legend:{top:4,type:'scroll'}, grid:{left:58,right:24,top:48,bottom:46}, xAxis:{type:'category',data:dates.map(date=>date.slice(5))}, yAxis:{type:'value',name:label,splitLine:{lineStyle:{color:'#edf0f3'}}}, series:campaigns.map(campaign=>({name:campaign.replace('US.TD.PLG.topdon_scanner.',''),type:'line',smooth:true,showSymbol:false,data:dates.map(date=>value(campaign,date,field))})) });
        charts.push(chart);
      });
    }
