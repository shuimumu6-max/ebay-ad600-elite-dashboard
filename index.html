      return `<div class="table-wrap"><table><thead><tr>${sortHeader('日期', 'date', 'daily')}${sortHeader('Item ID', 'itemId', 'daily')}${sortHeader('标题', 'title', 'daily')}${sortHeader('数据状态', 'status', 'daily')}${sortHeader('总曝光', 'trafficTotalImpressions', 'daily')}${sortHeader('总PV', 'trafficPageViews', 'daily')}${sortHeader('站内PV', 'trafficEbayViews', 'daily')}${sortHeader('站外PV', 'trafficExternalViews', 'daily')}${sortHeader('总销量', 'trafficSold', 'daily')}${sortHeader('总 CTR', 'trafficCtr', 'daily')}${sortHeader('总转化率', 'trafficConversion', 'daily')}${sortHeader('自然曝光', 'trafficNaturalImpressions', 'daily')}${sortHeader('自然 eBay PV', 'trafficNaturalViews', 'daily')}${sortHeader('自然 SOLD', 'organicSold', 'daily')}${sortHeader('自然 CTR', 'trafficNaturalCtr', 'daily')}${sortHeader('自然转化率', 'organicConversion', 'daily')}${sortHeader('PLG曝光', 'adImpressions', 'daily')}${sortHeader('PLG点击', 'adClicks', 'daily')}${sortHeader('PLG CTR', 'ctr', 'daily')}${sortHeader('PLG销量', 'adSold', 'daily')}${sortHeader('PLG销售额', 'adSales', 'daily')}${sortHeader('PLG广告费', 'adFees', 'daily')}${sortHeader('PLG ROAS', 'roas', 'daily')}${sortHeader('PLP曝光', 'plpImpressions', 'daily')}${sortHeader('PLP点击', 'plpClicks', 'daily')}${sortHeader('PLP广告费', 'plpFees', 'daily')}${sortHeader('PLP ROAS', 'plpRoas', 'daily')}</tr></thead><tbody>${sorted.map(row => `<tr>
        <td>${row.date}</td><td><a href="${esc(row.link)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td style="text-align:left"><span class="badge ${row.hasDailyTraffic ? 'green' : 'amber'}">${row.hasDailyTraffic ? '完整' : '缺Traffic'}</span></td>
        <td>${row.hasDailyTraffic ? fmt(row.trafficTotalImpressions) : '—'}</td><td>${row.hasDailyTraffic ? fmt(row.trafficPageViews) : '—'}</td><td>${row.hasDailyTraffic ? fmt(row.trafficEbayViews) : '—'}</td><td>${row.hasDailyTraffic ? fmt(row.trafficExternalViews) : '—'}</td><td>${row.hasDailyTraffic ? fmt(row.trafficSold) : '—'}</td><td>${row.hasDailyTraffic ? pct(row.trafficCtr) : '—'}</td><td>${row.hasDailyTraffic ? pct(row.trafficConversion) : '—'}</td>
        <td>${row.hasDailyTraffic ? fmt(row.trafficNaturalImpressions) : '—'}</td><td>${row.hasDailyTraffic ? fmt(row.trafficNaturalViews) : '—'}</td><td>${fmt(row.organicSold)}</td><td>${row.hasDailyTraffic ? pct(row.trafficNaturalCtr) : '—'}</td><td>${row.hasDailyTraffic ? pct(row.organicSold / row.trafficNaturalViews || 0) : '—'}</td>
        <td>${fmt(row.adImpressions)}</td><td>${fmt(row.adClicks)}</td><td>${pct(row.ctr)}</td><td>${fmt(row.adSold)}</td><td>${money(row.adSales)}</td><td>${money(row.adFees)}</td><td>${fmt(row.roas, 2)}</td><td>${row.plpImpressions == null ? '—' : fmt(row.plpImpressions)}</td><td>${row.plpClicks == null ? '—' : fmt(row.plpClicks)}</td><td>${row.plpFees == null ? '—' : money(row.plpFees)}</td><td>${row.plpRoas == null ? '—' : fmt(row.plpRoas, 2)}</td>
      </tr>`).join('')}</tbody></table></div>`;
    }

    function importPage() {
      return `<div class="page-head"><div><h2>数据导入</h2><p>支持同时选择多个 CSV，系统会自动识别报表类型并去重。</p></div><div class="actions">${dataState.sources.length ? `<button class="btn danger" id="clearBtn">${icon('trash-2')}清空数据</button>` : ''}</div></div>
        <section class="panel"><div class="panel-body"><div class="upload-zone" id="dropZone"><div><div class="upload-icon">${icon('files', 24)}</div><h3>上传 Traffic 与 PLG CSV</h3><p>可以一次选择多个文件。PLG 按日期、Item ID、广告活动去重；Traffic 按报表区间和 Item ID 去重。</p><button class="btn primary" id="uploadBtn">${icon('folder-open')}选择文件</button><div class="upload-note">CSV 仅在当前浏览器中解析和保存</div></div></div></div></section>
        ${dataState.sources.length ? importDiagnostics() : ''}
        <div class="source-grid">${dataState.sources.length ? dataState.sources.map(sourceCard).join('') : ''}</div>`;
    }

    function importDiagnostics() {
      const plgDates = unique(dataState.plgRaw.map(row => row.date)).sort();
      const trafficDailyDates = unique(dataState.trafficRaw.filter(row => row.start && row.start === row.end).map(row => row.start)).sort();
      const missingTraffic = plgDates.filter(date => !trafficDailyDates.includes(date));
      const rangeCount = unique(dataState.trafficRaw.filter(row => row.start !== row.end).map(row => `${row.start}|${row.end}`)).length;
      return `<section class="panel snapshot"><div class="panel-head"><h3>日期覆盖检查</h3><small>用于判断能否生成完整日度看板</small></div><div class="panel-body"><div class="snapshot-metrics">
        <div class="snapshot-metric"><span>PLG 日度</span><strong>${fmt(plgDates.length)} 天</strong></div>
        <div class="snapshot-metric"><span>单日 Traffic</span><strong>${fmt(trafficDailyDates.length)} 天</strong></div>
        <div class="snapshot-metric"><span>Traffic 区间快照</span><strong>${fmt(rangeCount)} 份</strong></div>
        <div class="snapshot-metric"><span>缺单日 Traffic</span><strong>${fmt(missingTraffic.length)} 天</strong></div>
      </div>${missingTraffic.length ? `<p class="snapshot-note" style="margin-top:12px;margin-bottom:0">缺少单日 Traffic：${esc(missingTraffic.join('、'))}。当前仍可查看 PLG 日度趋势，链接总曝光、总 Page views 等 Traffic 指标暂不能按日展示。</p>` : ''}</div></section>`;
    }

    function sourceCard(source) {
      const isTraffic = source.type === 'Traffic';
      return `<article class="source-item"><div class="source-top"><div class="source-name" title="${esc(source.name)}">${esc(source.name)}</div><span class="badge ${isTraffic ? 'amber' : 'blue'}">${esc(source.type)}</span></div><div class="source-meta"><span>${rangeText(source.start, source.end)}</span><span>${fmt(source.count)} 行 · ${source.type === 'Active' ? '在售名单快照' : isTraffic ? esc(source.periodKind || '区间累计') : '日度明细'}</span></div></article>`;
    }

    function itemDetailRows() {
      return itemPerformance(true).filter(row => !dataState.activeListings || (ui.listingStatus || 'active') === 'all' || row.listingStatus === (ui.listingStatus || 'active'));
    }

    function listingStatusPanel() {
      const snapshot = dataState.activeListings;
      const history = new Set([...dataState.trafficRaw, ...dataState.plgRaw, ...(dataState.ads.plpRows || [])].filter(row => inProduct(row)).map(row => row.itemId));
      const active = new Set((snapshot?.items || []).map(row => row.itemId));
      const absent = [...history].filter(id => !active.has(id)).length;
      const selected = ui.listingStatus || 'active';
      return `<section class="metrics">${metric('当前在售 Item', snapshot ? fmt(active.size) : '待确认', snapshot ? '名单日期：' + snapshot.date : '请提供完整在售商品报表')}${metric('历史记录 Item', fmt(history.size), '全部历史数据去重，不受所选日期影响')}${metric('历史链接不在最新名单', snapshot ? fmt(absent) : '待确认', '不等同于已确认下架')}</section>
        <div class="panel" style="padding:16px;margin-bottom:16px"><div class="field"><label for="listingStatusFilter">Item 在售状态</label><select class="input" id="listingStatusFilter">${[['active','在售'],['all','全部（含历史）'],['absent','不在最新在售名单'],['unknown','状态待确认']].map(([value,label]) => `<option value="${value}" ${selected === value ? 'selected' : ''}>${label}</option>`).join('')}</select></div><p class="field-help">${snapshot ? `名单日期：${esc(snapshot.date)}（文件导出日期），来源：${esc(snapshot.name)}。` : '尚无在售名单，当前显示数据状态待确认的链接。'}状态按最新名单中的 Item ID 判断，与经营数据所选时间范围无关；未在名单中不直接判为下架，可能涉及结束、售罄或导出范围。名单可能包含零库存链接，不代表均可购买。新在售链接即使所选区间没有表现记录也保留，指标显示“—”。筛选仅作用于本页及 Item 导出，经营看板和每日历史保留原口径。</p></div>`;
    }

    function detailPage() {
      const rows = itemDetailRows();
      const trafficRows = trafficPeriodRows();
      const [plgStart, plgEnd] = plgDateRange();
      const [plpStart, plpEnd] = plpDateRange();
      const trafficRange = trafficRows.length ? rangeText(trafficRows[0].start, trafficRows[0].end) : '未上传';
      return `<div class="page-head"><div><h2>Item 完整明细</h2><p>链接汇总数据优先展示，每个 Item 一行，随后查看 PLG、PLP 与自然流量。</p></div><div class="actions"><button class="btn" id="exportBtn">${icon('download')}导出 Item 数据</button></div></div>
        ${filterPanel()}
        ${listingStatusPanel()}
        <div class="snapshot-note">PLP：${rangeText(plpStart, plpEnd)}，已匹配 ${fmt(rows.filter(row => row.hasPlp).length)} 个 Item，链接汇总数据位于基础信息之后。Traffic：${trafficRange}；PLG：${rangeText(plgStart, plpEnd)}。${esc(trafficSelection().note)}</div>
        <div class="snapshot-note">「当前售价」取该链接最近一次导出报表里的当前价（Price (Current or Last Price)，已含当时生效的促销/降价），不是标价、也不是成交均价；同一链接在区间内调过价时，这里显示最新那个价。</div>
        ${rows.some(row => row.salesMismatch) ? `<div class="snapshot-note">${esc(salesReconciliationNote(rows))}</div>` : ''}
        <section class="panel"><div class="panel-head"><h3>Item 完整明细</h3><small>当前筛选 ${fmt(rows.length)} 个 Item</small></div>${itemFullTable(rows, trafficRows, plgStart, plgEnd)}</section>`;
    }

    function itemFullTable(rows, trafficRows, plgStart, plgEnd) {
      if (!rows.length) return `<div class="empty">当前筛选范围没有 Item 数据</div>`;
      const samePeriod = Boolean(trafficSelection().complete && trafficRows.length && trafficRows[0].start === plgStart && trafficRows[0].end === plgEnd);
      const sorted = sortRows(rows.map(row => ({ ...row, naturalConversion: samePeriod && row.hasTraffic && row.hasPlg ? row.naturalSold / row.naturalViews || 0 : null })), 'detail');
      return `<div class="table-wrap"><table><thead><tr><th colspan="5" style="text-align:center">基础信息</th><th colspan="8" style="text-align:center;background:#eef5fb">链接汇总数据</th><th colspan="11" style="text-align:center;background:#fff7e8">PLG 数据</th><th colspan="13" style="text-align:center;background:#f4f0fb">PLP 数据（已匹配 ${fmt(rows.filter(row => row.hasPlp).length)} 个 Item）</th><th colspan="5" style="text-align:center;background:#edf7f1">自然流量</th><th colspan="13" style="text-align:center;background:#f2f3f5">PLP 数据（Smart）</th></tr><tr>
        ${sortHeader('Item ID', 'itemId', 'detail')}${sortHeader('标题', 'title', 'detail')}${sortHeader('上架日期', 'listingStartDate', 'detail')}${sortHeader('距今上架时间', 'listingAgeDays', 'detail')}${sortHeader('在售状态', 'listingStatusText', 'detail')}
        ${sortHeader('总PV（Total page views）', 'totalPageViews', 'detail')}${sortHeader('Impression', 'totalImpressions', 'detail')}${sortHeader('站内PV（eBay）', 'ebayViews', 'detail')}${sortHeader('站外PV（External）', 'externalViews', 'detail')}${sortHeader('销量（Traffic）', 'quantitySold', 'detail')}${sortHeader('Click-through rate', 'totalCtr', 'detail')}${sortHeader('Sales conversion rate', 'totalConversion', 'detail')}${sortHeader('PV核对（日度减累计）', 'pvAudit', 'detail')}
        ${sortHeader('当前售价', 'price', 'detail', 'plg-col')}${sortHeader('报表总销量', 'plgTotalSold', 'detail', 'plg-col')}<th class="plg-col">费率</th><th class="plg-col">建议费率</th>${sortHeader('PLG Impressions', 'adImpressions', 'detail', 'plg-col')}${sortHeader('PLG Clicks', 'adClicks', 'detail', 'plg-col')}${sortHeader('CTR', 'adCtr', 'detail', 'plg-col')}${sortHeader('PLG Sold', 'adSold', 'detail', 'plg-col')}${sortHeader('PLG Sales', 'adSales', 'detail', 'plg-col')}${sortHeader('Ad fees', 'adFees', 'detail', 'plg-col')}${sortHeader('ROAS', 'roas', 'detail', 'plg-col')}
        <th class="plp-col">Impressions</th><th class="plp-col">Clicks</th><th class="plp-col">CTR</th><th class="plp-col">Sold quantity</th><th class="plp-col">Ad fees</th><th class="plp-col">Sales</th><th class="plp-col">Conversion rate</th><th class="plp-col">ROAS</th><th class="plp-col">Average CPC</th><th class="plp-col">ACOS</th><th class="plp-col">主推关键词</th><th class="plp-col">建议出价</th><th class="plp-col">实际出价</th>
        ${sortHeader('曝光', 'naturalImpressions', 'detail')}${sortHeader('eBay Page views', 'naturalViews', 'detail')}${sortHeader('SOLD', 'naturalSold', 'detail')}${sortHeader('点击率', 'naturalCtr', 'detail')}${sortHeader('Sales conversion rate', 'naturalConversion', 'detail')}
        <th>Impressions</th><th>Clicks</th><th>CTR</th><th>Sold quantity</th><th>Ad fees</th><th>Sales</th><th>Conversion rate</th><th>ROAS</th><th>Average CPC</th><th>ACOS</th><th>主推关键词</th><th>建议出价</th><th>实际出价</th>
      </tr></thead><tbody>${sorted.map(row => `<tr>
        <td><a href="${esc(row.link)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td>${row.listingStartDate ? esc(row.listingStartDate) : '—'}</td><td>${row.listingAgeDays == null ? '—' : fmt(row.listingAgeDays) + ' 天'}</td><td style="min-width:160px">${esc(row.listingStatusText)}</td>
        <td>${row.hasTraffic ? fmt(row.totalPageViews) : '—'}</td><td>${row.hasTraffic ? fmt(row.totalImpressions) : '—'}</td><td>${row.hasTraffic ? fmt(row.ebayViews) : '—'}</td><td>${row.hasTraffic ? fmt(row.externalViews) : '—'}</td><td>${row.hasTraffic ? fmt(row.quantitySold) : '—'}${row.salesMismatch ? ' <span class="badge amber">待核对</span>' : ''}</td><td>${row.hasTraffic ? pct(row.totalCtr) : '—'}</td><td>${row.hasTraffic ? pct(row.totalConversion) : '—'}</td><td style="white-space:normal;min-width:180px">${esc(row.pvAudit)}</td>
        <td class="plg-col">${row.hasPlg ? money(row.price) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.plgTotalSold) : '—'}</td><td class="plg-col">—</td><td class="plg-col">—</td><td class="plg-col">${row.hasPlg ? fmt(row.adImpressions) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.adClicks) : '—'}</td><td class="plg-col">${row.hasPlg ? pct(row.adCtr) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.adSold) : '—'}</td><td class="plg-col">${row.hasPlg ? money(row.adSales) : '—'}</td><td class="plg-col">${row.hasPlg ? money(row.adFees) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.roas, 2) : '—'}</td>
        <td class="plp-col">${row.hasPlp ? fmt(row.plpImpressions) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpClicks) : '—'}</td><td class="plp-col">${row.hasPlp ? pct(row.plpCtr) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpSold) : '—'}</td><td class="plp-col">${row.hasPlp ? money(row.plpFees) : '—'}</td><td class="plp-col">${row.hasPlp ? money(row.plpSales) : '—'}</td><td class="plp-col">${row.hasPlp ? pct(row.plpConversion) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpRoas, 2) : '—'}</td><td class="plp-col">${row.hasPlp ? money(row.plpAvgCpc) : '—'}</td><td class="plp-col">${row.hasPlp ? pct(row.plpAcos) : '—'}</td><td class="plp-col">—</td><td class="plp-col">—</td><td class="plp-col">—</td>
        <td>${row.hasTraffic ? fmt(row.naturalImpressions) : '—'}</td><td>${row.hasTraffic ? fmt(row.naturalViews) : '—'}</td><td>${row.hasPlg ? fmt(row.naturalSold) : '—'}</td><td>${row.hasTraffic ? pct(row.naturalCtr) : '—'}</td><td>${samePeriod && row.hasTraffic && row.hasPlg ? pct(row.naturalSold / row.naturalViews || 0) : '—'}</td>
        ${'<td>—</td>'.repeat(13)}
      </tr>`).join('')}</tbody></table></div>`;
    }

    function trafficTable(rows) {
      if (!rows.length) return `<div class="empty">还没有 Traffic 数据</div>`;
      const sorted = sortRows(rows, 'traffic');
      return `<div class="table-wrap"><table><thead><tr>${sortHeader('Item ID', 'itemId', 'traffic')}${sortHeader('标题', 'title', 'traffic')}${sortHeader('总曝光', 'totalImpressions', 'traffic')}${sortHeader('总 Page views', 'totalPageViews', 'traffic')}${sortHeader('销量', 'quantitySold', 'traffic')}${sortHeader('站内广告曝光', 'promotedEbayImpressions', 'traffic')}${sortHeader('站内自然曝光', 'organicEbayImpressions', 'traffic')}${sortHeader('站内广告 PV', 'promotedEbayViews', 'traffic')}${sortHeader('站内自然 PV', 'organicEbayViews', 'traffic')}${sortHeader('站外广告 PV', 'promotedExternalViews', 'traffic')}${sortHeader('站外自然 PV', 'organicExternalViews', 'traffic')}</tr></thead><tbody>${sorted.map(row => `<tr><td>${esc(row.itemId)}</td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td>${fmt(row.totalImpressions)}</td><td>${fmt(row.totalPageViews)}</td><td>${fmt(row.quantitySold)}</td><td>${fmt(row.promotedEbayImpressions)}</td><td>${fmt(row.organicEbayImpressions)}</td><td>${fmt(row.promotedEbayViews)}</td><td>${fmt(row.organicEbayViews)}</td><td>${fmt(row.promotedExternalViews)}</td><td>${fmt(row.organicExternalViews)}</td></tr>`).join('')}</tbody></table></div>`;
    }

    function withinAdsRange(row) {
      return (!ui.start || row.date >= ui.start) && (!ui.end || row.date <= ui.end);
    }

    function adDetailRows() {
      const plg = dataState.plgRaw.filter(row => inProduct(row)).map(row => ({ date: row.date, campaign: row.campaign, adType: 'PLG', itemId: row.itemId, title: row.title, impressions: row.adImpressions, clicks: row.adClicks, sold: row.adSold, sales: row.adSales, adFees: row.adFees, naturalImpressions: row.organicImpressions, naturalClicks: row.organicClicks, naturalSold: row.organicSold }));
      const plp = (dataState.ads.plpRows || []).map(row => ({ ...row, adType: 'PLP', naturalImpressions: null, naturalClicks: null, naturalSold: null }));
      return [...plg, ...plp].filter(row => withinAdsRange(row) && (!ui.campaigns.length || ui.campaigns.includes(row.campaign)));
    }

    function adCampaignRows() {
      const map = new Map();
      adDetailRows().forEach(row => {
        if (!map.has(row.campaign)) map.set(row.campaign, { campaign: row.campaign, adTypes: new Set(), dates: new Set(), items: new Set(), impressions: 0, clicks: 0, sold: 0, sales: 0, adFees: 0 });
        const item = map.get(row.campaign);
        item.adTypes.add(row.adType); item.dates.add(row.date); item.items.add(row.itemId);
        ['impressions','clicks','sold','sales','adFees'].forEach(field => item[field] += row[field] || 0);
      });
      return [...map.values()].map(row => ({ ...row, adType: [...row.adTypes].join('/'), days: row.dates.size, itemCount: row.items.size, ctr: row.clicks / row.impressions || 0, conversion: row.sold / row.clicks || 0, avgCpc: row.adFees / row.clicks || 0, roas: row.sales / row.adFees || 0 }));
    }

    function campaignChips() {
      const names = unique([...dataState.plgRaw.map(row => row.campaign), ...(dataState.ads.plpRows || []).map(row => row.campaign)]).sort();
      return `<div class="campaign-chips"><button class="campaign-chip ${ui.campaigns.length ? '' : 'active'}" data-campaign="">全部 Campaign</button>${names.map(name => `<button class="campaign-chip ${ui.campaigns.includes(name) ? 'active' : ''}" data-campaign="${esc(name)}">${esc(name.replace('US.TD.PLG.topdon_scanner.', ''))}</button>`).join('')}</div>`;
    }

    function campaignOverview() {
      const campaigns = adCampaignRows();
      const impressions = sum(campaigns, 'impressions'), clicks = sum(campaigns, 'clicks'), sold = sum(campaigns, 'sold'), sales = sum(campaigns, 'sales'), fees = sum(campaigns, 'adFees');
      const cards = [...campaigns].sort((a,b) => b.impressions-a.impressions).map(row => `<article class="panel campaign-card"><div class="campaign-card-head"><strong>${esc(row.campaign)}</strong><span class="badge ${row.adType.includes('PLP') ? 'blue' : 'amber'}">${esc(row.adType)}</span></div><div class="campaign-card-grid"><div><span>曝光</span><strong>${fmt(row.impressions)}</strong></div><div><span>点击 / CTR</span><strong>${fmt(row.clicks)} / ${pct(row.ctr)}</strong></div><div><span>销量 / CVR</span><strong>${fmt(row.sold)} / ${pct(row.conversion)}</strong></div><div><span>广告费</span><strong>${money(row.adFees)}</strong></div><div><span>ROAS</span><strong>${fmt(row.roas,2)}</strong></div><div><span>平均 CPC</span><strong>${money(row.avgCpc)}</strong></div><div><span>销售额</span><strong>${money(row.sales)}</strong></div><div><span>Item 数</span><strong>${fmt(row.itemCount)}</strong></div><div><span>数据天数</span><strong>${fmt(row.days)}</strong></div></div></article>`).join('');
      const table = sortRows(campaigns, 'campaigns').map(row => `<tr><td>${esc(row.campaign)}</td><td>${esc(row.adType)}</td><td>${fmt(row.days)}</td><td>${fmt(row.itemCount)}</td><td>${fmt(row.impressions)}</td><td>${fmt(row.clicks)}</td><td>${pct(row.ctr)}</td><td>${fmt(row.sold)}</td><td>${pct(row.conversion)}</td><td>${money(row.sales)}</td><td>${money(row.adFees)}</td><td>${money(row.avgCpc)}</td><td>${fmt(row.roas,2)}</td></tr>`).join('');
      return `<section class="metrics">${metric('广告曝光',fmt(impressions),`${fmt(campaigns.length)} 个 Campaign`)}${metric('广告点击',fmt(clicks),`CTR ${pct(clicks/impressions||0)}`)}${metric('广告销量',fmt(sold),`CVR ${pct(sold/clicks||0)}`)}${metric('广告费',money(fees),`平均 CPC ${money(fees/clicks||0)}`)}${metric('广告销售额',money(sales),`ROAS ${fmt(sales/fees||0,2)}`)}</section><div class="campaign-cards">${cards}</div><section class="dashboard-grid"><div class="panel"><div class="panel-head"><h3>Campaign 每日曝光趋势</h3></div><div id="campaignImpressionsChart" class="chart"></div></div><div class="panel"><div class="panel-head"><h3>Campaign 每日点击趋势</h3></div><div id="campaignClicksChart" class="chart"></div></div></section><section class="panel"><div class="panel-head"><h3>Campaign 每日广告费趋势</h3></div><div id="campaignFeesChart" class="chart"></div></section><section class="panel snapshot"><div class="panel-head"><h3>Campaign 汇总表</h3></div><div class="table-wrap"><table id="campaignTable"><thead><tr>${sortHeader('Campaign','campaign','campaigns')}${sortHeader('类型','adType','campaigns')}${sortHeader('天数','days','campaigns')}${sortHeader('Item数','itemCount','campaigns')}${sortHeader('曝光','impressions','campaigns')}${sortHeader('点击','clicks','campaigns')}${sortHeader('CTR','ctr','campaigns')}${sortHeader('销量','sold','campaigns')}${sortHeader('CVR','conversion','campaigns')}${sortHeader('销售额','sales','campaigns')}${sortHeader('广告费','adFees','campaigns')}${sortHeader('平均CPC','avgCpc','campaigns')}${sortHeader('ROAS','roas','campaigns')}</tr></thead><tbody>${table}</tbody></table></div></section>`;
    }

    function adFilterState(tab = ui.adTab) {
      if (!ui.adFilters[tab]) ui.adFilters[tab] = { view: 'summary', itemId: '', term: '', keyword: '', matchType: '' };
      return ui.adFilters[tab];
    }

    function adRowRatios(row) {
      return { ...row, ctr: row.impressions > 0 ? row.clicks / row.impressions : null,
        conversion: row.clicks > 0 ? row.sold / row.clicks : null,
        avgCpc: row.clicks > 0 ? row.adFees / row.clicks : null,
        roas: row.adFees > 0 ? row.sales / row.adFees : null,
        acos: row.sales > 0 ? row.adFees / row.sales : null };
    }

    function adValue(value, format = fmt) { return value == null ? '—' : format(value); }

    function summarizeAdRows(rows, kind) {
      const map = new Map();
      const textKey = value => clean(value).toLowerCase();
      rows.forEach(row => {
        const key = kind === 'links' ? row.itemId : kind === 'keywords'
          ? JSON.stringify([textKey(row.keyword), row.matchType]) : textKey(row.searchQuery);
        if (!map.has(key)) map.set(key, { itemId: row.itemId, title: row.title, latest: '',
          impressions: 0, clicks: 0, sold: 0, sales: 0, adFees: 0,
          dates: new Set(), campaigns: new Set(), keywords: new Set(), matches: new Set(), bids: [], natural: new Map() });
        const item = map.get(key);
        ['impressions', 'clicks', 'sold', 'sales', 'adFees'].forEach(field => item[field] += Number(row[field] || 0));
        item.dates.add(row.date); item.campaigns.add(row.campaign);
        if (row.keyword) item.keywords.add(row.keyword);
        if (row.matchType) item.matches.add(row.matchType);
        if (row.bid != null && Number.isFinite(Number(row.bid))) item.bids.push(Number(row.bid));
        if (!item.latest || row.date >= item.latest) { item.latest = row.date; item.title = row.title; item.searchQuery = row.searchQuery; }
        if (row.naturalImpressions != null) {
          const naturalKey = JSON.stringify([row.date, row.itemId]);
          const values = [row.naturalImpressions, row.naturalClicks, row.naturalSold];
          if (!item.natural.has(naturalKey)) item.natural.set(naturalKey, values);
          else if (JSON.stringify(item.natural.get(naturalKey)) !== JSON.stringify(values)) item.natural.set(naturalKey, null);
        }
      });
      return [...map.values()].map(item => {
        const dates = [...item.dates].sort();
        const natural = [...item.natural.values()];
        const naturalTotal = index => !natural.length || natural.some(value => value === null) ? null : natural.reduce((total, value) => total + Number(value[index] || 0), 0);
        return adRowRatios({ itemId: item.itemId, title: item.title, searchQuery: item.searchQuery,
          campaign: [...item.campaigns].sort().join(' / '), keyword: [...item.keywords].sort().join(' / '), matchType: [...item.matches].sort().join(' / '),
          date: dates[0], end: dates.at(-1), days: dates.length, impressions: item.impressions, clicks: item.clicks,
          sold: item.sold, sales: item.sales, adFees: item.adFees,
          bid: item.bids.length ? Math.min(...item.bids) : null, bidMax: item.bids.length ? Math.max(...item.bids) : null,
          naturalImpressions: naturalTotal(0), naturalClicks: naturalTotal(1), naturalSold: naturalTotal(2) });
      });
    }

    function adTableFilters(tab, sourceRows) {
      const filter = adFilterState(tab);
      const links = tab === 'plg' || tab === 'plp';
      const options = unique(sourceRows.map(row => row.itemId)).sort();
      const matches = unique([...sourceRows.map(row => row.matchType), filter.matchType]).sort();
      return `<div class="panel filters">
        <div class="field"><label for="adViewFilter">查看方式</label><select class="input" id="adViewFilter" data-ad-filter="view"><option value="summary" ${filter.view === 'summary' ? 'selected' : ''}>${links ? '按 Item 汇总' : tab === 'keywords' ? '按关键词＋匹配方式汇总' : '按搜索词汇总'}</option><option value="daily" ${filter.view === 'daily' ? 'selected' : ''}>日度明细</option></select></div>
        ${links ? `<div class="field"><label for="adItemFilter">Item ID</label><input class="input" type="search" id="adItemFilter" data-ad-filter="itemId" list="adItemOptions" placeholder="输入或选择 Item ID" value="${esc(filter.itemId)}" /><datalist id="adItemOptions">${options.map(id => `<option value="${esc(id)}"></option>`).join('')}</datalist></div>`
          : `<div class="field"><label for="adTermFilter">${tab === 'keywords' ? '关键词包含' : '搜索词包含'}</label><input class="input" type="search" id="adTermFilter" data-ad-filter="term" placeholder="输入文字筛选" value="${esc(filter.term)}" /></div>
          ${tab === 'searches' ? `<div class="field"><label for="adKeywordFilter">触发关键词包含</label><input class="input" type="search" id="adKeywordFilter" data-ad-filter="keyword" value="${esc(filter.keyword)}" placeholder="输入触发关键词" /></div>` : ''}
          <div class="field"><label for="adMatchFilter">匹配方式</label><select class="input" id="adMatchFilter" data-ad-filter="matchType"><option value="">全部匹配方式</option>${matches.map(value => `<option value="${esc(value)}" ${filter.matchType === value ? 'selected' : ''}>${esc(value)}</option>`).join('')}</select></div>`}
        <button class="btn" id="adFilterReset">清空本页筛选</button>
      </div>`;
    }

    function adResultMetrics(rows) {
      const total = adRowRatios(Object.fromEntries(['impressions', 'clicks', 'sold', 'sales', 'adFees'].map(field => [field, sum(rows, field)])));
      return `<section class="metrics">${metric('筛选结果曝光', fmt(total.impressions), '当前日期及筛选范围合计')}${metric('筛选结果点击', fmt(total.clicks), `CTR ${adValue(total.ctr, pct)}`)}${metric('筛选结果销量', fmt(total.sold), `CVR ${adValue(total.conversion, pct)}`)}${metric('筛选结果广告费', money(total.adFees), `平均 CPC ${adValue(total.avgCpc, money)}`)}${metric('筛选结果销售额', money(total.sales), `ROAS ${adValue(total.roas, value => fmt(value, 2))}`)}</section>`;
    }

    function adMetricHeaders(table) {
      return [['曝光','impressions'],['点击','clicks'],['CTR','ctr'],['销量','sold'],['CVR','conversion'],['销售额','sales'],['广告费','adFees'],['平均 CPC','avgCpc'],['ROAS','roas'],['ACOS','acos']].map(([label,key]) => sortHeader(label,key,table)).join('');
    }

    function adMetricCells(row) {
      return `<td>${fmt(row.impressions)}</td><td>${fmt(row.clicks)}</td><td>${adValue(row.ctr,pct)}</td><td>${fmt(row.sold)}</td><td>${adValue(row.conversion,pct)}</td><td>${money(row.sales)}</td><td>${money(row.adFees)}</td><td>${adValue(row.avgCpc,money)}</td><td>${adValue(row.roas,value => fmt(value,2))}</td><td>${adValue(row.acos,pct)}</td>`;
    }

    function adLinksTable(type) {
      const tab = type === 'PLG' ? 'plg' : 'plp';
      const table = type === 'PLG' ? 'plgLinks' : 'plpLinks';
      const filter = adFilterState(tab);
      const source = adDetailRows().filter(row => row.adType === type);
      const filtered = source.filter(row => !filter.itemId || String(row.itemId).includes(filter.itemId));
      const summary = filter.view === 'summary';
      const rows = sortRows(summary ? summarizeAdRows(filtered,'links') : filtered.map(adRowRatios),table);
      const body = rows.map(row => `<tr><td>${summary ? rangeText(row.date,row.end) : esc(row.date)}</td>${summary ? `<td>${fmt(row.days)}</td>` : ''}<td><a href="https://www.ebay.com/itm/${esc(row.itemId)}" target="_blank" rel="noopener">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td>${adMetricCells(row)}${type === 'PLG' ? `<td>${adValue(row.naturalImpressions)}</td><td>${adValue(row.naturalClicks)}</td><td>${adValue(row.naturalSold)}</td>` : ''}<td>${esc(row.campaign)}</td></tr>`).join('');
      return `${adTableFilters(tab,source)}${adResultMetrics(filtered)}<section class="panel"><div class="panel-head"><h3>${type} 链接表现 · ${summary ? 'Item 汇总' : '日度明细'}</h3><small>${summary ? `${fmt(rows.length)} 个 Item，来自 ${fmt(filtered.length)} 条日度记录` : `${fmt(rows.length)} 条日度记录`}</small></div>
        <div class="snapshot-note">按上方日期、Campaign 和本页 Item ID 筛选。汇总时同一 Item 跨日期、跨 Campaign 合并，比例按合计值重算。${summary && type === 'PLG' ? '自然指标按同日 Item 去重，多个 Campaign 的自然记录不一致时显示 —。' : ''}</div>
        <div class="table-wrap"><table><thead><tr>${sortHeader(summary ? '数据区间' : '日期','date',table)}${summary ? sortHeader('记录天数','days',table) : ''}${sortHeader('Item ID','itemId',table)}${sortHeader('标题','title',table)}${adMetricHeaders(table)}${type === 'PLG' ? sortHeader('自然曝光','naturalImpressions',table)+sortHeader('自然点击','naturalClicks',table)+sortHeader('自然销量','naturalSold',table) : ''}${sortHeader('Campaign','campaign',table)}</tr></thead><tbody>${body || `<tr><td colspan="${(summary ? 15 : 14)+(type === 'PLG' ? 3 : 0)}">当前筛选范围没有记录，请调整日期、Campaign 或 Item ID。</td></tr>`}</tbody></table></div></section>`;
    }

    function adTermsTable(type) {
      const isKeyword = type === 'keywords';
      const filter = adFilterState(type);
      const source = (isKeyword ? dataState.ads.keywordRows : dataState.ads.searchRows).filter(row => withinAdsRange(row) && (!ui.campaigns.length || ui.campaigns.includes(row.campaign)));
      const contains = (value,query) => !query || clean(value).toLowerCase().includes(query.toLowerCase());
      const filtered = source.filter(row => contains(isKeyword ? row.keyword : row.searchQuery,filter.term) && contains(row.keyword,filter.keyword) && (!filter.matchType || row.matchType === filter.matchType));
      const summary = filter.view === 'summary';
      const rows = sortRows(summary ? summarizeAdRows(filtered,type) : filtered.map(adRowRatios),type);
      const body = rows.map(row => `<tr><td>${summary ? rangeText(row.date,row.end) : esc(row.date)}</td>${summary ? `<td>${fmt(row.days)}</td>` : ''}${isKeyword ? '' : `<td>${esc(row.searchQuery)}</td>`}<td>${esc(row.keyword)}</td><td>${esc(row.matchType)}</td>${isKeyword ? `<td>${adValue(row.bid,money)}${summary && row.bidMax !== row.bid ? ` 至 ${adValue(row.bidMax,money)}` : ''}</td>` : ''}${adMetricCells(row)}<td>${esc(row.campaign)}</td></tr>`).join('');
      return `${adTableFilters(type,source)}${adResultMetrics(filtered)}<section class="panel"><div class="panel-head"><h3>${isKeyword ? '关键词' : '搜索词'}表现 · ${summary ? '区间汇总' : '日度明细'}</h3><small>${fmt(rows.length)} 条${summary ? '汇总，来自 '+fmt(filtered.length)+' 条日度记录' : '日度记录'}</small></div>
        <div class="snapshot-note">${isKeyword ? '同一关键词和匹配方式跨日期、跨 Campaign 合并；出价显示所选期间的最小值至最大值。' : '同一搜索词跨日期、跨 Campaign、跨触发关键词合并；触发关键词及匹配方式列展示涉及的全部值。'} 汇总跟随日期及本页筛选，比例按合计值重算。记录天数仅代表报表中存在记录的天数。</div>
        <div class="table-wrap"><table><thead><tr>${sortHeader(summary ? '数据区间' : '日期','date',type)}${summary ? sortHeader('记录天数','days',type) : ''}${isKeyword ? '' : sortHeader('搜索词','searchQuery',type)}${sortHeader(isKeyword ? '关键词' : '触发关键词','keyword',type)}${sortHeader('匹配方式','matchType',type)}${isKeyword ? sortHeader(summary ? '期间出价范围' : 'Bid','bid',type) : ''}${adMetricHeaders(type)}${sortHeader('Campaign','campaign',type)}</tr></thead><tbody>${body || `<tr><td colspan="${summary ? 16 : 15}">当前筛选范围没有记录，请调整筛选条件。</td></tr>`}</tbody></table></div></section>`;
    }


    function advertisingPage() {
      const tabs = [['overview','Campaign 总览'],['plg','PLG 链接'],['plp','PLP 链接'],['keywords','关键词'],['searches','搜索词']];
      const content = ui.adTab === 'overview' ? campaignOverview() : ui.adTab === 'plg' ? adLinksTable('PLG') : ui.adTab === 'plp' ? adLinksTable('PLP') : adTermsTable(ui.adTab);
      return `<div class="page-head"><div><h2>广告看板</h2><p>Campaign、PLG/PLP 链接、关键词和搜索词独立分析；不包含运营调整。</p></div></div><div class="panel filters"><div class="field"><label>开始日期</label><input class="input" id="startFilter" type="date" value="${esc(ui.start)}" /></div><div class="field"><label>结束日期</label><input class="input" id="endFilter" type="date" value="${esc(ui.end)}" /></div></div>${campaignChips()}<div class="ad-tabs">${tabs.map(([id,label])=>`<button class="ad-tab ${ui.adTab===id?'active':''}" data-ad-tab="${id}">${label}</button>`).join('')}</div>${content}`;
    }

    function coveragePage() {
      const counts = { '直接提供': 0, '可计算': 0, '缺少': 0 };
      COVERAGE.forEach(row => counts[row[1]]++);
      const rows = sortRows(COVERAGE.map(([field, status, note]) => ({ field, status, note })), 'coverage');
      return `<div class="page-head"><div><h2>钉钉字段覆盖</h2><p>盘点 Traffic + PLG + PLP + 关键词能否提供现有表格所需指标。</p></div></div><div class="coverage">
        <div class="coverage-summary">
          <div class="coverage-count"><strong>${counts['直接提供']}</strong><span>直接提供</span></div>
          <div class="coverage-count"><strong>${counts['可计算']}</strong><span>可计算</span></div>
          <div class="coverage-count"><strong>${counts['缺少']}</strong><span>仍缺少</span></div>
        </div>
        <section class="panel"><div class="table-wrap"><table><thead><tr>${sortHeader('钉钉字段', 'field', 'coverage')}${sortHeader('覆盖状态', 'status', 'coverage')}${sortHeader('来源或计算方法', 'note', 'coverage')}</tr></thead><tbody>${rows.map(({ field, status, note }) => `<tr><td>${esc(field)}</td><td style="text-align:left"><span class="badge ${status === '直接提供' ? 'green' : status === '可计算' ? 'blue' : 'red'}">${status}</span></td><td style="text-align:left;white-space:normal;min-width:280px">${esc(note)}</td></tr>`).join('')}</tbody></table></div></section>
      </div>`;
    }

    function renderCharts() {
      charts.forEach(chart => chart.dispose());
      charts = [];
      const itemEl = document.getElementById('itemChart');
      const ebayPvEl = document.getElementById('ebayPvChart');
      const channelEl = document.getElementById('channelChart');
      const trendEl = document.getElementById('trendChart');
      if (!itemEl || !ebayPvEl || !channelEl || !trendEl) return;
      const rows = itemPerformance();
      const top = rows.filter(row => row.hasTraffic).slice(0, 12).reverse();
      const itemChart = echarts.init(itemEl);
      itemChart.setOption({
        animationDuration: 350,
        color: ['#1769aa'],
        tooltip: { trigger: 'axis' },
        grid: { left: 108, right: 30, top: 22, bottom: 32 },
        xAxis: { type: 'value', splitLine: { lineStyle: { color: '#edf0f3' } } },
        yAxis: { type: 'category', data: top.map(row => row.itemId), axisLabel: { color: '#697586', fontSize: 10 }, axisLine: { lineStyle: { color: '#dce2e8' } } },
        series: [{ name: '链接总曝光', type: 'bar', barMaxWidth: 16, data: top.map(row => row.totalImpressions) }]
      });
      const ebayPvRows = rows.filter(row => row.hasTraffic).sort((a, b) => b.ebayViews - a.ebayViews).slice(0, 12).reverse();
      const ebayPvChart = echarts.init(ebayPvEl);
      ebayPvChart.setOption({
        animationDuration: 350,
        color: ['#4d9b78'],
        tooltip: { trigger: 'axis' },
        grid: { left: 108, right: 30, top: 22, bottom: 32 },
        xAxis: { type: 'value', splitLine: { lineStyle: { color: '#edf0f3' } } },
        yAxis: { type: 'category', data: ebayPvRows.map(row => row.itemId), axisLabel: { color: '#697586', fontSize: 10 }, axisLine: { lineStyle: { color: '#dce2e8' } } },
        series: [{ name: 'eBay Page views', type: 'bar', barMaxWidth: 16, data: ebayPvRows.map(row => row.ebayViews) }]
      });
      const channelChart = echarts.init(channelEl);
      channelChart.setOption({
        animationDuration: 350,
        color: ['#1769aa'],
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        grid: { left: 70, right: 24, top: 24, bottom: 48 },
        xAxis: { type: 'category', data: ['链接总曝光', '自然曝光', 'PLG 曝光', 'PLP 曝光'], axisLabel: { color: '#697586', interval: 0 } },
        yAxis: { type: 'value', splitLine: { lineStyle: { color: '#edf0f3' } } },
        series: [{ name: '曝光', type: 'bar', barMaxWidth: 38, data: [sum(rows, 'totalImpressions'), sum(rows, 'naturalImpressions'), sum(rows, 'adImpressions'), sum(rows, 'plpImpressions')] }]
      });
      const dailyMap = new Map();
      dailyItemRecords().forEach(row => {
        if (!dailyMap.has(row.date)) dailyMap.set(row.date, { date: row.date, ebayViews: 0, plgClicks: 0, plpClicks: 0 });
        const day = dailyMap.get(row.date);
        day.ebayViews += row.hasDailyTraffic ? row.trafficEbayViews || 0 : 0;
        day.plgClicks += row.adClicks || 0;
        day.plpClicks += row.plpClicks || 0;
      });
      const trendRows = [...dailyMap.values()].sort((a, b) => a.date.localeCompare(b.date));
      const trendChart = echarts.init(trendEl);
      trendChart.setOption({
        animationDuration: 350,
        color: ['#1769aa', '#d97706', '#4d9b78'],
        tooltip: { trigger: 'axis' },
        legend: { top: 0, textStyle: { color: '#697586' } },
        grid: { left: 58, right: 58, top: 42, bottom: 48 },
        xAxis: { type: 'category', data: trendRows.map(row => row.date.slice(5)), axisLabel: { color: '#697586' } },
        yAxis: [
          { type: 'value', name: 'eBay PV', splitLine: { lineStyle: { color: '#edf0f3' } } },
          { type: 'value', name: '广告点击', splitLine: { show: false } }
        ],
        series: [
          { name: 'eBay PV', type: 'line', smooth: true, showSymbol: false, data: trendRows.map(row => row.ebayViews) },
          { name: 'PLG 点击', type: 'line', yAxisIndex: 1, smooth: true, showSymbol: false, data: trendRows.map(row => row.plgClicks) },
          { name: 'PLP 点击', type: 'line', yAxisIndex: 1, smooth: true, showSymbol: false, data: trendRows.map(row => row.plpClicks) }
        ]
      });
      charts.push(itemChart, ebayPvChart, channelChart, trendChart);
    }

    function renderAdCharts() {
      const elements = ['campaignImpressionsChart','campaignClicksChart','campaignFeesChart'].map(id => document.getElementById(id));
      if (elements.some(element => !element)) return;
      const rows = adDetailRows();
      const campaigns = unique(rows.map(row => row.campaign)).sort();
      const dates = unique(rows.map(row => row.date)).sort();
      const value = (campaign, date, field) => rows.filter(row => row.campaign === campaign && row.date === date).reduce((total,row)=>total+(row[field]||0),0);
      const options = [
        ['曝光','impressions'], ['点击','clicks'], ['广告费','adFees']
      ];
      elements.forEach((element,index) => {
        const [label,field] = options[index];
        const chart = echarts.init(element);
        chart.setOption({ animationDuration:350, tooltip:{trigger:'axis'}, legend:{top:4,type:'scroll'}, grid:{left:58,right:24,top:48,bottom:46}, xAxis:{type:'category',data:dates.map(date=>date.slice(5))}, yAxis:{type:'value',name:label,splitLine:{lineStyle:{color:'#edf0f3'}}}, series:campaigns.map(campaign=>({name:campaign.replace('US.TD.PLG.topdon_scanner.',''),type:'line',smooth:true,showSymbol:false,data:dates.map(date=>value(campaign,date,field))})) });
        charts.push(chart);
      });
    }

    function bindEvents() {
      document.querySelectorAll('[data-ad-filter]').forEach(input => input.addEventListener('change', event => {
        adFilterState()[input.dataset.adFilter] = event.target.value.trim();
        render();
      }));
      document.getElementById('adFilterReset')?.addEventListener('click', () => {
        const filter = adFilterState();
        Object.assign(filter, { itemId: '', term: '', keyword: '', matchType: '' });
        render();
      });
      document.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => { ui.page = button.dataset.page; render(); }));
      document.querySelectorAll('[data-product]').forEach(button => button.addEventListener('click', () => {
        ui.product = button.dataset.product;
        // 两个产品的数据日期范围不同，切换后让日期区间按当前产品重新推导
        ui.start = ''; ui.end = ''; ui.trafficPeriod = ''; ui.campaigns = []; ui.query = '';
        ui.adTab = 'overview';
        applyProduct();
        render();
      }));
      document.querySelectorAll('[data-ad-tab]').forEach(button => button.addEventListener('click', () => { ui.adTab = button.dataset.adTab; render(); }));
      document.querySelectorAll('[data-campaign]').forEach(button => button.addEventListener('click', () => {
        const campaign = button.dataset.campaign;
        if (!campaign) ui.campaigns = [];
        else ui.campaigns = ui.campaigns.includes(campaign) ? ui.campaigns.filter(item => item !== campaign) : [...ui.campaigns, campaign];
        render();
      }));
      document.querySelectorAll('[data-detail]').forEach(button => button.addEventListener('click', () => { ui.detail = button.dataset.detail; render(); }));
      document.querySelectorAll('th[data-sort-key]').forEach(header => header.addEventListener('click', () => {
        const sameColumn = ui.sort.table === header.dataset.sortTable && ui.sort.key === header.dataset.sortKey;
        ui.sort = { table: header.dataset.sortTable, key: header.dataset.sortKey, dir: sameColumn ? ui.sort.dir * -1 : 1 };
        render();
      }));
      ['uploadBtn', 'topUploadBtn'].forEach(id => document.getElementById(id)?.addEventListener('click', () => document.getElementById('fileInput').click()));
      document.getElementById('exportBtn')?.addEventListener('click', exportData);
      document.getElementById('dailyExportBtn')?.addEventListener('click', exportDailyData);
      document.getElementById('clearBtn')?.addEventListener('click', clearData);
      const query = document.getElementById('queryFilter');
      query?.addEventListener('change', e => { ui.query = e.target.value.trim(); render(); });
      document.getElementById('startFilter')?.addEventListener('change', e => { ui.start = e.target.value; ui.trafficPeriod = 'custom'; render(); });
      document.getElementById('endFilter')?.addEventListener('change', e => { ui.end = e.target.value; ui.trafficPeriod = 'custom'; render(); });
      document.getElementById('trafficSourceFilter')?.addEventListener('change', e => { ui.trafficSource = e.target.value; render(); });
      document.getElementById('listingStatusFilter')?.addEventListener('change', e => { ui.listingStatus = e.target.value; render(); });
      document.getElementById('trafficPeriodFilter')?.addEventListener('change', e => {
        ui.trafficPeriod = e.target.value;
        if (ui.trafficPeriod !== 'custom') [ui.start, ui.end] = ui.trafficPeriod.split('|');
        render();
      });
      const zone = document.getElementById('dropZone');
      if (zone) {
        ['dragenter','dragover'].forEach(name => zone.addEventListener(name, e => { e.preventDefault(); zone.classList.add('drag'); }));
        ['dragleave','drop'].forEach(name => zone.addEventListener(name, e => { e.preventDefault(); zone.classList.remove('drag'); }));
        zone.addEventListener('drop', e => importFiles([...e.dataTransfer.files]));
      }
      lucide.createIcons();
      if (ui.page === 'dashboard') setTimeout(renderCharts, 0);
      if (ui.page === 'ads' && ui.adTab === 'overview') setTimeout(renderAdCharts, 0);
    }

    async function importFiles(files) {
      const csvFiles = files.filter(file => file.name.toLowerCase().endsWith('.csv'));
      if (!csvFiles.length) return toast('请选择 CSV 文件。', true);
      loading(true, `正在处理 ${csvFiles.length} 个文件…`);
      const messages = [];
      for (const file of csvFiles) {
        try {
          const result = await readFile(file);
          mergeImport(result);
          messages.push(`${result.type}：${result.rows.length} 行`);
        } catch (error) {
          messages.push(`${file.name}：${error.message}`);
        }
      }
      await saveState();
      loading(false);
      ui.page = 'dashboard';
      render();
      toast(`导入完成。${messages.join('；')}`);
      document.getElementById('fileInput').value = '';
    }

    function exportData() {
      const rows = itemDetailRows();
      if (!rows.length) return toast('没有可导出的 Item 数据。', true);
      const trafficRows = trafficPeriodRows();
      const [plgStart, plgEnd] = plgDateRange();
      const [plpStart, plpEnd] = plpDateRange();
      const samePeriod = Boolean(trafficSelection().complete && trafficRows.length && trafficRows[0].start === plgStart && trafficRows[0].end === plgEnd);
      const ordered = sortRows(rows.map(row => ({ ...row, naturalConversion: samePeriod && row.hasTraffic && row.hasPlg ? row.naturalSold / row.naturalViews || 0 : null })), 'detail');
      const container = document.createElement('div');
      container.innerHTML = itemFullTable(rows, trafficRows, plgStart, plgEnd);
      container.querySelectorAll('.sort-indicator').forEach(node => node.remove());
      const table = container.querySelector('table');
      const trafficRange = trafficRows.length ? rangeText(trafficRows[0].start, trafficRows[0].end) : '未上传';
      const sheet = XLSX.utils.aoa_to_sheet([
        ['eBay AD600 Elite · Item 完整明细'],
        ['Traffic：' + trafficRange + '；PLG：' + rangeText(plgStart, plgEnd) + '；PLP：' + rangeText(plpStart, plpEnd) + '；共 ' + rows.length + ' 个 Item；在售名单：' + (dataState.activeListings ? dataState.activeListings.date + ' / ' + dataState.activeListings.name : '未提供') + '；状态筛选：' + (ui.listingStatus || 'active') + '；— 表示无数据或未提供；' + trafficSelection().note + ' ' + salesReconciliationNote(rows)]
      ]);
      XLSX.utils.sheet_add_dom(sheet, table, { origin: 'A3', raw: true });
      const headers = [...table.tHead.rows[1].cells].map(cell => cell.textContent.trim());
      const keys = [
        'itemId','title','listingStartDate','listingAgeDays','listingStatusText','totalPageViews','totalImpressions','ebayViews','externalViews','quantitySold','totalCtr','totalConversion','pvAudit',
        'price','plgTotalSold',null,null,'adImpressions','adClicks','adCtr','adSold','adSales','adFees','roas',
        'plpImpressions','plpClicks','plpCtr','plpSold','plpFees','plpSales','plpConversion','plpRoas','plpAvgCpc','plpAcos',null,null,null,
        'naturalImpressions','naturalViews','naturalSold','naturalCtr','naturalConversion', ...Array(13).fill(null)
      ];
      const colors = ['E9EEF5','EEF5FB','FFF7E8','F4F0FB','EDF7F1','F2F3F5'];
      const columnColors = [...table.tHead.rows[0].cells].flatMap((cell, index) => Array(cell.colSpan).fill(colors[index]));
      const lastColumn = headers.length - 1;
      sheet['!merges'] = [...(sheet['!merges'] || []), { s: { r: 0, c: 0 }, e: { r: 0, c: lastColumn } }, { s: { r: 1, c: 0 }, e: { r: 1, c: lastColumn } }];
      sheet['!cols'] = headers.map((label, index) => ({ wch: index === 0 ? 19 : index === 1 ? 60 : /rate|views|Conversion/i.test(label) ? 21 : 17 }));
      sheet['!rows'] = [{ hpt: 30 }, { hpt: 32 }, { hpt: 28 }, { hpt: 44 }, ...rows.map(() => ({ hpt: 42 }))];
      sheet['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 3, c: 0 }, e: { r: rows.length + 3, c: lastColumn } }) };
      for (let r = 0; r < rows.length + 4; r += 1) {
        for (let c = 0; c < headers.length; c += 1) {
          const address = XLSX.utils.encode_cell({ r, c });
          const cell = sheet[address] || (sheet[address] = { t: 's', v: '' });
          if (r >= 4 && c === 0) {
            cell.t = 's'; cell.v = ordered[r - 4].itemId;
            cell.l = { Target: ordered[r - 4].link, Tooltip: '打开 eBay 链接' };
          } else if (r >= 4 && c === 2 && ordered[r - 4].listingStartDate) {
            cell.t = 'n'; cell.v = Date.parse(ordered[r - 4].listingStartDate) / 86400000 + 25569;
            cell.z = 'yyyy-mm-dd';
          } else if (r >= 4 && c === 3) {
            const age = ordered[r - 4].listingAgeDays;
            cell.t = age == null ? 's' : 'n'; cell.v = age == null ? '—' : age;
            cell.f = `IF(ISNUMBER(C${r + 1}),IF(C${r + 1}>TODAY(),"",TODAY()-C${r + 1}),"—")`;
            cell.z = '0" 天"';
          } else if (r >= 4 && keys[c] && cell.v !== '—') {
            const value = ordered[r - 4][keys[c]];
            if (typeof value === 'number' && Number.isFinite(value)) {
              cell.t = 'n'; cell.v = value;
              cell.z = /CTR|rate|率|变化|ACOS/i.test(headers[c]) ? '0.00%' : /售价|Sales|fees|CPC|出价/i.test(headers[c]) ? '$#,##0.00' : /ROAS/i.test(headers[c]) ? '0.00' : '#,##0';
            }
          }
          cell.s = {
            font: { name: '微软雅黑', sz: r === 0 ? 16 : 11, bold: r === 0 || r === 2 || r === 3, color: { rgb: r === 0 ? 'FFFFFF' : r === 1 ? '52657A' : r >= 4 && c === 0 ? '1769AA' : '20354D' } },
            fill: { patternType: 'solid', fgColor: { rgb: r === 0 ? '1769AA' : r === 1 ? 'F3F6FA' : r < 4 ? columnColors[c] : r % 2 === 0 ? 'FFFFFF' : 'F8FAFC' } },
            alignment: { vertical: 'center', horizontal: r < 2 || (r >= 4 && c < 2) ? 'left' : r < 4 ? 'center' : 'right', wrapText: true },
            border: { bottom: { style: 'thin', color: { rgb: 'DFE6EE' } }, right: { style: 'thin', color: { rgb: 'DFE6EE' } } }
          };
        }
      }
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, sheet, 'Item链接表现');
      XLSX.writeFile(workbook, 'eBay-Item链接表现-' + new Date().toLocaleDateString('sv-SE') + '.xlsx');
    }

    function exportDailyData() {
      const rows = dailyItemRecords().map(row => ({
        日期: row.date, 'item ID': row.itemId, 链接: row.link, 标题: row.title, 数据状态: row.hasDailyTraffic ? '完整' : '缺Traffic',
        '链接汇总-总曝光': row.hasDailyTraffic ? row.trafficTotalImpressions : '', '链接汇总-总PV': row.hasDailyTraffic ? row.trafficPageViews : '', '链接汇总-站内PV': row.hasDailyTraffic ? row.trafficEbayViews : '', '链接汇总-站外PV': row.hasDailyTraffic ? row.trafficExternalViews : '',
        '链接汇总-Quantity sold': row.hasDailyTraffic ? row.trafficSold : '', '链接汇总-CTR': row.hasDailyTraffic ? row.trafficCtr : '', '链接汇总-转化率': row.hasDailyTraffic ? row.trafficConversion : '',
        '自然-曝光': row.hasDailyTraffic ? row.trafficNaturalImpressions : '', '自然-eBay Page views': row.hasDailyTraffic ? row.trafficNaturalViews : '', '自然-SOLD': row.organicSold,
        '自然-CTR': row.hasDailyTraffic ? row.trafficNaturalCtr : '', '自然-转化率': row.hasDailyTraffic ? row.organicSold / row.trafficNaturalViews || 0 : '',
        'PLG-曝光': row.adImpressions, 'PLG-点击': row.adClicks, 'PLG-CTR': row.ctr, 'PLG-广告销量': row.adSold, 'PLG-销售额': row.adSales, 'PLG-广告费': row.adFees, 'PLG-ROAS': row.roas,
        'PLP-曝光': row.plpImpressions ?? '', 'PLP-点击': row.plpClicks ?? '', 'PLP-CTR': row.plpImpressions == null ? '' : row.plpCtr, 'PLP-销量': row.plpSold ?? '', 'PLP-销售额': row.plpSales ?? '', 'PLP-广告费': row.plpFees ?? '', 'PLP-ROAS': row.plpImpressions == null ? '' : row.plpRoas
      }));
      if (!rows.length) return toast('当前筛选范围没有可导出的每日记录。', true);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, XLSX.utils.json_to_sheet(rows), 'Item每日记录');
      XLSX.writeFile(workbook, `eBay-Item每日记录-${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    async function clearData() {
      if (!confirm('确定清空当前浏览器中保存的所有报表数据吗？')) return;
      fullState = structuredClone(DEFAULT_STATE);
      skuByItemId = new Map();
      applyProduct();
      await saveState();
      ui = { page: 'import', product: PRODUCT_ALL, adTab: 'overview', campaigns: [], adFilters: {}, query: '', start: '', end: '', trafficPeriod: '', trafficSource: 'auto', listingStatus: 'active', detail: 'item', sort: { table: '', key: '', dir: 0 } };
      render();
      toast('数据已清空。');
    }

    function toast(message, error = false) {
      document.querySelector('.toast')?.remove();
      const node = document.createElement('div');
      node.className = `toast ${error ? 'error' : ''}`;
      node.textContent = message;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 5000);
    }
    function loading(show, message = '') {
      document.querySelector('.loading')?.remove();
      if (!show) return;
      const node = document.createElement('div');
      node.className = 'loading';
      node.innerHTML = `<div class="loading-box"><span class="spinner"></span>${esc(message)}</div>`;
      document.body.appendChild(node);
    }

    function render() {
      charts.forEach(chart => chart.dispose());
      charts = [];
      if ((ui.page === 'dashboard' || ui.page === 'detail') && !ui.trafficPeriod) {
        const period = trafficPeriods()[0];
        if (period) {
          ui.trafficPeriod = period.key;
          ui.start = ui.start || period.start;
          ui.end = ui.end || period.end;
        }
      }
      const pageContent = ui.page === 'dashboard' ? dashboardPage() : ui.page === 'ads' ? advertisingPage() : ui.page === 'daily' ? dailyPage() : ui.page === 'import' ? importPage() : detailPage();
      document.getElementById('app').innerHTML = baseLayout(productNotice() + pageContent);
      bindEvents();
    }

    document.getElementById('fileInput').addEventListener('change', event => importFiles([...event.target.files]));
    window.addEventListener('resize', () => charts.forEach(chart => chart.resize()));
    let listingAgeDay = shanghaiToday();
    setInterval(() => {
      if (listingAgeDay !== shanghaiToday()) { listingAgeDay = shanghaiToday(); render(); }
    }, 60000);
    (async function start() {
      try {
        if (BUILDER_MODE) {
          fullState = structuredClone(DEFAULT_STATE);
        } else {
          fullState = await loadState();
          const seeded = window.EBAY_PRELOADED_DATA;
          if (seeded && seeded.bundleId !== localStorage.getItem('ebay-preloaded-bundle')) {
            fullState = {
              plgRaw: seeded.plgRaw || [],
              trafficRaw: seeded.trafficRaw || [],
              activeListings: seeded.activeListings || null,
              sources: seeded.sources || [],
              ads: seeded.ads || structuredClone(EMPTY_ADS),
              products: seeded.products || structuredClone(PRODUCTS),
              productCounts: seeded.productCounts || null
            };
            await saveState();
            localStorage.setItem('ebay-preloaded-bundle', seeded.bundleId);
          }
        }
        applyProduct();
      } catch (error) {
        toast('无法读取本地数据，将以空白工作台启动。', true);
        applyProduct();
      }
      render();
    })();
  </script>
</body>
</html>
