    }

    async function importFiles(files) {
      const csvFiles = files.filter(file => file.name.toLowerCase().endsWith('.csv'));
      if (!csvFiles.length) return toast('请选择 CSV 文件。', true);
      loading(true, `正在处理 ${csvFiles.length} 个文件…`);
      const messages = [];
      for (const file of csvFiles) {
        try {
          const result = await readFile(file);
          mergeImport(result);
          messages.push(`${result.type}：${result.rows.length} 行`);
        } catch (error) {
          messages.push(`${file.name}：${error.message}`);
        }
      }
      await saveState();
      loading(false);
      ui.page = 'dashboard';
      render();
      toast(`导入完成。${messages.join('；')}`);
      document.getElementById('fileInput').value = '';
    }

    function exportData() {
      const rows = itemDetailRows();
      if (!rows.length) return toast('没有可导出的 Item 数据。', true);
      const trafficRows = trafficPeriodRows();
      const [plgStart, plgEnd] = plgDateRange();
      const [plpStart, plpEnd] = plpDateRange();
      const samePeriod = Boolean(trafficSelection().complete && trafficRows.length && trafficRows[0].start === plgStart && trafficRows[0].end === plgEnd);
      const ordered = sortRows(rows.map(row => ({ ...row, naturalConversion: samePeriod && row.hasTraffic && row.hasPlg ? row.naturalSold / row.naturalViews || 0 : null })), 'detail');
      const container = document.createElement('div');
      container.innerHTML = itemFullTable(filterByPromo(rows), trafficRows, plgStart, plgEnd);
      container.querySelectorAll('.sort-indicator').forEach(node => node.remove());
      const table = container.querySelector('table');
      const trafficRange = trafficRows.length ? rangeText(trafficRows[0].start, trafficRows[0].end) : '未上传';
      const sheet = XLSX.utils.aoa_to_sheet([
        ['eBay AD600 Elite · Item 完整明细'],
        ['Traffic：' + trafficRange + '；PLG：' + rangeText(plgStart, plgEnd) + '；PLP：' + rangeText(plpStart, plpEnd) + '；共 ' + rows.length + ' 个 Item；在售名单：' + (dataState.activeListings ? dataState.activeListings.date + ' / ' + dataState.activeListings.name : '未提供') + '；状态筛选：' + (ui.listingStatus || 'active') + '；— 表示无数据或未提供；' + trafficSelection().note + ' ' + salesReconciliationNote(rows)]
      ]);
      XLSX.utils.sheet_add_dom(sheet, table, { origin: 'A3', raw: true });
      const headers = [...table.tHead.rows[1].cells].map(cell => cell.textContent.trim());
      const keys = [
        'itemId','title','listingStartDate','listingAgeDays','listingStatusText','totalPageViews','totalImpressions','ebayViews','externalViews','quantitySold','totalCtr','totalConversion','pvAudit',
        'price','plgTotalSold',null,null,'adImpressions','adClicks','adCtr','adSold','adSales','adFees','roas',
        'plpImpressions','plpClicks','plpCtr','plpSold','plpFees','plpSales','plpConversion','plpRoas','plpAvgCpc','plpAcos',null,null,null,
        'naturalImpressions','naturalViews','naturalSold','naturalCtr','naturalConversion', ...Array(13).fill(null)
      ];
      const colors = ['E9EEF5','EEF5FB','FFF7E8','F4F0FB','EDF7F1','F2F3F5'];
      const columnColors = [...table.tHead.rows[0].cells].flatMap((cell, index) => Array(cell.colSpan).fill(colors[index]));
      const lastColumn = headers.length - 1;
      sheet['!merges'] = [...(sheet['!merges'] || []), { s: { r: 0, c: 0 }, e: { r: 0, c: lastColumn } }, { s: { r: 1, c: 0 }, e: { r: 1, c: lastColumn } }];
      sheet['!cols'] = headers.map((label, index) => ({ wch: index === 0 ? 19 : index === 1 ? 60 : /rate|views|Conversion/i.test(label) ? 21 : 17 }));
      sheet['!rows'] = [{ hpt: 30 }, { hpt: 32 }, { hpt: 28 }, { hpt: 44 }, ...rows.map(() => ({ hpt: 42 }))];
      sheet['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 3, c: 0 }, e: { r: rows.length + 3, c: lastColumn } }) };
      for (let r = 0; r < rows.length + 4; r += 1) {
        for (let c = 0; c < headers.length; c += 1) {
          const address = XLSX.utils.encode_cell({ r, c });
          const cell = sheet[address] || (sheet[address] = { t: 's', v: '' });
          if (r >= 4 && c === 0) {
            cell.t = 's'; cell.v = ordered[r - 4].itemId;
            cell.l = { Target: ordered[r - 4].link, Tooltip: '打开 eBay 链接' };
          } else if (r >= 4 && c === 2 && ordered[r - 4].listingStartDate) {
            cell.t = 'n'; cell.v = Date.parse(ordered[r - 4].listingStartDate) / 86400000 + 25569;
            cell.z = 'yyyy-mm-dd';
          } else if (r >= 4 && c === 3) {
            const age = ordered[r - 4].listingAgeDays;
            cell.t = age == null ? 's' : 'n'; cell.v = age == null ? '—' : age;
            cell.f = `IF(ISNUMBER(C${r + 1}),IF(C${r + 1}>TODAY(),"",TODAY()-C${r + 1}),"—")`;
            cell.z = '0" 天"';
          } else if (r >= 4 && keys[c] && cell.v !== '—') {
            const value = ordered[r - 4][keys[c]];
            if (typeof value === 'number' && Number.isFinite(value)) {
              cell.t = 'n'; cell.v = value;
              cell.z = /CTR|rate|率|变化|ACOS/i.test(headers[c]) ? '0.00%' : /售价|Sales|fees|CPC|出价/i.test(headers[c]) ? '$#,##0.00' : /ROAS/i.test(headers[c]) ? '0.00' : '#,##0';
            }
          }
          cell.s = {
            font: { name: '微软雅黑', sz: r === 0 ? 16 : 11, bold: r === 0 || r === 2 || r === 3, color: { rgb: r === 0 ? 'FFFFFF' : r === 1 ? '52657A' : r >= 4 && c === 0 ? '1769AA' : '20354D' } },
            fill: { patternType: 'solid', fgColor: { rgb: r === 0 ? '1769AA' : r === 1 ? 'F3F6FA' : r < 4 ? columnColors[c] : r % 2 === 0 ? 'FFFFFF' : 'F8FAFC' } },
            alignment: { vertical: 'center', horizontal: r < 2 || (r >= 4 && c < 2) ? 'left' : r < 4 ? 'center' : 'right', wrapText: true },
            border: { bottom: { style: 'thin', color: { rgb: 'DFE6EE' } }, right: { style: 'thin', color: { rgb: 'DFE6EE' } } }
          };
        }
      }
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, sheet, 'Item链接表现');
      XLSX.writeFile(workbook, 'eBay-Item链接表现-' + new Date().toLocaleDateString('sv-SE') + '.xlsx');
    }

    async function clearData() {
      if (!confirm('确定清空当前浏览器中保存的所有报表数据吗？')) return;
      fullState = structuredClone(DEFAULT_STATE);
      skuByItemId = new Map();
      applyProduct();
      await saveState();
      ui = { coverageSpan: 30, coverageOpen: [], dailyPageNo: 1, dailyPageSize: 200, page: 'import', product: 'AD600 Elite', adTab: 'overview', campaigns: [], campaignExpand: false, adFilters: {}, query: '', start: '', end: '', trafficPeriod: '', trafficSource: 'daily', listingStatus: 'active', itemStatus: 'all', promoFilter: 'all', detail: 'item', sort: { table: '', key: '', dir: 0 } };
      render();
      toast('数据已清空。');
    }

    function toast(message, error = false) {
      document.querySelector('.toast')?.remove();
      const node = document.createElement('div');
      node.className = `toast ${error ? 'error' : ''}`;
      node.textContent = message;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 5000);
    }
    function loading(show, message = '') {
      document.querySelector('.loading')?.remove();
      if (!show) return;
      const node = document.createElement('div');
      node.className = 'loading';
      node.innerHTML = `<div class="loading-box"><span class="spinner"></span>${esc(message)}</div>`;
      document.body.appendChild(node);
    }

    // 通用表格导出（2026-11-26）：**每个有表的 panel 都自动获得一个「导出本表」按钮** ——
    // 所见即所得：导出的是当前页面上渲染出来的内容（已排序、已筛选、含分组表头），
    // 不再逐个表写一遍导出逻辑，以后新加的表也自动带上。
    function exportVisibleTable(table, title) {
      const workbook = XLSX.utils.book_new();
      const sheet = XLSX.utils.aoa_to_sheet([[title], [`导出时间 ${new Date().toLocaleString('sv-SE')} ｜ 仅含当前页面筛选/排序后的内容`]]);
      XLSX.utils.sheet_add_dom(sheet, table, { origin: 'A4', raw: true });
      XLSX.utils.book_append_sheet(workbook, sheet, '数据');
      const shop = document.querySelector('.shop-select option:checked')?.textContent || '';
      XLSX.writeFile(workbook, `eBay-${title}-${shop ? shop + '-' : ''}${new Date().toLocaleDateString('sv-SE')}.xlsx`);
      toast(`已导出「${title}」`);
    }
    function attachTableExports() {
      document.querySelectorAll('.panel').forEach(panel => {
        const table = panel.querySelector('.table-wrap table');
        const head = panel.querySelector('.panel-head');
        if (!table || !head || head.querySelector('[data-export-table]') || head.querySelector('[id$="ExportBtn"]')) return;
        const title = clean(head.querySelector('h3')?.textContent || '数据表');
        const actions = document.createElement('span');
        actions.className = 'actions';
        const button = document.createElement('button');
        button.className = 'btn';
        button.type = 'button';
        button.dataset.exportTable = '1';
        button.innerHTML = `${icon('download')}导出本表`;
        button.addEventListener('click', () => exportVisibleTable(table, title));
        actions.appendChild(button);
        head.appendChild(actions);
      });
    }
    function render() {
      charts.forEach(chart => chart.dispose());
      charts = [];
      if ((ui.page === 'dashboard' || ui.page === 'detail') && !ui.trafficPeriod) {
        // 默认范围 = 当前产品日报的最早 ~ 最新（口径：日报逐日相加），
        // 不再默认选中某份区间累计报表；需要看累计口径时再从下拉里手动切。
        const range = dailyDateRange();
        ui.trafficPeriod = 'daily-range';
        ui.start = ui.start || range.start;
        ui.end = ui.end || range.end;
      }
      // 兜底（2026-11-26）：起止空着、当前产品能算出日报范围 → 就补上。**不限页面** ——
      // 之前只在经营看板/明细页推导，而产品切换会清空日期区间（两个产品范围不同），
      // 于是切到广告页等页面时日期一直空着。只在「模式未选 或 仍是日报逐日相加」时动手；
      // 用户手选的 CUSTOM / 某份累计快照一律不碰。
      const rangeMode = !ui.trafficPeriod || ui.trafficPeriod === 'daily-range';
      if (rangeMode && (!ui.start || !ui.end)) {
        const range = dailyDateRange();
        if (!ui.trafficPeriod) ui.trafficPeriod = 'daily-range';
        ui.start = ui.start || range.start;
        ui.end = ui.end || range.end;
      }
      const pageContent = ui.page === 'dashboard' ? dashboardPage() : ui.page === 'ads' ? advertisingPage() : ui.page === 'daily' ? dailyPage() : ui.page === 'import' ? importPage() : ui.page === 'sources' ? sourcesPage() : detailPage();
      document.getElementById('app').innerHTML = baseLayout(productNotice() + pageContent);
      bindEvents();
      attachTableExports();
    }

    document.getElementById('fileInput').addEventListener('change', event => importFiles([...event.target.files]));
    window.addEventListener('resize', () => charts.forEach(chart => chart.resize()));
    let listingAgeDay = shanghaiToday();
    setInterval(() => {
      if (listingAgeDay !== shanghaiToday()) { listingAgeDay = shanghaiToday(); render(); }
    }, 60000);
    // ---- 多店铺（线上）：线上看板按 ?shop= 或上次选择加载对应店铺的数据；没有 window.EBAY_SHOPS 时行为不变 ----
    function onlineShops() {
      const s = window.EBAY_SHOPS;
      return s && Array.isArray(s.shops) && s.shops.length ? s : null;
    }
    function pickedShopId() {
      const s = onlineShops();
      if (!s) return '';
      return new URLSearchParams(location.search).get('shop') || localStorage.getItem('ebay-online-shop') || s.default || s.shops[0].id;
    }
    function pickShopBundle() {
      const s = onlineShops();
      if (!s) return window.EBAY_PRELOADED_DATA || null;
      const id = pickedShopId();
      return (s.shops.find(x => x.id === id) || s.shops[0]).bundle;
    }
    function shopSwitch() {
      const s = onlineShops();
      if (!s) return '';
      const id = pickedShopId();
      return shopSelectHtml(s.shops, id);
    }

    (async function start() {
      try {
        if (BUILDER_MODE) {
          fullState = structuredClone(DEFAULT_STATE);
        } else {
          fullState = await loadState();
          const seeded = pickShopBundle();
          if (seeded) {
            // 换品历史自愈：itemHistory 由构建端从全量原始报表算出（前身标题的行不在预置行里，
            // 前端无法从行重建）。本地状态缺 itemHistory 或版本较旧时，用预置 bundle 的历史补全/覆盖。
            if (seeded.itemHistory && Object.keys(seeded.itemHistory).length) {
              fullState.itemHistory = { ...(fullState.itemHistory || {}), ...seeded.itemHistory };
            }
            // 覆盖台账自愈（2026-11-25）：本地存的是老版本状态（这种状态在种数据时被白名单丢掉了
            // coverage），而预置 bundle 里有 —— 直接补上，用户不用清缓存/清数据就能看到。
            if (seeded.coverage && !fullState.coverage) fullState.coverage = seeded.coverage;
            // 版本自愈（2026-11-26）：本地 IndexedDB 里的状态可能是**旧版本构建**存下的 ——
            // 它缺新加的字段（PLP 刊登状态/库存、Traffic 曝光构成等），表现为整列「—」，
            // 而页面上看就是「看板没更新」。bundleId 就是构建版本号：不一致时整体采用新预置数据
            // （预置数据是只读的构建产物；本机手动导入的 CSV 会因此被覆盖，需要时重新导入即可）。
            // 定稿（2026-11-26）：**预置 bundle 是只读的构建产物，永远以它为准**。
            // 为什么不能只比 bundleId：bundleId 只由「数据」算出来（dual-product-v1-<数据哈希>-<快照号>），
            // 加字段/改代码时它不变 —— 于是浏览器 IndexedDB 里的老快照一直赢，
            // 新列（PLP 刊登状态/库存、Traffic 曝光构成）整列「—」，看着像「看板没更新」。
            // 线上页是只读镜像、本机页的数据也来自本机服务，所以整体采用预置数据不会牺牲用户数据。
            fullState = { ...seeded };
            if (seeded.activeListings) fullState.activeListings = { ...seeded.activeListings, items: seeded.activeListings.items };
          }
          if (seeded && seeded.bundleId !== localStorage.getItem('ebay-preloaded-bundle')) {
            // 用「展开 + 覆盖」而不是白名单：2026-11-25 被这个坑过两次 ——
            // 白名单式重建会把新加的店铺级字段（coverage 覆盖台账）悄悄丢掉，
            // 页面就永远读不到，还查不出原因。展开之后新字段默认透传。
            fullState = {
              ...seeded,
              plgRaw: seeded.plgRaw || [],
              trafficRaw: seeded.trafficRaw || [],
              activeListings: seeded.activeListings || null,
              sources: seeded.sources || [],
              ads: seeded.ads || structuredClone(EMPTY_ADS),
              products: seeded.products || structuredClone(PRODUCTS),
              productCounts: seeded.productCounts || null
            };
            await saveState();
            localStorage.setItem('ebay-preloaded-bundle', seeded.bundleId);
          }
        }
        applyProduct();
      } catch (error) {
        toast('无法读取本地数据，将以空白工作台启动。', true);
        applyProduct();
      }
      render();
      loadRawData();
      if (window.EBAY_RAW_PENDING) showRawPendingBanner();   // 首屏（明细）已经渲染出来了 → 后台去拉重数据，到了再重绘一次
    })();

    // data.js 里只放了「明细页要用的轻数据」；trafficRaw / plgRaw / ads 这些重数据在 data-raw.js 里，
    // 首屏之后再拉（2026-11-26 提速：17MB → 0.5MB 起步，用户不用盯着 25 秒白屏）。
    // 数据内容与合并口径不变：拉到以后按「以预置数据为准」的同一套规则贴回 fullState 并重绘。
<!-- rawPendingBanner -->fn
    // 重数据（Traffic/PLG/广告行）还在后台下：顶部挂一条明确提示，别让用户把「—」当成「没数据」
    function showRawPendingBanner(text, warning) {
      let node = document.getElementById('rawPendingBanner');
      if (!node) {
        node = document.createElement('div');
        node.id = 'rawPendingBanner';
        node.style.cssText = 'margin:10px 0;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5';
        const main = document.querySelector('main') || document.body;
        main.insertBefore(node, main.firstChild);
      }
      node.style.background = warning ? 'var(--red-soft)' : 'var(--amber-soft)';
      node.style.color = warning ? 'var(--red)' : 'var(--amber)';
      node.innerHTML = text;
      return node;
    }
    function clearRawPendingBanner() { document.getElementById('rawPendingBanner')?.remove(); }

    function loadRawData() {
      if (!window.EBAY_RAW_PENDING || window.__rawLoading) return;
      window.__rawLoading = true;
      const boot = document.querySelector('script[src*="data.js"]');
      const fp = boot ? (String(boot.getAttribute('src')).match(/[?&]f=([^&]+)/) || [])[1] : '';
      const tag = document.createElement('script');
      tag.src = './data-raw.js' + (fp ? '?f=' + fp : '');
      tag.onload = function () {
        try {
          const raw = window.EBAY_SHOPS_RAW || { shops: [] };
          for (const r of raw.shops || []) {
            const shop = (window.EBAY_SHOPS && window.EBAY_SHOPS.shops || []).find(x => x.id === r.id);
            if (!shop) continue;
            for (const key of ['trafficRaw', 'plgRaw', 'adImports', 'itemHistory']) if (r[key] !== undefined) shop.bundle[key] = r[key];
          }
          window.EBAY_RAW_PENDING = false;
          window.__rawLoading = false;
          const seeded = pickShopBundle();
          if (seeded) {
            fullState = {
              ...fullState,
              ...seeded,
              plgRaw: seeded.plgRaw || fullState.plgRaw || [],
              trafficRaw: seeded.trafficRaw || fullState.trafficRaw || [],
              ads: seeded.ads || fullState.ads || structuredClone(EMPTY_ADS),
              activeListings: seeded.activeListings || fullState.activeListings || null,
              sources: seeded.sources || fullState.sources || [],
              products: seeded.products || fullState.products,
              productCounts: seeded.productCounts || fullState.productCounts
            };
          }
          // 拆分回归修复（2026-11-26）：首屏（轻数据）时 dailyDateRange() 还是空的，render() 却已经把
          // trafficPeriod 标成 'daily-range' → 重数据到了也不会再算默认日期，表现为「日期选择空了」。
          // 只在「起止都还空着」时清掉标记让 render() 重算；用户自己选过日期/区间的一律不动。
          if (!ui.start && !ui.end) ui.trafficPeriod = '';
          applyProduct();
          render();
          clearRawPendingBanner();
          toast('图表数据已就绪。');
        } catch (error) {
          window.__rawLoading = false;
          toast('完整数据合并失败：' + error.message + '（明细页不受影响，刷新可重试）', true);
        }
      };
      tag.onerror = function () {
        window.__rawLoading = false;
        showRawPendingBanner('完整数据（Traffic / PLG / 广告行）没拉到：图表类数字暂时为空。明细页不受影响；刷新页面可重试。', true);
      };
      document.head.appendChild(tag);
      toast('明细已就绪，正在后台加载图表数据…');
    }
  </script>
</body>
</html>
