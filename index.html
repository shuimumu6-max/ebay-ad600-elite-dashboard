<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay AD600 Elite 流量与广告看板</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <script src="./data.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #18212f;
      --muted: #697586;
      --line: #dce2e8;
      --blue: #1769aa;
      --blue-soft: #eaf3fb;
      --green: #237a57;
      --green-soft: #e9f5ef;
      --amber: #9a6700;
      --amber-soft: #fff5d8;
      --red: #b42318;
      --red-soft: #fef0ed;
      --shadow: 0 4px 16px rgba(19, 33, 53, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; min-height: 100%; overflow-x: hidden; background: var(--bg); color: var(--ink); font-family: "Microsoft YaHei", system-ui, sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .app { min-height: 100vh; }
    .topbar { height: 62px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; color: white; background: var(--blue); border-radius: 7px; flex: 0 0 auto; }
    .brand-mark svg { width: 19px; }
    .brand h1 { margin: 0; font-size: 17px; line-height: 1.2; letter-spacing: 0; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .product-switch { display: flex; align-items: center; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); flex: 0 0 auto; }
    .product-btn { min-height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 650; white-space: nowrap; cursor: pointer; }
    .product-btn:hover { color: var(--blue); }
    .product-btn.active { color: var(--blue); background: var(--panel); box-shadow: var(--shadow); }
    .product-notice { margin-bottom: 14px; padding: 11px 14px; border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 6px; background: var(--amber-soft); color: #6b4a00; font-size: 12px; line-height: 1.7; }
    .workspace { display: grid; grid-template-columns: 214px minmax(0, 1fr); min-height: calc(100vh - 62px); }
    .sidebar { padding: 18px 12px; background: #f8f9fb; border-right: 1px solid var(--line); }
    .nav { display: grid; gap: 5px; position: sticky; top: 80px; }
    .nav-btn { width: 100%; min-height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 6px; background: transparent; color: #435064; text-align: left; }
    .nav-btn:hover { background: #edf1f5; }
    .nav-btn.active { color: var(--blue); background: var(--blue-soft); font-weight: 700; }
    .nav-btn svg { width: 17px; height: 17px; }
    .content { width: 100%; max-width: 1540px; margin: 0 auto; padding: 24px 28px 44px; min-width: 0; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    .page-head h2 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .page-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn { min-height: 36px; padding: 0 13px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: #314056; font-weight: 650; font-size: 13px; }
    .btn:hover { border-color: #aeb9c6; background: #f9fafb; }
    .btn.primary { color: white; border-color: var(--blue); background: var(--blue); }
    .btn.primary:hover { background: #10598f; }
    .btn.danger { color: var(--red); }
    .btn svg { width: 16px; height: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; box-shadow: var(--shadow); }
    .panel-head { min-height: 52px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { margin: 0; font-size: 15px; }
    .panel-head small { color: var(--muted); }
    .panel-body { padding: 16px; }
    .upload-zone { min-height: 228px; padding: 34px 22px; display: flex; align-items: center; justify-content: center; text-align: center; border: 1px dashed #aeb9c6; border-radius: 7px; background: #fafbfd; }
    .upload-zone.drag { border-color: var(--blue); background: var(--blue-soft); }
    .upload-icon { width: 46px; height: 46px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 7px; color: var(--blue); background: var(--blue-soft); }
    .upload-icon svg { width: 24px; }
    .upload-zone h3 { margin: 0; font-size: 17px; }
    .upload-zone p { max-width: 620px; margin: 8px auto 18px; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .upload-note { margin-top: 9px; color: var(--muted); font-size: 12px; }
    .source-grid { margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .source-item { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
    .source-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .source-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .source-meta { margin-top: 9px; display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
    .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .badge.blue { color: var(--blue); background: var(--blue-soft); }
    .badge.green { color: var(--green); background: var(--green-soft); }
    .badge.amber { color: var(--amber); background: var(--amber-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .empty { padding: 58px 20px; color: var(--muted); text-align: center; }
    .empty svg { width: 30px; height: 30px; margin-bottom: 8px; color: #9aa6b3; }
    .filters { padding: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .filters .field:first-child { grid-column: span 2; }
    .field { min-width: 0; }
    .field-help { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .traffic-source-help { grid-column: 1 / -1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: #f8fafc; font-size: 12px; line-height: 1.7; }
    .traffic-source-help summary { cursor: pointer; color: var(--blue); font-weight: 600; }
    .traffic-source-help p { margin: 8px 0 0; }
    .traffic-source-help ul { margin: 6px 0 0; padding-left: 20px; }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 5px; background: white; color: var(--ink); }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; margin-bottom: 14px; }
    .metric { min-height: 104px; padding: 15px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; box-shadow: var(--shadow); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 9px; font-size: 25px; line-height: 1; font-weight: 760; font-variant-numeric: tabular-nums; }
    .metric-foot { margin-top: 10px; color: var(--muted); font-size: 11px; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
    .chart { width: 100%; height: 330px; }
    .ad-tabs { display: flex; gap: 6px; margin: 0 0 14px; padding: 4px; overflow-x: auto; border: 1px solid var(--line); border-radius: 7px; background: #eef2f6; }
    .ad-tab { min-height: 34px; padding: 0 13px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); white-space: nowrap; font-weight: 700; }
    .ad-tab.active { color: var(--blue); background: white; box-shadow: 0 1px 4px rgba(19,33,53,.12); }
    .campaign-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
    .campaign-chip { min-height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: white; color: #435064; font-size: 12px; }
    .campaign-chip.active { color: white; border-color: var(--blue); background: var(--blue); }
    .campaign-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .campaign-card { padding: 15px; }
    .campaign-card-head { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:12px; }
    .campaign-card-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .campaign-card-grid div { padding:9px; border-radius:5px; background:#f6f8fa; }
    .campaign-card-grid span { display:block; color:var(--muted); font-size:10px; }
    .campaign-card-grid strong { display:block; margin-top:5px; font-size:14px; }
    .table-wrap { width: 100%; max-height: calc(100vh - 150px); overflow: auto; overscroll-behavior: contain; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { position: sticky; top: 0; z-index: 1; padding: 10px 11px; background: #f5f7f9; color: #516074; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    th[data-sort-key] { cursor: pointer; user-select: none; }
    th[data-sort-key]:hover { color: var(--blue); background: #edf3f8; }
    .sort-indicator { display: inline-block; width: 14px; margin-left: 3px; color: var(--blue); font-weight: 800; }
    th:first-child, th:nth-child(2), td:first-child, td:nth-child(2) { text-align: left; }
    td { padding: 10px 11px; border-bottom: 1px solid #edf0f3; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafbfd; }
    th.plp-col, td.plp-col { background: #f7f2fb; }
    th.plp-col { color: #72558a; }
    tbody tr:hover td.plp-col { background: #f1e9f8; }
    .ad-summary-table { min-width: 980px; }
    .ad-summary-table th, .ad-summary-table td { padding: 9px 7px; font-size: 11px; }
    .ad-summary-table .item-title { width: 190px; max-width: 190px; }
    th.plg-col, td.plg-col { background: #fff8e9; }
    th.plg-col { color: #9a6413; }
    tbody tr:hover td.plg-col { background: #fff1d2; }
    .item-title { max-width: 330px; overflow: hidden; text-overflow: ellipsis; }
    .snapshot { margin-top: 14px; }
    .snapshot-note { margin: 0 0 12px; padding: 10px 12px; color: var(--amber); background: var(--amber-soft); border-left: 3px solid #e3a008; font-size: 12px; line-height: 1.6; }
    .snapshot-metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .snapshot-metric { padding: 12px; border: 1px solid var(--line); border-radius: 6px; }
    .snapshot-metric span { display: block; color: var(--muted); font-size: 11px; }
    .snapshot-metric strong { display: block; margin-top: 7px; font-size: 18px; }
    .tabs { display: inline-flex; padding: 3px; gap: 3px; border: 1px solid var(--line); border-radius: 6px; background: #f5f7f9; }
    .tab-btn { min-height: 30px; padding: 0 11px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; }
    .tab-btn.active { color: var(--ink); background: white; box-shadow: 0 1px 4px rgba(19, 33, 53, .1); }
    .coverage { display: grid; gap: 12px; }
    .coverage-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .coverage-count { padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
    .coverage-count strong { display: block; font-size: 24px; }
    .coverage-count span { color: var(--muted); font-size: 12px; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; max-width: min(420px, calc(100vw - 40px)); padding: 12px 14px; border-radius: 7px; color: white; background: #263548; box-shadow: 0 12px 30px rgba(0,0,0,.2); font-size: 13px; line-height: 1.55; }
    .toast.error { background: #8f241c; }
    .loading { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(244,246,248,.82); backdrop-filter: blur(2px); }
    .loading-box { padding: 18px 22px; display: flex; align-items: center; gap: 11px; background: white; border: 1px solid var(--line); border-radius: 7px; box-shadow: var(--shadow); font-size: 13px; font-weight: 700; }
    .spinner { width: 18px; height: 18px; border: 2px solid #cbd6e0; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1050px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar { padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow: auto; }
      .nav { display: flex; width: max-content; position: static; }
      .nav-btn { width: auto; padding: 0 13px; white-space: nowrap; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dashboard-grid { grid-template-columns: 1fr; }
      .campaign-cards { grid-template-columns: 1fr; }
      .source-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .topbar { height: auto; min-height: 58px; padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
      .brand p, .status span:last-child { display: none; }
      .product-switch { order: 3; width: 100%; overflow-x: auto; }
      .product-btn { flex: 1 0 auto; }
      .content { padding: 18px 14px 34px; }
      .page-head { align-items: flex-start; flex-direction: column; }
      .filters { grid-template-columns: 1fr 1fr; }
      .filters .field:first-child { grid-column: 1 / -1; }
      .source-grid { grid-template-columns: 1fr; }
      .snapshot-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .coverage-summary { grid-template-columns: 1fr; }
    }
    @media (max-width: 460px) {
      .metrics { grid-template-columns: 1fr 1fr; gap: 8px; }
      .metric { min-height: 92px; padding: 12px; }
      .metric-value { font-size: 20px; }
      .filters { grid-template-columns: 1fr; }
      .filters .field:first-child { grid-column: auto; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; }
      .chart { height: 290px; }
      .campaign-card-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <input id="fileInput" type="file" accept=".csv,text/csv" multiple hidden />
  <script>
    const DB_NAME = 'ebay-traffic-dashboard';
    const DB_STORE = 'workspace';
    const DB_KEY = 'latest';
    const BUILDER_MODE = new URLSearchParams(location.search).has('builder');
    const SHARED_READONLY = location.protocol !== 'file:' && !BUILDER_MODE;
    const MONTHS = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };
    const EMPTY_ADS = { dates: [], campaigns: [], campaignDaily: {}, plpRows: [], keywordRows: [], searchRows: [], bidChanges: [] };
    const DEFAULT_STATE = { plgRaw: [], trafficRaw: [], sources: [], ads: EMPTY_ADS, activeListings: null, products: null, productCounts: null };
    // fullState = 全量数据（含两个产品）；dataState = 当前产品视图，页面函数一律读 dataState。
    let fullState = structuredClone(DEFAULT_STATE);
    let dataState = structuredClone(DEFAULT_STATE);
    let ui = { page: 'dashboard', product: 'all', adTab: 'overview', campaigns: [], adFilters: {}, query: '', start: '', end: '', trafficPeriod: '', trafficSource: 'auto', listingStatus: 'active', detail: 'item', sort: { table: '', key: '', dir: 0 } };
    let charts = [];
    // 仅 builder 模式（手工上传 CSV）使用：在售名单里的 itemId→SKU
    let skuByItemId = new Map();

    // === PRODUCTS-BEGIN（与 update-dashboard.mjs 中的同名常量逐字一致；check-products.mjs 会校验） ===
    const PRODUCTS = [
      { key: 'AD600 Elite', label: 'AD600 Elite', sku: 'TD52110512', titleTokens: ['artidiag600elite', 'ad600elite'] },
      { key: 'UltraDiag900 E', label: 'UltraDiag900 E', sku: 'TD52110602', titleTokens: ['ultradiag900e', 'ud900e'] }
    ];
    const PRODUCT_ALL = 'all';
    const PRODUCT_UNKNOWN = 'unknown';
    // === MANUAL-SOLD-EXCLUSIONS-START ===
    // 手工核对换品剔除（2026-11-12 用户按 eBay 订单记录核对）：下列链接历史上被改卖过其它商品，
    // 前身标题在现有报表里看不到（itemHistory 覆盖不到），由维护者人工指定「哪些日期的出单属于前身商品」。
    // exclude：日期 → 出单台数（全部视为非本体出单剔除）；未列出的日期视为本体出单、原样保留。
    // 日度行（Traffic/PLG）载入时按日期扣减；区间快照在 trafficSelection 里按窗口覆盖到的日期扣减。
    const MANUAL_SOLD_EXCLUSIONS = {
      '820216825374': { exclude: { '2026-10-09': 1, '2026-10-10': 3, '2026-10-11': 1 }, reason: '人工核对（2026-11-12）：本体出单仅 10-20×1、10-26×1、11-06×1；10-09/10-10/10-11 的出单为前身商品时期' },
      '820216832219': { exclude: { '2026-10-08': 1, '2026-10-09': 4 }, reason: '人工核对（2026-11-12）：本体未出单；10-08/10-09 的出单为前身商品时期' }
    };
    // === MANUAL-SOLD-EXCLUSIONS-END ===
    // === PRODUCTS-END ===

    const COVERAGE = [
      ['自然曝光', '直接提供', 'Traffic：Total organic impressions on eBay site；PLG：Organic Impressions'],
      ['自然 eBay Page views', '直接提供', 'Traffic：Page views via organic impressions on eBay site'],
      ['自然 SOLD', '直接提供', 'PLG：Organic Sold Quantity'],
      ['自然 CTR', '可计算', '自然站内 Page views ÷ 自然曝光'],
      ['自然转化率', '可计算', '自然 SOLD ÷ 自然 Page views'],
      ['链接总曝光', '直接提供', 'Traffic：Total impressions'],
      ['链接站内 Page views', '可计算', '站内广告 Page views + 站内自然 Page views'],
      ['External Page views', '可计算', '站外广告 Page views + 站外自然 Page views'],
      ['Quantity sold', '直接提供', 'Traffic：Quantity sold；PLG：Total Quantity Sold'],
      ['总 CTR', '直接提供', 'Traffic 提供；汇总时按总量重算'],
      ['总转化率', '直接提供', 'Traffic 提供；汇总时按总量重算'],
      ['PLG 曝光', '直接提供', 'Promoted Listings Impressions'],
      ['PLG 点击', '直接提供', 'Total Promoted Listings Clicks'],
      ['PLG CTR', '可计算', 'PLG 点击 ÷ PLG 曝光'],
      ['PLG 广告销量', '直接提供', 'Total Promoted Listings Sold quantity'],
      ['PLG 销售额', '直接提供', 'Total Promoted Listings Sales'],
      ['广告费', '直接提供', 'Ad fees'],
      ['ROAS', '可计算', 'PLG 销售额 ÷ 广告费'],
      ['PLG 费率 / 建议费率', '缺少', '当前两类报表没有该字段'],
      ['PLP 曝光、点击、销量、销售额、广告费', '直接提供', '广告看板：Priority Campaign Item 日明细'],
      ['PLP CTR、CVR、ROAS、Average CPC、ACOS', '可计算', '按 PLP 汇总后使用总量重算'],
      ['关键词 / 实际出价', '直接提供', '广告看板：关键词日明细'],
      ['搜索词 / 触发关键词', '直接提供', '广告看板：搜索词日明细'],
      ['建议出价', '缺少', '当前广告快照只有实际 Bid 和竞价调整记录']
    ];

    function clean(value) { return String(value ?? '').replace(/^\uFEFF/, '').trim(); }
    function titleKey(value) { return clean(value).toLowerCase().replace(/[^a-z0-9]+/g, ''); }
    // 与构建端同一口径：标题 token > campaign 名 > SKU 兜底 > unknown。
    // 线上数据每行已带 product；SKU 兜底只服务 builder 模式手工导入的 CSV。
    function productOf(row) {
      const title = titleKey(row?.title);
      const byTitle = title && PRODUCTS.find(product => product.titleTokens.some(token => title.includes(token)));
      if (byTitle) return byTitle.key;
      const campaign = titleKey(row?.campaign);
      const byCampaign = campaign && PRODUCTS.find(product => product.titleTokens.some(token => campaign.includes(token)));
      if (byCampaign) return byCampaign.key;
      const sku = String(row?.sku ?? skuByItemId.get(String(row?.itemId ?? '')) ?? '').toLowerCase();
      const bySku = sku && PRODUCTS.find(product => product.sku.toLowerCase() === sku);
      if (bySku) return bySku.key;
      return PRODUCT_UNKNOWN;
    }
    function inProduct(row, key = ui.product) {
      const product = row?.product || productOf(row);
      if (!product || product === PRODUCT_UNKNOWN) return false;
      return key === PRODUCT_ALL || product === key;
    }
    // 兼容旧调用与线上自检：判断标题是否属于「任一」目标产品，不受当前产品切换影响
    function isTargetModelTitle(value) { return inProduct({ title: value }, PRODUCT_ALL); }

    function productOptions() {
      return [[PRODUCT_ALL, '全部'], ...PRODUCTS.map(product => [product.key, product.label])];
    }
    function productSwitch() {
      return productOptions().map(([key, label]) => `<button class="product-btn ${ui.product === key ? 'active' : ''}" data-product="${esc(key)}" aria-pressed="${ui.product === key}">${esc(label)}</button>`).join('');
    }
    // 外部广告快照目前只覆盖 AD600 Elite，其它产品的 PLP/关键词/搜索词为空属正常，不显示为 0
    function productNotice() {
      if (ui.product === PRODUCT_ALL || ui.product === PRODUCTS[0].key) return '';
      const ads = dataState.ads || EMPTY_ADS;
      const count = ['plpRows', 'keywordRows', 'searchRows'].reduce((total, field) => total + (ads[field] || []).length, 0);
      if (count) return '';
      const label = PRODUCTS.find(product => product.key === ui.product)?.label || ui.product;
      return `<div class="product-notice">当前产品「${esc(label)}」暂无 PLP / 关键词 / 搜索词数据（现有广告快照仅覆盖 ${esc(PRODUCTS[0].label)}）；流量与 PLG 数据可正常查看。</div>`;
    }
    function normalizeState(state) {
      state.products = state.products?.length ? state.products : structuredClone(PRODUCTS);
      [state.plgRaw, state.trafficRaw, state.ads?.plpRows, state.activeListings?.items].forEach(rows => {
        (rows || []).forEach(row => { if (!row.product) row.product = productOf(row); });
      });
      applyManualSoldCuts(state);
      return state;
    }
    // 手工核对剔除：日度行载入时直接按日期扣减（soldManualCut 留痕，防止重复扣减）
    function applyManualSoldCuts(state) {
      const cutRow = (row, fields, date) => {
        const manual = MANUAL_SOLD_EXCLUSIONS[String(row.itemId)];
        if (!manual || row.soldManualCut) return;
        const qty = Number(manual.exclude[date]) || 0;
        if (!(qty > 0)) return;
        const applied = {};
        fields.forEach(field => {
          const value = Number(row[field]) || 0;
          const cut = Math.min(qty, Math.max(value, 0));
          if (cut > 0) { row[field] = value - cut; applied[field] = cut; }
        });
        if (Object.keys(applied).length) row.soldManualCut = applied;
      };
      (state.trafficRaw || []).forEach(row => { if (row.start && row.start === row.end) cutRow(row, ['quantitySold'], row.start); });
      (state.plgRaw || []).forEach(row => cutRow(row, ['totalSold', 'organicSold', 'adSold'], row.date));
      return state;
    }
    function applyProduct() {
      fullState = normalizeState(fullState);
      if (ui.product === PRODUCT_ALL) { dataState = structuredClone(fullState); return; }
      const pick = rows => (rows || []).filter(row => row.product === ui.product);
      const ads = fullState.ads || structuredClone(EMPTY_ADS);
      const keepAds = ui.product === PRODUCTS[0].key;
      dataState = {
        plgRaw: pick(fullState.plgRaw),
        trafficRaw: pick(fullState.trafficRaw),
        itemHistory: fullState.itemHistory || {},
        activeListings: fullState.activeListings ? { ...fullState.activeListings, items: pick(fullState.activeListings.items) } : null,
        sources: structuredClone(fullState.sources || []),
        products: structuredClone(fullState.products),
        productCounts: structuredClone(fullState.productCounts || null),
        ads: keepAds ? structuredClone(ads) : { ...structuredClone(EMPTY_ADS), plpRows: pick(ads.plpRows || []) }
      };
    }
    function number(value) {
      const text = clean(value).replace(/,/g, '').replace(/[$%]/g, '').replace(/[()]/g, '');
      const match = text.match(/-?\d+(?:\.\d+)?/);
      return match ? Number(match[0]) : 0;
    }
    function rate(value) { return clean(value).includes('%') ? number(value) / 100 : number(value); }
    function esc(value) { return String(value ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c])); }
    function fmt(value, digits = 0) { return new Intl.NumberFormat('zh-CN', { maximumFractionDigits: digits, minimumFractionDigits: digits }).format(Number(value || 0)); }
    function money(value) { return '$' + fmt(value, 2); }
    function pct(value) { return fmt(Number(value || 0) * 100, 2) + '%'; }
    function isoFromEnglish(value) {
      const text = clean(value);
      const iso = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (iso) return `${iso[1]}-${String(iso[2]).padStart(2, '0')}-${String(iso[3]).padStart(2, '0')}`;
      const english = text.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2}),\s*(\d{4})$/i);
      if (english) {
        const monthKey = english[1][0].toUpperCase() + english[1].slice(1, 3).toLowerCase();
        return `${english[3]}-${String(MONTHS[monthKey]).padStart(2, '0')}-${String(english[2]).padStart(2, '0')}`;
      }
      const numeric = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
      if (numeric) {
        const year = numeric[3].length === 2 ? 2000 + Number(numeric[3]) : Number(numeric[3]);
        return `${year}-${String(numeric[1]).padStart(2, '0')}-${String(numeric[2]).padStart(2, '0')}`;
      }
      return '';
    }
    function headerMap(headers) {
      const map = {};
      headers.forEach((item, index) => { map[clean(item)] = index; });
      return map;
    }
    function val(row, map, key) { return row[map[key]] ?? ''; }
    function sum(rows, key) { return rows.reduce((total, row) => total + Number(row[key] || 0), 0); }
    function unique(values) { return [...new Set(values.filter(Boolean))]; }
    function rangeText(start, end) { return start && end ? (start === end ? start : `${start} 至 ${end}`) : '日期未知'; }
    function icon(name, size = 16) { return `<i data-lucide="${name}" style="width:${size}px;height:${size}px"></i>`; }
    function sortHeader(label, key, table, className = '') {
      const active = ui.sort.table === table && ui.sort.key === key;
      const direction = active && ui.sort.dir === -1 ? 'descending' : active ? 'ascending' : 'none';
      const indicator = active ? (ui.sort.dir === -1 ? '↓' : '↑') : '';
      return `<th class="${className}" data-sort-table="${table}" data-sort-key="${key}" aria-sort="${direction}" title="点击排序：${active && ui.sort.dir === 1 ? '降序' : '升序'}">${label}<span class="sort-indicator" aria-hidden="true">${indicator}</span></th>`;
    }
    function sortRows(rows, table) {
      if (ui.sort.table !== table || !ui.sort.key || !ui.sort.dir) return rows;
      const key = ui.sort.key;
      return [...rows].sort((a, b) => {
        const av = a[key], bv = b[key];
        const aEmpty = av === null || av === undefined || av === '' || Number.isNaN(av);
        const bEmpty = bv === null || bv === undefined || bv === '' || Number.isNaN(bv);
        if (aEmpty || bEmpty) return aEmpty === bEmpty ? 0 : aEmpty ? 1 : -1;
        const result = typeof av === 'number' && typeof bv === 'number'
          ? av - bv
          : String(av).localeCompare(String(bv), 'zh-CN', { numeric: true, sensitivity: 'base' });
        return result * ui.sort.dir;
      });
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(DB_STORE);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    async function loadState() {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(DB_KEY);
        request.onsuccess = () => resolve(request.result || structuredClone(DEFAULT_STATE));
        request.onerror = () => reject(request.error);
      });
    }
    async function saveState() {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(fullState, DB_KEY);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function readFile(file) {
      const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', raw: false });
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: '', raw: false });
      const activeHeader = rows.findIndex(row => row.some(cell => clean(cell) === 'Item number') && row.some(cell => clean(cell) === 'Available quantity'));
      if (activeHeader >= 0) {
        const map = headerMap(rows[activeHeader]);
        const date = file.name.match(/report-(\d{4}-\d{2}-\d{2})-/)?.[1];
        if (!date) throw new Error('在售报表文件名缺少导出日期。');
        const items = new Map();
        rows.slice(activeHeader + 1).forEach(row => {
          const itemId = clean(val(row, map, 'Item number')).replace(/^="?|"$/g, '');
          const title = clean(val(row, map, 'Title'));
          const sku = clean(val(row, map, 'Custom label (SKU)'));
          if (!/^\d+$/.test(itemId)) return;
          if (sku) skuByItemId.set(itemId, sku.toLowerCase());
          const product = productOf({ itemId, title, sku });
          if (product === PRODUCT_UNKNOWN) return;
          items.set(itemId, { itemId, title, available: number(val(row, map, 'Available quantity')), product, sku });
        });
        return { type: 'Active', rows: [...items.values()], source: { id: `${file.name}|${file.size}|${file.lastModified}`, name: file.name, type: 'Active', start: date, end: date, count: items.size, importedAt: new Date(file.lastModified).toISOString(), periodKind: '在售名单快照' } };
      }
      const plgHeader = rows.findIndex(row => row.some(cell => clean(cell) === 'Campaign name') && row.some(cell => clean(cell) === 'Item ID'));
      const trafficHeader = rows.findIndex(row => row.some(cell => clean(cell) === 'Listing title') && row.some(cell => clean(cell) === 'eBay item ID'));
      if (plgHeader >= 0) return parsePlg(rows, plgHeader, file);
      if (trafficHeader >= 0) return parseTraffic(rows, trafficHeader, file);
      throw new Error('无法识别报表类型，请上传 eBay Listings Traffic 或 Promoted Listings General CSV。');
    }

    function parsePlg(rows, headerIndex, file) {
      const map = headerMap(rows[headerIndex]);
      const parsed = [];
      for (const row of rows.slice(headerIndex + 1)) {
        const itemId = clean(val(row, map, 'Item ID'));
        const date = isoFromEnglish(val(row, map, 'Date'));
        const title = clean(val(row, map, 'Title'));
        const campaign = clean(val(row, map, 'Campaign name')) || '未命名广告活动';
        const product = productOf({ itemId, title, campaign });
        if (!itemId || !date || product === PRODUCT_UNKNOWN) continue;
        const campaignId = clean(val(row, map, 'Campaign ID'));
        parsed.push({
          key: `${date}|${itemId}|${campaignId || clean(val(row, map, 'Campaign name'))}`,
          date, itemId, campaignId, product,
          campaign: clean(val(row, map, 'Campaign name')) || '未命名广告活动',
          title,
          status: clean(val(row, map, 'Status  ')) || clean(val(row, map, 'Status')),
          listingStartDate: isoFromEnglish(val(row, map, 'Listing start date')),
          price: number(val(row, map, 'Price (Current or Last Price)')),
          available: number(val(row, map, 'Quantity available')),
          adImpressions: number(val(row, map, 'Promoted Listings Impressions (via eBay Placements)')),
          adClicks: number(val(row, map, 'Total Promoted Listings Clicks')),
          adSold: number(val(row, map, 'Total Promoted Listings Sold quantity')),
          organicSold: number(val(row, map, 'Organic Sold Quantity')),
          totalSold: number(val(row, map, 'Total Quantity Sold')),
          adSales: number(val(row, map, 'Total Promoted Listings Sales (in billing currency)')),
          adFees: number(val(row, map, 'Ad fees (in billing currency)')),
          organicClicks: number(val(row, map, 'Organic Clicks')),
          organicImpressions: number(val(row, map, 'Organic Impressions'))
        });
      }
      if (!parsed.length) throw new Error('PLG 文件中没有可用的数据行。');
      const dates = parsed.map(row => row.date).sort();
      return { type: 'PLG', rows: parsed, source: { id: `${file.name}|${file.size}|${file.lastModified}`, name: file.name, type: 'PLG', count: parsed.length, start: dates[0], end: dates[dates.length - 1], importedAt: new Date().toISOString() } };
    }

    function parseTraffic(rows, headerIndex, file) {
      const map = headerMap(rows[headerIndex]);
      const preface = rows.slice(0, headerIndex).flat().map(clean).join(' ');
      const periodMatch = preface.match(/Report for\s+((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2},\s*\d{4})\s+to\s+((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2},\s*\d{4})/i);
      const start = periodMatch ? isoFromEnglish(periodMatch[1]) : '';
      const end = periodMatch ? isoFromEnglish(periodMatch[2]) : '';
      const parsed = [];
      for (const row of rows.slice(headerIndex + 1)) {
        const itemId = clean(val(row, map, 'eBay item ID'));
        const title = clean(val(row, map, 'Listing title'));
        const product = productOf({ itemId, title });
        if (!itemId || product === PRODUCT_UNKNOWN) continue;
        parsed.push({
          key: `${start}|${end}|${itemId}`,
          start, end, itemId, product,
          title,
          listingStartDate: isoFromEnglish(val(row, map, 'Item Start Date')),
          category: clean(val(row, map, 'Category')),
          promotionStatus: clean(val(row, map, 'Current promoted listings status')),
          available: number(val(row, map, 'Quantity available')),
          totalImpressions: number(val(row, map, 'Total impressions')),
          quantitySold: number(val(row, map, 'Quantity sold')),
          top20Promoted: number(val(row, map, 'Top 20 search spot impressions from promoted listings')),
          top20Change: rate(val(row, map, '% Change in Top 20 search spot impressions')),
          top20Organic: number(val(row, map, 'Top 20 search spot organic impressions')),
          restSearch: number(val(row, map, 'Rest of search spot impressions')),
          totalSearch: number(val(row, map, 'Total Search Impressions')),
          nonSearchPromoted: number(val(row, map, 'Non-search promoted listings impressions')),
          nonSearchOrganic: number(val(row, map, 'Non-search organic impressions')),
          nonSearchChange: rate(val(row, map, '% Change in non-search organic impressions')),
          promotedEbayImpressions: number(val(row, map, 'Total Promoted Listings impressions (applies to eBay site only)')),
          promotedOffsiteImpressions: number(val(row, map, 'Total Promoted Offsite impressions (applies to off-eBay only)')),
          organicEbayImpressions: number(val(row, map, 'Total organic impressions on eBay site')),
          totalPageViews: number(val(row, map, 'Total page views')),
          promotedEbayViews: number(val(row, map, 'Page views via promoted listings impressions on eBay site')),
          promotedExternalViews: number(val(row, map, 'Page views via promoted listings Impressions from outside eBay (search engines, affilliates)')),
          organicEbayViews: number(val(row, map, 'Page views via organic impressions on eBay site')),
          organicExternalViews: number(val(row, map, 'Page views from organic impressions outside eBay (Includes page views from search engines)'))
        });
      }
      if (!parsed.length) throw new Error('Traffic 文件中没有可用的数据行。');
      return { type: 'Traffic', rows: parsed, source: { id: `${file.name}|${file.size}|${file.lastModified}`, name: file.name, type: 'Traffic', count: parsed.length, start, end, importedAt: new Date().toISOString(), periodKind: start && end && start === end ? '单日' : '区间累计' } };
    }

    function mergeImport(result) {
      if (result.type === 'Active') {
        const current = fullState.activeListings;
        const rank = result.source.start + '|' + result.source.importedAt + '|' + result.source.name;
        if (!current || rank > current.date + '|' + current.importedAt + '|' + current.name) fullState.activeListings = { date: result.source.start, importedAt: result.source.importedAt, name: result.source.name, items: result.rows };
      } else if (result.type === 'PLG') {
        const map = new Map(fullState.plgRaw.map(row => [row.key, row]));
        result.rows.forEach(row => map.set(row.key, row));
        fullState.plgRaw = [...map.values()];
      } else {
        const map = new Map(fullState.trafficRaw.map(row => [row.key, row]));
        result.rows.forEach(row => map.set(row.key, row));
        fullState.trafficRaw = [...map.values()];
      }
      const sources = new Map(fullState.sources.map(row => [row.id, row]));
      sources.set(result.source.id, result.source);
      fullState.sources = [...sources.values()].sort((a, b) => b.importedAt.localeCompare(a.importedAt));
      applyProduct();
    }

    function aggregateDaily() {
      const map = new Map();
      for (const row of dataState.plgRaw) {
        const key = `${row.date}|${row.itemId}`;
        if (!map.has(key)) map.set(key, { date: row.date, itemId: row.itemId, title: row.title, price: row.price, available: row.available, campaigns: new Set(), adImpressions: 0, adClicks: 0, adSold: 0, organicSold: 0, totalSold: 0, adSales: 0, adFees: 0, organicClicks: 0, organicImpressions: 0 });
        const item = map.get(key);
        item.title = row.title || item.title;
        item.price = row.price || item.price;
        item.available = row.available;
        item.campaigns.add(row.campaign);
        ['adImpressions','adClicks','adSold','organicSold','totalSold','adSales','adFees','organicClicks','organicImpressions'].forEach(field => item[field] += row[field] || 0);
      }
      for (const row of dataState.trafficRaw.filter(item => item.start && item.start === item.end)) {
        const key = `${row.start}|${row.itemId}`;
        if (!map.has(key)) map.set(key, { date: row.start, itemId: row.itemId, title: row.title, price: 0, available: row.available, campaigns: new Set(), adImpressions: 0, adClicks: 0, adSold: 0, organicSold: 0, totalSold: 0, adSales: 0, adFees: 0, organicClicks: 0, organicImpressions: 0 });
        const item = map.get(key);
        item.title = item.title || row.title;
        item.hasDailyTraffic = true;
        item.trafficTotalImpressions = row.totalImpressions;
        item.trafficPageViews = row.totalPageViews;
        item.trafficSold = row.quantitySold;
        item.trafficEbayViews = row.promotedEbayViews + row.organicEbayViews;
        item.trafficExternalViews = row.promotedExternalViews + row.organicExternalViews;
        item.trafficNaturalImpressions = row.organicEbayImpressions;
        item.trafficNaturalViews = row.organicEbayViews;
        item.trafficTop20Change = row.top20Change;
        item.trafficNonSearchChange = row.nonSearchChange;
      }
      for (const row of dataState.ads.plpRows || []) {
        const candidates = [...map.entries()].filter(([, item]) => item.date === row.date && titleKey(item.title) === titleKey(row.title));
        const key = candidates.find(([, item]) => item.hasDailyTraffic)?.[0] || candidates[0]?.[0] || `${row.date}|${row.itemId}`;
        if (!map.has(key)) map.set(key, { date: row.date, itemId: row.itemId, title: row.title, price: 0, available: 0, campaigns: new Set(), adImpressions: 0, adClicks: 0, adSold: 0, organicSold: 0, totalSold: 0, adSales: 0, adFees: 0, organicClicks: 0, organicImpressions: 0 });
        const item = map.get(key);
        item.title = item.title || row.title;
        item.plpCampaigns = item.plpCampaigns || new Set();
        item.plpCampaigns.add(row.campaign);
        item.plpImpressions = (item.plpImpressions || 0) + row.impressions;
        item.plpClicks = (item.plpClicks || 0) + row.clicks;
        item.plpSold = (item.plpSold || 0) + row.sold;
        item.plpSales = (item.plpSales || 0) + row.sales;
        item.plpFees = (item.plpFees || 0) + row.adFees;
      }
      return [...map.values()].map(item => ({ ...item, campaigns: [...item.campaigns], plpCampaigns: [...(item.plpCampaigns || [])], ctr: item.adClicks / item.adImpressions || 0, conversion: item.adSold / item.adClicks || 0, roas: item.adSales / item.adFees || 0, plpCtr: item.plpClicks / item.plpImpressions || 0, plpConversion: item.plpSold / item.plpClicks || 0, plpRoas: item.plpSales / item.plpFees || 0 })).sort((a, b) => b.date.localeCompare(a.date) || a.itemId.localeCompare(b.itemId));
    }

    function filteredDaily() {
      const query = ui.query.toLowerCase();
      return aggregateDaily().filter(row => (!ui.start || row.date >= ui.start) && (!ui.end || row.date <= ui.end) && (!query || row.itemId.toLowerCase().includes(query) || row.title.toLowerCase().includes(query)));
    }

    function trafficPeriods() {
      return unique(dataState.trafficRaw.map(row => `${row.start}|${row.end}`)).map(key => {
        const [start, end] = key.split('|');
        return { key, start, end };
      }).sort((a, b) => Number(b.start !== b.end) - Number(a.start !== a.end) || b.end.localeCompare(a.end) || a.start.localeCompare(b.start));
    }

    function trafficSelection() {
      const daily = dataState.trafficRaw.filter(row => row.start && row.start === row.end && inProduct(row));
      const dates = unique(daily.map(row => row.start)).sort();
      const start = ui.start || dates[0] || '';
      const end = ui.end || dates.at(-1) || '';
      if (!start || !end || start > end) return { rows: [], note: '请选择有效日期，开始日期不能晚于结束日期。', complete: false };
      const snapshot = dataState.trafficRaw.filter(row => row.start === start && row.end === end && inProduct(row)).map(row => ({ ...row }));
      const selected = daily.filter(row => row.start >= start && row.start <= end).sort((a, b) => a.start.localeCompare(b.start));
      const covered = new Set(selected.map(row => row.start));
      const dayCount = Math.floor((Date.parse(end) - Date.parse(start)) / 86400000) + 1;
      const missingCount = dayCount - covered.size;
      const missing = [];
      for (let stamp = Date.parse(start); missing.length < Math.min(missingCount, 10) && stamp <= Date.parse(end); stamp += 86400000) {
        const date = new Date(stamp).toISOString().slice(0, 10);
        if (!covered.has(date)) missing.push(date);
      }
      const fields = ['totalImpressions','quantitySold','top20Promoted','top20Organic','restSearch','totalSearch','nonSearchPromoted','nonSearchOrganic','promotedEbayImpressions','promotedOffsiteImpressions','organicEbayImpressions','totalPageViews','promotedEbayViews','promotedExternalViews','organicEbayViews','organicExternalViews'];
      const items = new Map();
      for (const row of selected) {
        if (!items.has(row.itemId)) items.set(row.itemId, { ...row, key: `${start}|${end}|${row.itemId}`, start, end, top20Change: null, nonSearchChange: null, ...Object.fromEntries(fields.map(field => [field, 0])) });
        const item = items.get(row.itemId);
        item.title = row.title || item.title;
        fields.forEach(field => item[field] += row[field] || 0);
      }
      const coverage = missingCount ? `仅覆盖 ${covered.size}/${dayCount} 天，缺少日报：${missing.join('、')}${missingCount > 10 ? `等 ${missingCount} 天` : ''}；Traffic 合计不完整，缺失日期不补零。` : `已按日报汇总 ${covered.size} 天。`;
      const useSnapshot = snapshot.length > 0 && ui.trafficSource !== 'daily';
      // 换品检测（只标注，历史值不剔除）：区间快照按导出时标题归属整个区间，
      // 若链接期间卖过别的商品（itemId 复用改标题），快照会包含前身商品的数据。
      // 判据两类：① 标题历史里有与当前视图不同的产品归属且日期与区间有交集；
      // ② 无历史证据但日报覆盖不满且快照曝光远大于日报相加。
      const coverageByItem = new Map();
      for (const row of selected) coverageByItem.set(row.itemId, (coverageByItem.get(row.itemId) || 0) + 1);
      const swaps = [];
      if (useSnapshot && start !== end) {
        const history = dataState.itemHistory || {};
        const singleProduct = ui.product && ui.product !== PRODUCT_ALL;
        for (const row of snapshot) {
          const hist = history[row.itemId] || [];
          const foreign = hist.filter(h => h.f <= end && h.l >= start && (singleProduct ? h.p !== ui.product : h.p === null));
          const dailyImp = items.get(row.itemId)?.totalImpressions ?? null;
          const coveredDays = coverageByItem.get(row.itemId) || 0;
          const snapshotImp = Number(row.totalImpressions) || 0;
          const gapImp = dailyImp == null ? null : snapshotImp - dailyImp;
          const suspect = foreign.length > 0 || (dailyImp != null && coveredDays < dayCount && gapImp > 200 && gapImp / Math.max(snapshotImp, 1) > 0.3);
          if (!suspect) continue;
          swaps.push({ itemId: row.itemId, title: row.title, foreign, coveredDays, dayCount, snapshotImp, dailyImp, gapImp });
        }
        swaps.sort((a, b) => (b.gapImp ?? 0) - (a.gapImp ?? 0) || b.snapshotImp - a.snapshotImp);
      }
      // 换品销量剔除（2026-11-12 用户拍板：直接剔除非本体时期的出单，其余数值保留）：
      // 区间快照的 Quantity sold 按导出时标题归属整个区间，会包含前身商品时期的出单；
      // 日报按当天标题判定、前身时期行在构建期已被过滤，因此用日报重算「本体时期」出单：
      // 本体时期日报覆盖完整 → 快照销量替换为日报合计并记录剔除量；覆盖不全 → 保留快照原值并标注不确定。
      let soldAdjustedCount = 0;
      let soldExcludedTotal = 0;
      let manualAdjustedCount = 0;
      if (useSnapshot && start !== end) {
        const history = dataState.itemHistory || {};
        const singleProduct = ui.product && ui.product !== PRODUCT_ALL;
        for (const row of snapshot) {
          if (MANUAL_SOLD_EXCLUSIONS[row.itemId]) continue; // 人工核对剔除的链接走下方手工剔除，避免两套口径叠加
          const hist = history[row.itemId] || [];
          // 前身按「产品」判定（与上方换品检测同口径）：同产品改标题文案不算换品，
          // 否则会把本体在旧标题下的真实出单误剔（如 AD600 Elite 820216825374 改写标题后的出单）。
          const foreign = hist.filter(h => singleProduct ? h.p !== ui.product : h.p === null);
          if (!foreign.length) continue;
          const prevLast = foreign.reduce((m, h) => h.l > m ? h.l : m, '');
          const eraStartDay = new Date(Date.parse(prevLast) + 86400000).toISOString().slice(0, 10);
          const raw = Number(row.quantitySold) || 0;
          if (eraStartDay > end) {
            // 本体时期晚于窗口结束：整个窗口都是前身时期，快照销量全部为前身出单
            row.soldRaw = raw;
            row.soldExcluded = raw;
            row.quantitySold = 0;
            soldAdjustedCount += 1;
            soldExcludedTotal += Math.max(raw, 0);
            continue;
          }
          const eraStart = eraStartDay > start ? eraStartDay : start;
          const eraDays = Math.floor((Date.parse(end) - Date.parse(eraStart)) / 86400000) + 1;
          const eraRows = selected.filter(r => r.itemId === row.itemId && r.start >= eraStart);
          const eraCovered = new Set(eraRows.map(r => r.start)).size;
          if (eraCovered === 0) { row.soldUncertain = true; row.soldRaw = raw; continue; }
          const eraSold = eraRows.reduce((s, r) => s + (Number(r.quantitySold) || 0), 0);
          row.soldRaw = raw;
          if (eraCovered < eraDays) row.soldUncertain = true; // 本体时期日报覆盖不全：暂按已覆盖日报剔除，标注或有偏差
          if (eraSold === raw) continue;
          row.soldExcluded = raw - eraSold;
          row.quantitySold = eraSold;
          soldAdjustedCount += 1;
          soldExcludedTotal += Math.max(row.soldExcluded, 0);
        }
      }
      // 手工核对换品剔除（2026-11-12 用户按订单记录核对）：这些链接的前身标题在报表里看不到、
      // itemHistory 覆盖不到，由人工指定「哪些日期的出单属于前身商品」（日度行已在载入时剔除）；
      // 区间快照按窗口覆盖到的手工剔除日期+台数扣减销量。
      if (useSnapshot) {
        for (const row of snapshot) {
          const manual = MANUAL_SOLD_EXCLUSIONS[row.itemId];
          if (!manual) continue;
          const excluded = Object.entries(manual.exclude).reduce((total, [date, qty]) => (date >= start && date <= end ? total + Number(qty || 0) : total), 0);
          if (!(excluded > 0)) continue;
          const base = Number(row.quantitySold) || 0;
          const cut = Math.min(excluded, Math.max(base, 0));
          if (!(cut > 0)) continue;
          row.soldRaw = row.soldRaw ?? base;
          row.soldExcluded = (row.soldExcluded || 0) + cut;
          row.soldManual = true;
          row.quantitySold = Math.max(base - cut, 0);
          soldAdjustedCount += 1;
          soldExcludedTotal += cut;
          manualAdjustedCount += 1;
          if (start !== end) {
            const existingSwap = swaps.find(swap => swap.itemId === row.itemId);
            if (existingSwap) { existingSwap.manual = manual; existingSwap.manualExcluded = cut; }
            else swaps.push({ itemId: row.itemId, title: row.title, foreign: [], manual, manualExcluded: cut,
              coveredDays: coverageByItem.get(row.itemId) || 0, dayCount,
              snapshotImp: Number(row.totalImpressions) || 0, dailyImp: items.get(row.itemId)?.totalImpressions ?? null, gapImp: null });
          }
        }
        swaps.sort((a, b) => (b.manualExcluded || 0) - (a.manualExcluded || 0) || (b.gapImp ?? 0) - (a.gapImp ?? 0) || b.snapshotImp - a.snapshotImp);
      }
      const swapNote = swaps.length ? `检测到 ${swaps.length} 个链接在区间内换过标题/商品：销量已剔除非本体时期的出单，曝光/PV 等其余数值含前身商品数据、按口径保留（明细见下方快照面板）。` : '';
      const soldAdjustNote = soldAdjustedCount || swaps.length
        ? `销量口径：${soldAdjustedCount} 个换品链接的快照销量已剔除非本体时期的出单${soldExcludedTotal > 0 ? `（共剔除 ${fmt(soldExcludedTotal)} 台）` : ''}${manualAdjustedCount ? `，其中 ${manualAdjustedCount} 个链接按 2026-11-12 人工订单核对剔除` : ''}；本体时期日报覆盖不全的链接按已覆盖日报剔除并标注不确定。`
        : '';
      const comparisons = new Map((start !== end ? snapshot : []).map(row => {
        const dailyRow = items.get(row.itemId);
        return [row.itemId, { cumulativePV: row.totalPageViews, dailyPV: dailyRow?.totalPageViews ?? null,
          difference: dailyRow ? dailyRow.totalPageViews - row.totalPageViews : null }];
      }));
      const mismatchCount = [...comparisons.values()].filter(row => row.difference != null && row.difference !== 0).length;
      const reconciliation = start === end ? '单日报表，不涉及区间累计对账。' : snapshot.length
        ? `同区间核对：${mismatchCount} 个 Item 的日报合计总PV与累计总PV不一致，明细见“PV核对”。日度数据不按累计值补写。${swapNote} ${soldAdjustNote}`
        : '没有同区间累计报表可供核对；日报合计尚未与累计报表对账，不能作为后台近30天Views的直接替代。';
      const sourceNote = useSnapshot
        ? `Traffic：${start === end ? '单日报表' : '使用原始区间累计报表，起止日期与所选日期完全一致'}。${reconciliation}`
        : `Traffic：日报汇总。${coverage} ${reconciliation}`;
      return { rows: useSnapshot ? snapshot : [...items.values()], comparisons, swaps,
        note: `${sourceNote} 总PV包含站内和站外访问；站内PV仅计算站内来源。CTR按站内PV/曝光计算，转化率按销量/总PV计算。`,
        complete: useSnapshot || missingCount === 0 };
    }

    function trafficPeriodRows() {
      return trafficSelection().rows;
    }

    function latestTrafficRows() {
      const query = ui.query.toLowerCase();
      return trafficPeriodRows().filter(row => !query || row.itemId.toLowerCase().includes(query) || row.title.toLowerCase().includes(query));
    }

    function plgDateRange() {
      const dates = dataState.plgRaw.filter(row => inProduct(row)).map(row => row.date).filter(date => (!ui.start || date >= ui.start) && (!ui.end || date <= ui.end)).sort();
      return [dates[0] || '', dates[dates.length - 1] || ''];
    }

    function plpDateRange() {
      const dates = (dataState.ads.plpRows || []).map(row => row.date).filter(date => (!ui.start || date >= ui.start) && (!ui.end || date <= ui.end)).sort();
      return [dates[0] || '', dates.at(-1) || ''];
    }

    function shanghaiToday() {
      return new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
    }

    function listingAgeDays(date) {
      const days = (Date.parse(shanghaiToday()) - Date.parse(date)) / 86400000;
      return Number.isFinite(days) && days >= 0 ? Math.floor(days) : null;
    }

    function itemPerformance(includeRoster = false) {
      const activeMap = new Map((dataState.activeListings?.items || []).map(row => [row.itemId, row]));
      const listingDates = new Map();
      // 先读取PLG日期，再用Traffic日期覆盖；同一来源采用最新报表中的有效值。
      for (const rows of [dataState.plgRaw, dataState.trafficRaw]) {
        [...rows].sort((a, b) => (a.end || a.date || '').localeCompare(b.end || b.date || '')).forEach(row => {
          if (row.listingStartDate) listingDates.set(row.itemId, row.listingStartDate);
        });
      }
      const selection = trafficSelection();
      const trafficRows = selection.rows;
      const trafficMap = new Map(trafficRows.map(row => [row.itemId, row]));
      const plgMap = new Map();
      // 售价口径：Price (Current or Last Price) 是「导出那一刻的当前价」，同一天在不同批次导出里会给出不同值。
      // 所以按 priceAt（该行所属文件的导出时间）取最新一条，而不是按遍历顺序覆盖（否则行序决定显示的是哪个价）。
      const latestPrice = new Map();
      for (const row of dataState.plgRaw) {
        if (!row.price || !inProduct(row)) continue;
        const at = row.priceAt || row.date || '';
        const previous = latestPrice.get(row.itemId);
        if (!previous || at >= previous.at) latestPrice.set(row.itemId, { at, price: row.price });
      }
      for (const row of dataState.plgRaw.filter(row => inProduct(row) && (!ui.start || row.date >= ui.start) && (!ui.end || row.date <= ui.end))) {
        if (!plgMap.has(row.itemId)) plgMap.set(row.itemId, { itemId: row.itemId, title: row.title, price: row.price, totalSold: 0, organicSold: 0, adImpressions: 0, adClicks: 0, adSold: 0, adSales: 0, adFees: 0 });
        const item = plgMap.get(row.itemId);
        item.title = row.title || item.title;
        item.price = row.price || item.price;
        ['totalSold','organicSold','adImpressions','adClicks','adSold','adSales','adFees'].forEach(field => item[field] += row[field] || 0);
      }
      const preferredItemId = new Map();
      trafficRows.forEach(row => preferredItemId.set(titleKey(row.title), row.itemId));
      plgMap.forEach(row => { if (!preferredItemId.has(titleKey(row.title))) preferredItemId.set(titleKey(row.title), row.itemId); });
      const plpMap = new Map();
      for (const row of (dataState.ads.plpRows || []).filter(row => (!ui.start || row.date >= ui.start) && (!ui.end || row.date <= ui.end))) {
        const itemId = preferredItemId.get(titleKey(row.title)) || row.itemId;
        if (!plpMap.has(itemId)) plpMap.set(itemId, { itemId, title: row.title, campaigns: new Set(), impressions: 0, clicks: 0, sold: 0, sales: 0, adFees: 0 });
        const item = plpMap.get(itemId);
        item.title = row.title || item.title;
        item.campaigns.add(row.campaign);
        ['impressions','clicks','sold','sales','adFees'].forEach(field => item[field] += row[field] || 0);
      }
      const ids = unique([...trafficMap.keys(), ...plgMap.keys(), ...plpMap.keys(), ...(includeRoster ? activeMap.keys() : [])]);
      const query = ui.query.toLowerCase();
      return ids.map(itemId => {
        const traffic = trafficMap.get(itemId);
        const plg = plgMap.get(itemId);
        const plp = plpMap.get(itemId);
        const ebayViews = traffic ? traffic.promotedEbayViews + traffic.organicEbayViews : 0;
        const externalViews = traffic ? traffic.promotedExternalViews + traffic.organicExternalViews : 0;
        return {
          itemId,
          listingStatus: !dataState.activeListings ? 'unknown' : activeMap.has(itemId) ? 'active' : 'absent',
          listingStatusText: !dataState.activeListings ? '状态待确认' : activeMap.has(itemId) ? '在售' : '不在最新在售名单',
          link: `https://www.ebay.com/itm/${itemId}`,
          listingStartDate: listingDates.get(itemId) || '',
          listingAgeDays: listingAgeDays(listingDates.get(itemId)),
          title: traffic?.title || plg?.title || plp?.title || activeMap.get(itemId)?.title || '',
          hasTraffic: Boolean(traffic), hasPlg: Boolean(plg), hasPlp: Boolean(plp),
          salesMismatch: Boolean(traffic && plg && traffic.quantitySold !== plg.totalSold),
          naturalImpressions: traffic?.organicEbayImpressions || 0,
          promotedImpressions: traffic?.promotedEbayImpressions || 0,
          naturalViews: traffic?.organicEbayViews || 0,
          naturalSold: plg?.organicSold || 0,
          naturalCtr: traffic ? traffic.organicEbayViews / traffic.organicEbayImpressions || 0 : 0,
          totalImpressions: traffic?.totalImpressions || 0,
          top20Change: traffic?.top20Change ?? null,
          nonSearchChange: traffic?.nonSearchChange ?? null,
          ebayViews, externalViews,
          totalPageViews: traffic?.totalPageViews || 0,
          pvAudit: (() => {
            if (!traffic) return '缺Traffic';
            const check = selection.comparisons?.get(itemId);
            const swapTag = (selection.swaps || []).some(swap => swap.itemId === itemId) ? '（含前身商品数据）' : '';
            if (!check) return traffic.start === traffic.end ? '单日报表' : `仅日报，未对账${swapTag}`;
            if (check.dailyPV == null) return `累计${check.cumulativePV}，缺日报记录${swapTag}`;
            return check.difference === 0 ? '日报与累计一致' : `日报${check.dailyPV} / 累计${check.cumulativePV}，差额${check.difference > 0 ? '+' : ''}${check.difference}${swapTag}`;
          })(),
          quantitySold: traffic?.quantitySold || 0,
          totalCtr: traffic ? ebayViews / traffic.totalImpressions || 0 : 0,
          totalConversion: traffic ? traffic.quantitySold / traffic.totalPageViews || 0 : 0,
          price: latestPrice.get(itemId)?.price || plg?.price || 0, plgTotalSold: plg?.totalSold || 0,
          adImpressions: plg?.adImpressions || 0, adClicks: plg?.adClicks || 0, adSold: plg?.adSold || 0,
          adCtr: plg ? plg.adClicks / plg.adImpressions || 0 : 0,
          adSales: plg?.adSales || 0, adFees: plg?.adFees || 0, roas: plg ? plg.adSales / plg.adFees || 0 : 0,
          plpCampaigns: plp ? [...plp.campaigns] : [],
          plpImpressions: plp?.impressions || 0, plpClicks: plp?.clicks || 0, plpSold: plp?.sold || 0,
          plpSales: plp?.sales || 0, plpFees: plp?.adFees || 0,
          plpCtr: plp ? plp.clicks / plp.impressions || 0 : 0,
          plpConversion: plp ? plp.sold / plp.clicks || 0 : 0,
          plpRoas: plp ? plp.sales / plp.adFees || 0 : 0,
          plpAvgCpc: plp ? plp.adFees / plp.clicks || 0 : 0,
          plpAcos: plp ? plp.adFees / plp.sales || 0 : 0
        };
      }).filter(row => !query || row.itemId.includes(query) || row.title.toLowerCase().includes(query)).sort((a, b) => b.totalImpressions - a.totalImpressions || b.adSales - a.adSales);
    }

    function dailyItemRecords() {
      const query = ui.query.toLowerCase();
      return aggregateDaily().filter(row => inProduct(row) && (!ui.start || row.date >= ui.start) && (!ui.end || row.date <= ui.end) && (!query || row.itemId.includes(query) || row.title.toLowerCase().includes(query))).map(row => {
        return {
          ...row,
          link: `https://www.ebay.com/itm/${row.itemId}`,
          trafficCtr: row.hasDailyTraffic ? row.trafficEbayViews / row.trafficTotalImpressions || 0 : 0,
          trafficConversion: row.hasDailyTraffic ? row.trafficSold / row.trafficPageViews || 0 : 0,
          trafficNaturalCtr: row.hasDailyTraffic ? row.trafficNaturalViews / row.trafficNaturalImpressions || 0 : 0
        };
      }).sort((a, b) => b.date.localeCompare(a.date) || b.trafficTotalImpressions - a.trafficTotalImpressions || a.itemId.localeCompare(b.itemId));
    }

    function baseLayout(content) {
      const pages = [
        ['dashboard', 'layout-dashboard', '经营看板'],
        ['ads', 'megaphone', '广告看板'],
        ['detail', 'table-2', 'Item 明细'],
        ['import', 'file-up', '数据导入'],
        ['daily', 'calendar-range', '每日记录']
      ].filter(([id]) => !SHARED_READONLY || id !== 'import');
      return `<header class="topbar">
        <div class="brand"><div class="brand-mark">${icon('chart-no-axes-combined', 19)}</div><div><h1>eBay 流量与广告看板</h1><p>${PRODUCTS.map(product => product.label).join(' · ')} ｜ Traffic + PLG + PLP + 关键词</p></div></div>
        <div class="product-switch" role="group" aria-label="产品范围">${productSwitch()}</div>
        <div class="status"><span class="status-dot"></span><span>${SHARED_READONLY ? '在线只读版' : '数据仅保存在当前浏览器'}</span></div>
      </header>
      <div class="workspace">
        <aside class="sidebar"><nav class="nav">${pages.map(([id, ico, label]) => `<button class="nav-btn ${ui.page === id ? 'active' : ''}" data-page="${id}">${icon(ico)}<span>${label}</span></button>`).join('')}</nav></aside>
        <main class="content">${content}</main>
      </div>`;
    }

    function filterPanel(dateScope = 'PLG') {
      const periods = trafficPeriods();
      const selectedPeriod = ui.trafficPeriod === 'custom' ? 'custom' : periods.find(period => period.start === ui.start && period.end === ui.end)?.key || 'custom';
      return `<div class="panel filters">
        <div class="field"><label>搜索 Item ID 或标题</label><input class="input" id="queryFilter" value="${esc(ui.query)}" placeholder="输入 Item ID 或关键词" /></div>
        ${dateScope === '每日记录' ? '' : `<div class="field"><label>报表快捷区间</label><select class="input" id="trafficPeriodFilter"><option value="custom" ${selectedPeriod === 'custom' ? 'selected' : ''}>自选日期（同区间累计优先）</option>${periods.map(period => `<option value="${esc(period.key)}" ${selectedPeriod === period.key ? 'selected' : ''}>${esc(rangeText(period.start, period.end))}${period.start === period.end ? '（单日）' : '（累计报表）'}</option>`).join('')}</select></div>`}
        <div class="field" style="${dateScope === '每日记录' ? 'display:none' : ''}"><label for="trafficSourceFilter">Traffic 汇总来源</label><select class="input" id="trafficSourceFilter" aria-describedby="trafficSourceBrief"><option value="auto" ${ui.trafficSource !== 'daily' ? 'selected' : ''}>同区间累计报表优先</option><option value="daily" ${ui.trafficSource === 'daily' ? 'selected' : ''}>仅按日报汇总（用于趋势/对账）</option></select><small class="field-help" id="trafficSourceBrief">两种来源可能存在差额，不能仅凭差额判错。具体规则及原因见下方说明。</small></div>
        <div class="field"><label>开始日期${dateScope === '每日记录' ? '' : '（Traffic + 广告）'}</label><input class="input" id="startFilter" type="date" value="${esc(ui.start)}" /></div>
        <div class="field"><label>结束日期${dateScope === '每日记录' ? '' : '（Traffic + 广告）'}</label><input class="input" id="endFilter" type="date" value="${esc(ui.end)}" /></div>
        <details class="traffic-source-help"><summary>Traffic 来源说明：${dateScope === '每日记录' ? '每日记录只使用单日报表' : '累计快照与日报相加有何区别'}（点击展开）</summary>
          <p><strong>同区间累计报表优先：</strong>只有累计报表内部标注的起止日期与所选日期完全一致时，才使用该区间快照；没有匹配报表则回退到已有日报相加。累计报表是某次导出时的快照，“优先使用”不代表它一定更准确。</p>
          <p><strong>仅按日报汇总：</strong>按同一 Item 将所选日期内的原始日报相加，适合查看每日趋势和对账。缺失日期或缺失 Item 行不视为实际为零，也不会用累计差额补写每天的数据。每日记录页面始终使用单日报表。</p>
          <p><strong>为什么可能有差额？</strong></p>
          <ul>
            <li><strong>数据时点不同：</strong>报表标注的结束日期相同，不代表该日已经结束、数据已经更新完成，或两次导出覆盖了相同的数据处理状态。不能只凭日期文字相同就认定两份报表完全可比。</li>
            <li><strong>链接范围不同：</strong>Traffic报表注明只包含生成时仍处于活跃状态的链接；后来暂停的 Item 可能不在新报表中，但历史日报仍保留。缺少该行不等于该 Item 的历史表现为零。</li>
            <li><strong>仍待确认的原因：</strong>更新延迟、后续修订、时区边界或统计规则可能影响结果，现有文件尚不能确定具体原因；不能据此认定存在跨天去重。</li>
          </ul>
          <p><strong>如何读“PV核对”：</strong>差额＝已有日报合计总PV－同区间累计总PV，正数表示日报更大。它只表示文件之间有差额，尚不能直接判定哪一份数据错误。“日报与累计一致”也只代表数值一致，不代表已确认每日记录齐全、结束日完整或数据最终准确。</p>
          <p><strong>换品链接（itemId 复用）：</strong>区间快照按“导出那一刻的标题”把整个区间的数据归属给该链接；如果链接中途改标题换了商品（例如 ONE Lite 改成 UD900E），快照值会包含前身商品的数据，而日报按当天标题判定、不含前身时段。<strong>销量处理（2026-11-12 定稿）：换品链接的快照销量一律剔除非本体时期的出单</strong>——用日报重算本体时期的 Quantity sold 替换快照值，剔除量在快照面板标注；本体时期日报覆盖不全时保留快照原值并标注“可能含前身出单”。曝光、PV、点击等其余数值仍含前身商品数据、按口径保留不剔除。</p>
          <p><strong>指标口径：</strong>总PV包含站内和站外访问；站内PV只是其中一部分。与后台“Views (30 days)”比较前，还要核实其日期范围和指标定义。</p>
        </details>
      </div>`;
    }

    function salesReconciliationNote(rows) {
      const differences = rows.filter(row => row.salesMismatch);
      if (!differences.length) return '';
      return `销量待核对：${differences.slice(0, 5).map(row => `Item ${row.itemId}：Traffic ${row.quantitySold}，PLG报表总销量 ${row.plgTotalSold}`).join('；')}${differences.length > 5 ? `等 ${differences.length} 个 Item` : ''}。两套源报表数值不一致，Traffic销量及转化率按Traffic原值展示；实际总销量需用同区间新报表或订单明细确认。`;
    }

    function metric(label, value, foot) { return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`; }

    function dashboardPage() {
      const rows = itemPerformance();
      if (!rows.length) return `<div class="page-head"><h2>经营看板</h2></div>${filterPanel()}<div class="snapshot-note">${esc(trafficSelection().note)}</div><div class="panel empty">当前日期范围没有数据，请调整开始、结束日期。</div>`;
      const trafficRows = trafficPeriodRows();
      const [plgStart, plgEnd] = plgDateRange();
      const [plpStart, plpEnd] = plpDateRange();
      const trafficRange = trafficRows.length ? rangeText(trafficRows[0].start, trafficRows[0].end) : '未上传';
      const impressions = sum(rows, 'totalImpressions');
      const ebayViews = sum(rows, 'ebayViews');
      const externalViews = sum(rows, 'externalViews');
      const sold = sum(rows, 'quantitySold');
      const totalViews = sum(rows, 'totalPageViews');
      const hasTraffic = rows.some(row => row.hasTraffic);
      const adSales = sum(rows, 'adSales');
      const adFees = sum(rows, 'adFees');
      const plpSales = sum(rows, 'plpSales');
      const plpFees = sum(rows, 'plpFees');
      return `<div class="page-head"><div><h2>经营看板</h2><p>按同一 Item 和日期统一查看整体流量、自然流量、PLG 与 PLP 广告表现。</p></div><div class="actions"><button class="btn" id="exportBtn">${icon('download')}导出 Item 数据</button>${SHARED_READONLY ? '' : `<button class="btn primary" id="topUploadBtn">${icon('upload')}上传报表</button>`}</div></div>
        ${filterPanel()}
        <div class="snapshot-note">统计范围：${rangeText(ui.start, ui.end)}；Traffic：${trafficRange}；PLG：${rangeText(plgStart, plgEnd)}；PLP：${rangeText(plpStart, plpEnd)}。${esc(trafficSelection().note)}</div>
        ${rows.some(row => row.salesMismatch) ? `<div class="snapshot-note">${esc(salesReconciliationNote(rows))}</div>` : ''}
        <section class="metrics">
          ${metric('链接总曝光', hasTraffic ? fmt(impressions) : '—', `${fmt(rows.filter(row => row.hasTraffic).length)} 个 Item 有 Traffic`)}
          ${metric('总PV（Total page views）', hasTraffic ? fmt(totalViews) : '—', '站内 + 站外全部访问')}
          ${metric('站内PV（eBay）', hasTraffic ? fmt(ebayViews) : '—', '站内广告 + 站内自然')}
          ${metric('站外PV（External）', hasTraffic ? fmt(externalViews) : '—', '站外广告 + 站外自然')}
          ${metric('销量（Traffic）', hasTraffic ? fmt(sold) : '—', hasTraffic ? `Traffic转化率 ${pct(sold / totalViews || 0)}${rows.some(row => row.salesMismatch) ? '；存在销量差异，待核对' : ''}` : '当前区间缺少 Traffic')}
          ${metric('链接总 CTR', hasTraffic ? pct(ebayViews / impressions || 0) : '—', 'eBay Page views ÷ 总曝光')}
          ${metric('广告销售额', money(adSales + plpSales), `PLG ${money(adSales)} + PLP ${money(plpSales)}`)}
          ${metric('总广告费', money(adFees + plpFees), `PLG ${money(adFees)} + PLP ${money(plpFees)}`)}
          ${metric('综合 ROAS', fmt((adSales + plpSales) / (adFees + plpFees) || 0, 2), '广告销售额 ÷ 总广告费')}
        </section>
        <section class="dashboard-grid">
          <div class="panel"><div class="panel-head"><h3>Item 总曝光排名</h3><small>Traffic 整体表现</small></div><div id="itemChart" class="chart"></div></div>
          <div class="panel"><div class="panel-head"><h3>Item eBay PV 排名</h3><small>Traffic 站内 Page views</small></div><div id="ebayPvChart" class="chart"></div></div>
        </section>
        <section class="dashboard-grid">
          <div class="panel"><div class="panel-head"><h3>流量与广告曝光对比</h3><small>统一查看 Traffic、自然、PLG、PLP</small></div><div id="channelChart" class="chart"></div></div>
          <div class="panel"><div class="panel-head"><h3>每日流量与广告互动趋势</h3><small>eBay PV 与广告点击按日对比</small></div><div id="trendChart" class="chart"></div></div>
        </section>
        <section class="panel"><div class="panel-head"><h3>Item 整体链接表现</h3><small>整体曝光、PV、销量、CTR 与转化率</small></div>${itemSummaryTable(rows)}</section>`;
    }

    function emptyDashboard() {
      return `<div class="page-head"><div><h2>经营看板</h2><p>${SHARED_READONLY ? '等待维护者更新报表后自动生成。' : '上传两类 eBay CSV 后自动生成。'}</p></div></div><div class="panel empty">${icon('chart-no-axes-combined', 30)}<div>还没有可展示的数据</div>${SHARED_READONLY ? '' : `<div style="margin-top:14px"><button class="btn primary" id="topUploadBtn">${icon('upload')}上传 Traffic + PLG</button></div>`}</div>`;
    }

    function itemSummaryTable(rows) {
      if (!rows.length) return `<div class="empty">当前筛选范围没有 Item 数据</div>`;
      const sorted = sortRows(rows, 'summary');
      return `<div class="table-wrap"><table><thead><tr>${sortHeader('Item ID', 'itemId', 'summary')}${sortHeader('标题', 'title', 'summary')}${sortHeader('上架日期', 'listingStartDate', 'summary')}${sortHeader('距今上架时间', 'listingAgeDays', 'summary')}${sortHeader('总PV', 'totalPageViews', 'summary')}${sortHeader('总曝光', 'totalImpressions', 'summary')}${sortHeader('站内PV', 'ebayViews', 'summary')}${sortHeader('站外PV', 'externalViews', 'summary')}${sortHeader('销量（Traffic）', 'quantitySold', 'summary')}${sortHeader('总 CTR', 'totalCtr', 'summary')}${sortHeader('总转化率', 'totalConversion', 'summary')}${sortHeader('PV核对（日度减累计）', 'pvAudit', 'summary')}</tr></thead><tbody>${sorted.map(row => `<tr><td><a href="${esc(row.link)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td>${row.listingStartDate ? esc(row.listingStartDate) : '—'}</td><td>${row.listingAgeDays == null ? '—' : fmt(row.listingAgeDays) + ' 天'}</td><td>${row.hasTraffic ? fmt(row.totalPageViews) : '—'}</td><td>${row.hasTraffic ? fmt(row.totalImpressions) : '—'}</td><td>${row.hasTraffic ? fmt(row.ebayViews) : '—'}</td><td>${row.hasTraffic ? fmt(row.externalViews) : '—'}</td><td>${row.hasTraffic ? fmt(row.quantitySold) : '—'}${row.salesMismatch ? ' <span class="badge amber">待核对</span>' : ''}</td><td>${row.hasTraffic ? pct(row.totalCtr) : '—'}</td><td>${row.hasTraffic ? pct(row.totalConversion) : '—'}</td><td style="white-space:normal;min-width:180px">${esc(row.pvAudit)}</td></tr>`).join('')}</tbody></table></div>`;
    }

    function itemAdPerformanceTable(rows) {
      if (!rows.length) return `<div class="empty">当前筛选范围没有 Item 数据</div>`;
      const sorted = sortRows(rows, 'adsSummary');
      const matched = sortRows(rows.filter(row => row.hasPlp).sort((a, b) => b.plpImpressions - a.plpImpressions), 'plpMatched');
      const matchedTable = `<div class="panel-head"><h3>已匹配 PLP 的 Item 链接</h3><span class="badge blue">${fmt(matched.length)} 个</span></div><div class="table-wrap"><table id="plpMatchedItems"><thead><tr>${sortHeader('Item 链接', 'itemId', 'plpMatched')}${sortHeader('标题', 'title', 'plpMatched')}${sortHeader('Campaign', 'plpCampaigns', 'plpMatched')}${sortHeader('PLP曝光', 'plpImpressions', 'plpMatched', 'plp-col')}${sortHeader('PLP点击', 'plpClicks', 'plpMatched', 'plp-col')}${sortHeader('PLP CTR', 'plpCtr', 'plpMatched', 'plp-col')}${sortHeader('PLP广告费', 'plpFees', 'plpMatched', 'plp-col')}</tr></thead><tbody>${matched.map(row => `<tr><td><a href="${esc(row.link)}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700;text-decoration:underline">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td style="text-align:left">${esc(row.plpCampaigns.join('、'))}</td><td class="plp-col" data-value="plp-impressions">${fmt(row.plpImpressions)}</td><td class="plp-col">${fmt(row.plpClicks)}</td><td class="plp-col">${pct(row.plpCtr)}</td><td class="plp-col">${money(row.plpFees)}</td></tr>`).join('')}</tbody></table></div>`;
      const comparisonTable = `<div class="panel-head"><h3>全部 Item 的 PLG / PLP 对照</h3><small>没有对应 PLP 数据的 Item 显示 —</small></div><div class="table-wrap"><table id="itemAdPerformance" class="ad-summary-table"><thead><tr><th colspan="2">Item</th><th colspan="5" class="plg-col" style="text-align:center">PLG</th><th colspan="5" class="plp-col" style="text-align:center">PLP（已匹配 ${fmt(matched.length)} 个 Item）</th></tr><tr>${sortHeader('Item ID', 'itemId', 'adsSummary')}${sortHeader('标题', 'title', 'adsSummary')}${sortHeader('PLG曝光', 'adImpressions', 'adsSummary', 'plg-col')}${sortHeader('PLG点击', 'adClicks', 'adsSummary', 'plg-col')}${sortHeader('PLG CTR', 'adCtr', 'adsSummary', 'plg-col')}${sortHeader('PLG广告费', 'adFees', 'adsSummary', 'plg-col')}${sortHeader('PLG ROAS', 'roas', 'adsSummary', 'plg-col')}${sortHeader('PLP曝光', 'plpImpressions', 'adsSummary', 'plp-col')}${sortHeader('PLP点击', 'plpClicks', 'adsSummary', 'plp-col')}${sortHeader('PLP CTR', 'plpCtr', 'adsSummary', 'plp-col')}${sortHeader('PLP广告费', 'plpFees', 'adsSummary', 'plp-col')}${sortHeader('PLP ROAS', 'plpRoas', 'adsSummary', 'plp-col')}</tr></thead><tbody>${sorted.map(row => `<tr><td><a href="${esc(row.link)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">${esc(row.itemId)}</a></td><td class="item-title" title="${esc(row.title)}">${esc(row.title)}</td><td class="plg-col">${row.hasPlg ? fmt(row.adImpressions) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.adClicks) : '—'}</td><td class="plg-col">${row.hasPlg ? pct(row.adCtr) : '—'}</td><td class="plg-col">${row.hasPlg ? money(row.adFees) : '—'}</td><td class="plg-col">${row.hasPlg ? fmt(row.roas, 2) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpImpressions) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpClicks) : '—'}</td><td class="plp-col">${row.hasPlp ? pct(row.plpCtr) : '—'}</td><td class="plp-col">${row.hasPlp ? money(row.plpFees) : '—'}</td><td class="plp-col">${row.hasPlp ? fmt(row.plpRoas, 2) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
      return matchedTable + comparisonTable;
    }

    function trafficSnapshot() {
      const rows = latestTrafficRows();
      if (!rows.length) return '';
      const start = rows[0].start, end = rows[0].end;
      const impressions = sum(rows, 'totalImpressions');
      const views = sum(rows, 'totalPageViews');
      const sold = sum(rows, 'quantitySold');
      const onsiteViews = sum(rows, 'promotedEbayViews') + sum(rows, 'organicEbayViews');
      // 换品链接明细：销量已剔除非本体时期出单，曝光/PV 等其余数值保留
      const swaps = (trafficSelection().swaps || []).slice(0, 8);
      const swapsTotal = (trafficSelection().swaps || []).length;
      const swapHtml = start !== end && swapsTotal ? `<div class="snapshot-note"><strong>⚠ 区间内换过标题/商品的链接（销量已剔除非本体时期出单；曝光/PV 等其余数值保留）：</strong>${swaps.map(s => {
        const hist = s.manual
          ? `人工核对剔除（${esc(s.manual.reason)}）`
          : s.foreign.length
            ? s.foreign.map(h => `曾为「${esc(h.t.length > 34 ? h.t.slice(0, 34) + '…' : h.t)}」（${h.f.slice(5)}~${h.l.slice(5)}，${h.p ? esc(h.p) : '非目标产品'}）`).join('；')
            : `日报仅覆盖 ${s.coveredDays}/${s.dayCount} 天`;
        const gap = s.manual
          ? `快照按窗口扣减 ${fmt(s.manualExcluded)} 台`
          : s.dailyImp == null ? `快照曝光 ${fmt(s.snapshotImp)}，区间内无日报记录` : `快照曝光 ${fmt(s.snapshotImp)} vs 日报相加 ${fmt(s.dailyImp)}（差 ${s.gapImp > 0 ? '+' : ''}${fmt(s.gapImp)}）`;
        const srow = rows.find(r => r.itemId === s.itemId);
        const soldLine = !srow ? '' : srow.soldManual
          ? `；销量：快照累计 ${fmt(srow.soldRaw)} → 人工核对剔除 ${fmt(srow.soldExcluded)} 台（非本体出单），本体 ${fmt(srow.quantitySold)} 台`
          : srow.soldUncertain && srow.soldExcluded != null && srow.soldExcluded > 0
          ? `；销量：本体时期日报覆盖不全，暂按已覆盖日报 ${fmt(srow.quantitySold)}（快照原值 ${fmt(srow.soldRaw)}，剔除或有偏差）`
          : srow.soldUncertain
            ? `；销量：本体时期日报覆盖不全，保留快照原值 ${fmt(srow.soldRaw ?? srow.quantitySold)}（可能含前身出单）`
            : srow.soldExcluded != null && srow.soldExcluded > 0
              ? `；销量：快照累计 ${fmt(srow.soldRaw)} → 本体时期 ${fmt(srow.quantitySold)}（已剔除前身出单 ${fmt(srow.soldExcluded)} 台）`
              : '；销量：快照值即本体时期出单，未剔除';
        return `<div>· <span class="mono">${esc(s.itemId)}</span> ${hist} — ${gap}${soldLine}</div>`;
      }).join('')}${swapsTotal > 8 ? `<div>…等共 ${swapsTotal} 个</div>` : ''}快照按导出时标题把整个区间归属给该链接：销量已改用日报重算的本体时期出单，曝光/PV 等其余数值仍含前身商品数据、按口径保留。</div>` : '';
      return `<section class="panel snapshot"><div class="panel-head"><h3>Traffic 区间快照</h3><span class="badge ${start === end ? 'green' : 'amber'}">${start === end ? '单日' : '区间累计'}</span></div><div class="panel-body">
        ${start !== end ? `<p class="snapshot-note">这份 Traffic 是 ${rangeText(start, end)} 的累计数据，只用于区间汇总，不会混入上方的日度趋势。</p>` : ''}
        <div class="snapshot-metrics">
          <div class="snapshot-metric"><span>链接总曝光</span><strong>${fmt(impressions)}</strong></div>
          <div class="snapshot-metric"><span>总 Page views</span><strong>${fmt(views)}</strong></div>
          <div class="snapshot-metric"><span>Quantity sold</span><strong>${fmt(sold)}</strong></div>
          <div class="snapshot-metric"><span>站内 CTR</span><strong>${pct(onsiteViews / impressions || 0)}</strong></div>
          <div class="snapshot-metric"><span>总转化率</span><strong>${pct(sold / views || 0)}</strong></div>
        </div>${swapHtml}</div></section>`;
    }

    function dailyPage() {
      const rows = dailyItemRecords();
      const dates = unique(rows.map(row => row.date)).sort();
      const itemCount = unique(rows.map(row => row.itemId)).length;
      const trafficDates = unique(dataState.trafficRaw.filter(row => inProduct(row) && row.start && row.start === row.end).map(row => row.start)).sort();
      const plgDates = unique(dataState.plgRaw.filter(row => inProduct(row)).map(row => row.date)).sort();
      const missingTraffic = plgDates.filter(date => !trafficDates.includes(date));
      return `<div class="page-head"><div><h2>Item 每日记录</h2><p>按“日期 + Item ID”合并单日 Traffic、PLG 和 PLP。</p></div><div class="actions"><button class="btn" id="dailyExportBtn">${icon('download')}导出每日记录</button>${SHARED_READONLY ? '' : `<button class="btn primary" id="topUploadBtn">${icon('upload')}上传日报</button>`}</div></div>
        ${filterPanel('每日记录')}
        ${missingTraffic.length ? `<div class="snapshot-note">当前 PLG 有 ${fmt(plgDates.length)} 天日度数据，但单日 Traffic 有 ${fmt(trafficDates.length)} 天。缺少整体日度数据：${esc(missingTraffic.join('、'))}。请在 eBay 把 Traffic 报表开始和结束日期都设为同一天后下载。</div>` : `<div class="snapshot-note" style="color:var(--green);background:var(--green-soft);border-color:var(--green)">当前已导入的 PLG 日期均有对应单日 Traffic，可以查看完整 Item 日度表现。</div>`}
        <section class="metrics">
          ${metric('记录日期', fmt(dates.length), rangeText(dates[0], dates[dates.length - 1]))}
          ${metric('Item 数', fmt(itemCount), '标题匹配 AD600 Elite')}
          ${metric('PLG 日度记录', fmt(rows.filter(row => row.adImpressions || row.organicImpressions || row.totalSold).length), '广告与自然归因数据')}
          ${metric('Traffic 日度记录', fmt(rows.filter(row => row.hasDailyTraffic).length), '整体链接表现数据')}
        </section>
        <section class="panel"><div class="panel-head"><h3>每日 Item 明细</h3><small>${fmt(rows.length)} 行</small></div>${dailyRecordTable(rows)}</section>`;
    }

    function dailyRecordTable(rows) {
      if (!rows.length) return `<div class="empty">当前筛选范围没有每日记录</div>`;
      const sorted = sortRows(rows.map(row => ({ ...row, status: row.hasDailyTraffic ? '完整' : '缺Traffic', organicConversion: row.organicSold / row.trafficNaturalViews || 0 })), 'daily');
